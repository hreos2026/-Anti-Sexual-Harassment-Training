  modules:[
    {k:'purpose',eyebrow:'01 – Dlaczego to jest ważne',title:'Zero tolerancji oznacza zero wyjątków.',body:['EOS nie toleruje molestowania seksualnego — w żadnym miejscu, żadnym otoczeniu ani żadnym formacie.','Niniejsza polityka obowiązuje na całym świecie we wszystkich spółkach Grupy EOS i jest wiążąca dla wszystkich pracowników i kadry kierowniczej.','To szkolenie pomaga zrozumieć, co jest objęte polityką, co możesz zrobić i jak EOS rozpatruje zgłoszenia.'],activity:{type:'flip',prompt:'Trzy ważne fakty',cards:[{icon:'🌍',title:'Obowiązuje globalnie',text:'Wszystkie spółki Grupy EOS są objęte, niezależnie od wielkości czy struktury.'},{icon:'⚖️',title:'Wiążące dla wszystkich',text:'Kadra kierownicza, menedżerowie i pracownicy — wszyscy muszą przestrzegać polityki.'},{icon:'🎯',title:'Co daje to szkolenie',text:'Zwiększa świadomość, wyjaśnia granice i pokazuje dostępne opcje.'}]}},
    {k:'definition',eyebrow:'02 – Czym jest molestowanie seksualne?',title:'Nie chodzi o intencje. Chodzi o skutki.',body:['Molestowanie seksualne to niechciane zachowanie o charakterze seksualnym, które obraża, upokarza lub intimiduje daną osobę.','Może to być jednorazowy incydent lub wzorzec zachowania.','Kluczowe pytanie: czy zachowanie było niechciane przez osobę, do której było skierowane?'],activity:{type:'choice',prompt:'Scenariusz: Kolega przesyła przez firmowy czat dowcip o charakterze seksualnym. Odbiorca nie reaguje, ale czuje się niekomfortowo. Czy jest to molestowanie seksualne zgodnie z polityką EOS?',options:['Nie — nikt nic nie powiedział, więc nie było to niechciane.','Tak — zachowanie miało charakter seksualny i sprawiło, że odbiorca poczuł się niekomfortowo.','Tylko jeśli zdarzy się więcej niż raz.'],answer:1,ok:'Prawidłowo. Polityka jasno wskazuje, że liczy się to, czy zachowanie było niechciane przez odbiorcę — nie to, czy ktoś zaprotestował, ani czy się powtórzyło.',bad:'Nie do końca. Polityka koncentruje się na tym, czy zachowanie było niechciane przez odbiorcę. Milczenie nie oznacza, że zachowanie było mile widziane.'}},
    {k:'examples',eyebrow:'03 – Co się kwalifikuje?',title:'Trzy formy — wszystkie zabronione.',body:['Molestowanie seksualne może mieć charakter fizyczny, werbalny lub niewerbalny.','Poniższe przykłady nie są wyczerpujące. W razie wątpliwości zapytaj siebie: czy to zachowanie jest pożądane przez drugą osobę?'],activity:{type:'tabs',tabs:[{label:'Fizyczne',items:['Niechciany kontakt fizyczny: klepanie, szczypanie, głaskanie, całowanie, przytulanie, obmacywanie lub nieodpowiednie dotykanie — w tym pozornie przypadkowy kontakt.','Przemoc fizyczna, w tym napaść seksualna.','Wykorzystywanie gróźb lub nagród zawodowych w celu wymuszenia przysług seksualnych.']},{label:'Werbalne',items:['Uwagi seksualnie poniżające lub depersonalizujące dotyczące osób lub ich ciał.','Poniżające komentarze na temat życia seksualnego danej osoby.','Nieodpowiednie opowieści lub żarty seksualne.','Niechciane zaloty lub wielokrotne zaproszenia na randki lub do fizycznej intymności.','Protekcjonalne lub paternalistyczne uwagi.','Wysyłanie wiadomości o charakterze seksualnym.']},{label:'Niewerbalne',items:['Wystawianie materiałów o charakterze seksualnym lub sugestywnym.','Gesty o charakterze seksualnym.','Lubieżne spojrzenia.','Gwizdanie.']}]},quiz:{quiz:{type:'choice',prompt:'Który z poniższych przykładów jest formą niewerbalnego molestowania seksualnego?',options:['Wysyłanie wiadomości o charakterze seksualnym','Wpatrywanie się lub gwizdanie','Niechciany kontakt fizyczny'],answer:1,ok:'Prawidłowo. Wpatrywanie się i gwizdanie to niewerbalne formy molestowania seksualnego — bez słów ani kontaktu fizycznego.',bad:'Nie do końca. Pomyśl o trzech kategoriach: fizycznej, werbalnej i niewerbalnej. Wpatrywanie się i gwizdanie należą do kategorii niewerbalnej.'}}},
    {k:'boundaries',eyebrow:'04 – Gdzie obowiązuje?',title:'Miejsce pracy to więcej niż biuro.',body:['Zakaz obowiązuje na terenie EOS i poza regularnym miejscem pracy.','Obejmuje to sponsorowane przez firmę wydarzenia towarzyskie, podróże służbowe, szkolenia i konferencje.','Każda osoba może być poszkodowana, niezależnie od płci — w tym między osobami tej samej płci.'],activity:{type:'scenario',tag:'Scenariusz',text:'Podczas kolacji sponsorowanej przez EOS członek zespołu wielokrotnie komplementuje koleżankę w sposób, który wyraźnie ją krępuje. Koleżanka nic nie mówi, ale przez resztę wieczoru unika tej osoby.',question:'Czy to podlega polityce EOS?',answer:'Tak. Polityka obejmuje wydarzenia sponsorowane przez EOS poza regularnym miejscem pracy. Liczy się dyskomfort odczuwany przez osobę poszkodowaną — nie to, czy coś powiedziała.'}},
    {k:'affected',eyebrow:'05 – Jeśli to cię dotyczy',title:'Masz więcej możliwości niż myślisz.',body:['Nie musisz bezpośrednio konfrontować się z drugą osobą — szczególnie w relacjach nierównorzędnych.','EOS uznaje, że bezpośrednie zabranie głosu nie zawsze jest możliwe lub bezpieczne.','Niezależnie od wybranej drogi, twoje zgłoszenie zostanie rozpatrzone z zachowaniem poufności i szacunku.'],activity:{type:'steps',heading:'Twoje opcje krok po kroku',steps:['Jeśli jest to bezpieczne i właściwe: poinformuj osobę, że jej zachowanie jest niechciane.','Jeśli bezpośredni kontakt jest niemożliwy lub niebezpieczny: skontaktuj się z wyznaczoną osobą kontaktową.','Aby skorzystać z szybkiego i w pełni cyfrowego procesu: zgłoś sprawę przez Speak Up — poufnie i, jeśli chcesz, anonimowo.','Możesz również w dowolnym momencie skontaktować się z zewnętrznym rzecznikiem Grupy Otto.','Zewnętrzne opcje prawne (sądy pracy itp.) pozostają dostępne i nie są ograniczone przez korzystanie z kanałów wewnętrznych.']}},
    {k:'reporting',eyebrow:'06 – Kanały zgłoszeń',title:'Speak Up: szybko, cyfrowo, udokumentowane.',body:['Speak Up to preferowany wewnętrzny kanał EOS: bezpieczny, udokumentowany i poufny.','Możliwe jest zgłoszenie anonimowe.','Dostępne są również inne kontakty wewnętrzne. Skorzystaj z tego, który jest dla ciebie najodpowiedniejszy.'],activity:{type:'highlight',items:[{head:'Speak Up',body:'Preferowana droga. Złóż zgłoszenie bezpiecznie, o dowolnej porze, poufnie i anonimowo, jeśli to konieczne. Group Compliance jest automatycznie powiadamiany.'},{head:'Wewnętrzne osoby kontaktowe',body:'Lokalne HR, Group HR i Zarządzanie Różnorodnością to wyznaczone punkty kontaktowe. Są przeszkolone w zakresie rozpatrywania skarg z szacunkiem i poufnością.'},{head:'Rzecznik Grupy Otto',body:'Niezależny zewnętrzny prawnik objęty ścisłą tajemnicą zawodową. Zgłoszenia można składać anonimowo, a informacje są udostępniane wyłącznie za wyraźną zgodą.'}]}},
    {k:'handling',eyebrow:'07 – Po zgłoszeniu',title:'Oto co dzieje się dalej.',body:['Każde zgłoszenie jest traktowane poważnie. Od momentu kontaktu proces jest udokumentowany i ustrukturyzowany.'],activity:{type:'choice',prompt:'Prawda czy fałsz: Jeśli skorzystasz z nieformalnej procedury skargowej, nie możesz później złożyć formalnej skargi.',options:['Prawda — skorzystanie najpierw z drogi nieformalnej zamyka drogę formalną.','Fałsz — procedura nieformalna nie uniemożliwia złożenia formalnej skargi na późniejszym etapie.','Prawda tylko wtedy, gdy procedura nieformalna zakończyła się sukcesem.'],answer:1,ok:'Prawidłowo. Polityka wyraźnie stwierdza, że próba nieformalnego rozwiązania nie uniemożliwia osobie poszkodowanej złożenia formalnej skargi później.',bad:'Nie do końca. Polityka chroni twoje prawo do eskalacji do formalnej skargi, nawet jeśli wcześniej próbowałeś/aś rozwiązać sprawę nieformalnie.'}},
    {k:'mechanisms',eyebrow:'08 – Trzy drogi',title:'Nieformalna. Formalna. Zewnętrzna.',body:['Ty i twoja wyznaczona osoba kontaktowa wspólnie decydujecie, która droga jest właściwa dla twojej sytuacji.','Nie ma złego wyboru. Twoje życzenia będą szanowane przez cały czas.'],activity:{type:'compare',cols:[{head:'Nieformalna',body:'Wyznaczona osoba kontaktowa rozmawia z domniemanym sprawcą. Może odbyć się moderowana rozmowa — wyłącznie za twoją zgodą i tylko jeśli czujesz się bezpiecznie.'},{head:'Formalna',body:'Starszy przedstawiciel HR wszczyna pełne dochodzenie. Wszystkie strony są przesłuchiwane oddzielnie. Sporządzany jest pisemny raport z ustaleniami i zaleceniami.'},{head:'Zewnętrzna',body:'Możesz w każdej chwili skontaktować się z zewnętrznymi organami prawnymi lub rzecznikiem Grupy Otto. To prawo nie jest ograniczone przez wcześniejsze korzystanie z kanałów wewnętrznych.'}]},quiz:{quiz:{type:'choice',prompt:'Co się dzieje, jeśli najpierw spróbujesz nieformalnej drogi — czy możesz złożyć formalną skargę później?',options:['Nie — wybranie nieformalnej drogi zamyka opcję formalną.','Tak — nieformalna droga nie wpływa na Twoje prawo do złożenia formalnej skargi.','Tylko jeśli nieformalny proces całkowicie się nie powiódł.'],answer:1,ok:'Prawidłowo. Nie ma złego wyboru — wybranie najpierw nieformalnej drogi nigdy nie pozbawia Cię prawa do eskalacji do formalnej skargi.',bad:'Nie do końca. Polityka jest jasna: Twoje prawo do złożenia formalnej skargi jest zawsze zachowane, niezależnie od tego, którą drogę wybrałeś/wybrałaś jako pierwszą.'}}},
    {k:'protection',eyebrow:'09 – Twoja ochrona',title:'Złożenie zgłoszenia nie naraża cię na ryzyko.',body:['EOS zobowiązuje się chronić każdą osobę, która w dobrej wierze zgłasza problem.','Twoja anonimowość będzie chroniona w możliwie największym stopniu, chyba że wymogi prawne stanowią inaczej.','Osoba, na którą składasz skargę, jest uznawana za niewinną do czasu zakończenia dochodzenia.'],activity:{type:'flip',prompt:'Trzy gwarancje',cards:[{icon:'🔒',title:'Poufność',text:'Wszystkie skargi są rozpatrywane z szacunkiem i poufnością przez cały proces.'},{icon:'🛡️',title:'Brak represji',text:'Nikt, kto zgłasza problem w dobrej wierze, nie zostanie poszkodowany, ukarany ani szykanowany.'},{icon:'⚖️',title:'Uczciwy proces',text:'Domniemanie niewinności obowiązuje każdą osobę oskarżoną o molestowanie.'}]}},
    {k:'sanctions',eyebrow:'10 – Konsekwencje',title:'Potwierdzone przypadki mają realne następstwa.',body:['Każda osoba, u której potwierdzono molestowanie seksualne, zostanie poddana odpowiednim środkom dyscyplinarnym.','Surowość zależy od częstotliwości, okoliczności i obowiązującego prawa lokalnego.','EOS nie traktuje tych przypadków jako błahych.'],activity:{type:'list',heading:'Możliwe środki',items:['Ustne lub pisemne upomnienie','Negatywna ocena wyników pracy','Obniżenie wynagrodzenia zmiennego (tam gdzie jest to prawnie dopuszczalne)','Przeniesienie na inne stanowisko lub do innego działu','Degradacja','Zawieszenie','Zwolnienie (w poważnych przypadkach — natychmiastowe)']}},
    {k:'manager',managerOnly:true,eyebrow:'11 – Twoja rola (Menedżer / HR)',title:'Gdy ktoś przychodzi do ciebie: co robić.',body:['Często jesteś pierwszą osobą, do której zwraca się poszkodowany/a pracownik/pracownica.','To, jak zareagujesz w tym momencie, ma ogromne znaczenie.','Twoim zadaniem nie jest prowadzenie dochodzenia — lecz słuchanie, informowanie i wspieranie.'],activity:{type:'steps',heading:'Gdy zgłaszany jest problem',steps:['Potraktuj to poważnie. Nie bagatelizuj ani nie odrzucaj tego, co słyszysz.','Słuchaj bez oceniania i bez obiecywania konkretnych rezultatów.','Poinformuj osobę o dostępnych procedurach: nieformalnej, formalnej i zewnętrznej.','Dokumentuj starannie. Zarekomenduj Speak Up jako szybką i cyfrową ścieżkę.','Uzgodnij kolejne kroki z osobą poszkodowaną — przez cały czas szanuj jej życzenia.','Zachowaj ścisłą poufność. Stosuj zasadę ograniczonego dostępu do informacji.']}},
    {k:'manager2',managerOnly:true,eyebrow:'12 – Procedura formalna (Menedżer / HR)',title:'Czego wymaga od ciebie procedura formalna.',body:['Po złożeniu formalnej skargi starszy przedstawiciel HR przejmuje odpowiedzialność za sprawę.','Dochodzenia prowadzone są bezstronnie, poufnie i sprawnie.','Twoja rola: wspierać proces, a nie nim kierować — chyba że zostaniesz formalnie wyznaczony/a jako osoba prowadząca dochodzenie.'],activity:{type:'scenario',tag:'Scenariusz Menedżer / HR',text:'Pracownica informuje cię, że doświadczyła wielokrotnych niechcianych zalotów ze strony osoby na tym samym szczeblu. Nie jest jeszcze pewna, co chce zrobić, i pyta, czy musi teraz podjąć decyzję.',question:'Jak powinieneś/powinnaś zareagować?',answer:'Poinformuj ją, że nie musi decydować natychmiast. Wyjaśnij dostępne drogi: nieformalne rozwiązanie, formalna skarga i opcje zewnętrzne. Zaakcentuj Speak Up jako najszybszą i najbezpieczniejszą cyfrową drogę. Wyjaśnij, że jej życzenia będą szanowane przez cały czas i że zgłoszenie problemu nie narazi jej na żadne niekorzystne konsekwencje.'},quiz:{quiz:{type:'choice',prompt:'Kto prowadzi dochodzenie po złożeniu formalnej skargi?',options:['Menedżer, który jako pierwszy otrzymał zgłoszenie.','Starszy przedstawiciel HR.','Bezpośredni przełożony osoby oskarżonej.'],answer:1,ok:'Prawidłowo. Po złożeniu formalnej skargi starszy przedstawiciel HR przejmuje odpowiedzialność — nie menedżer, który otrzymał zgłoszenie.',bad:'Nie do końca. Formalnym procesem kieruje starszy przedstawiciel HR, aby zapewnić bezstronność i poufność.'}}},
    {k:'close',eyebrow:'Podsumowanie',title:'Jesteś teraz przygotowany/a.',body:['Wiesz, co oznacza molestowanie seksualne zgodnie z polityką EOS.','Znasz kanały zgłoszeń i wiesz, co dzieje się po zgłoszeniu.','Znasz swoje prawa i — jeśli jesteś menedżerem lub pracujesz w HR — swoje obowiązki.','Szacunek w miejscu pracy to wspólna odpowiedzialność wszystkich.'],activity:{type:'commit',text:'Rozumiem kluczowe zasady Polityki Korporacyjnej EOS dotyczącej Molestowania Seksualnego i wiem, gdzie znaleźć wsparcie i możliwości zgłoszenia.'}}

    {k:'purpose',eyebrow:'01 – Proč na tom záleží',title:'Nulová tolerance znamená nulové výjimky.',body:['EOS neuznává sexuální obtěžování — na žádném místě, v žádném prostředí ani v žádném formátu.','Tato politika platí celosvětově pro všechny společnosti skupiny EOS a je závazná pro všechny zaměstnance a vedoucí pracovníky.','Toto školení vám pomůže pochopit, co politika pokrývá, co můžete dělat a jak EOS řeší nahlášené případy.'],activity:{type:'flip',prompt:'Tři důležité fakty',cards:[{icon:'🌍',title:'Platí celosvětově',text:'Všechny společnosti skupiny EOS jsou zahrnuty bez ohledu na velikost nebo strukturu.'},{icon:'⚖️',title:'Závazné pro všechny',text:'Vedoucí pracovníci, manažeři i zaměstnanci — všichni jsou povinni politiku dodržovat.'},{icon:'🎯',title:'Co toto školení přináší',text:'Zvyšuje povědomí, objasňuje hranice a ukazuje vám dostupné možnosti.'}]}},
    {k:'definition',eyebrow:'02 – Co je sexuální obtěžování?',title:'Nejde o záměr. Jde o dopad.',body:['Sexuální obtěžování je nevítané chování sexuální povahy, které osobu uráží, ponižuje nebo zastrašuje.','Může jít o jednorázový incident nebo o opakující se vzorec chování.','Klíčová otázka: bylo toto chování pro osobu, vůči níž bylo namířeno, nevítané?'],activity:{type:'choice',prompt:'Scénář: Kolega pošle přes firemní chat sexuálně explicitní vtip. Příjemce nereaguje, ale cítí se nepříjemně. Je to podle politiky EOS sexuální obtěžování?',options:['Ne — nikdo nic neřekl, takže to nebylo nevítané.','Ano — chování bylo sexuální povahy a příjemci způsobilo nepříjemný pocit.','Jen pokud se to stane více než jednou.'],answer:1,ok:'Správně. Politika jasně stanoví, že rozhodující je, zda bylo chování pro příjemce nevítané — nikoli zda někdo protestoval nebo zda se opakovalo.',bad:'Není to úplně přesné. Politika se zaměřuje na to, zda bylo chování pro příjemce nevítané. Mlčení neznamená, že chování bylo vítané.'}},
    {k:'examples',eyebrow:'03 – Co sem patří?',title:'Tři formy — všechny zakázané.',body:['Sexuální obtěžování může mít fyzickou, verbální nebo neverbální podobu.','Níže uvedené příklady nejsou vyčerpávající. V případě pochybností se zeptejte sami sebe: je toto chování druhou osobou žádané?'],activity:{type:'tabs',tabs:[{label:'Fyzické',items:['Nevítaný kontakt: poplácávání, štípání, hlazení, líbání, objímání, osahávání nebo nevhodné dotýkání — včetně zdánlivě náhodného kontaktu.','Fyzické násilí, včetně sexuálního napadení.','Využívání pracovních hrozeb nebo odměn k vymáhání sexuálních laskavostí.']},{label:'Verbální',items:['Sexuálně ponižující nebo depersonalizující poznámky o osobách nebo jejich těle.','Ponižující komentáře o sexuálním životě někoho.','Nevhodné sexuální příběhy nebo vtipy.','Nevítané návrhy nebo opakované pozvánky na rande nebo k fyzické intimitě.','Povýšenecké nebo paternalistické poznámky.','Zasílání sexuálně explicitních zpráv.']},{label:'Neverbální',items:['Vystavování sexuálně explicitního nebo sugestivního materiálu.','Sexuálně sugestivní gesta.','Vyzývavé pohledy.','Pískání.']}]},quiz:{quiz:{type:'choice',prompt:'Který z následujících příkladů je formou neverbálního sexuálního obtěžování?',options:['Zasílání sexuálně explicitních zpráv','Upřený pohled nebo pískání','Nežádoucí fyzický kontakt'],answer:1,ok:'Správně. Upřený pohled a pískání jsou neverbální formy sexuálního obtěžování — bez slov nebo fyzického kontaktu.',bad:'Není to tak úplně. Zamyslete se nad třemi kategoriemi: fyzická, verbální a neverbální. Upřený pohled a pískání patří do neverbální.'}}},
    {k:'boundaries',eyebrow:'04 – Kde platí?',title:'Pracoviště je víc než kancelář.',body:['Zákaz platí v prostorách EOS i mimo běžné pracoviště.','To zahrnuje firemní společenské akce, pracovní cesty, školení a konference.','Postižena může být každá osoba bez ohledu na pohlaví — včetně osob stejného pohlaví.'],activity:{type:'scenario',tag:'Scénář',text:'Během večeře pořádané EOS člen týmu opakovaně gratuluje kolegyni k jejímu vzhledu způsobem, který ji viditelně uvádí do nepříjemné situace. Kolegyně nic neříká, ale po zbytek večera se této osobě vyhýbá.',question:'Spadá to pod politiku EOS?',answer:'Ano. Politika se vztahuje na akce pořádané EOS mimo běžné pracoviště. Rozhodující je nepříjemný pocit, který příjemce zažívá — nikoli zda něco řekl/a.'}},
    {k:'affected',eyebrow:'05 – Pokud se vás to týká',title:'Máte více možností, než si myslíte.',body:['Nejste povinni přímo konfrontovat druhou osobu — zejména v nerovných vztazích.','EOS uznává, že přímé vyjádření není vždy možné nebo bezpečné.','Ať zvolíte jakoukoli cestu, vaše obavy budou řešeny důvěrně a s respektem.'],activity:{type:'steps',heading:'Vaše možnosti krok za krokem',steps:['Je-li to bezpečné a vhodné: dejte osobě vědět, že její chování je nevítané.','Je-li přímý kontakt nebezpečný nebo nemožný: obraťte se na určenou kontaktní osobu.','Pro rychlý a plně digitální proces: podejte oznámení přes Speak Up — důvěrně a případně anonymně.','Kdykoli se také můžete obrátit na externího ombudsmana skupiny Otto.','Externí právní možnosti (pracovní soudy atd.) zůstávají k dispozici a nejsou využitím interních kanálů nijak omezeny.']}},
    {k:'reporting',eyebrow:'06 – Kanály pro hlášení',title:'Speak Up: rychle, digitálně, zdokumentovaně.',body:['Speak Up je preferovaný interní kanál EOS: bezpečný, zdokumentovaný a důvěrný.','Anonymní hlášení je možné, pokud si to přejete.','K dispozici jsou také další interní kontakty. Použijte ten, který vám nejvíce vyhovuje.'],activity:{type:'highlight',items:[{head:'Speak Up',body:'Preferovaná cesta. Podejte hlášení bezpečně, kdykoli, důvěrně a anonymně, pokud je to potřeba. Group Compliance je automaticky upozorněn.'},{head:'Interní kontaktní osoby',body:'Místní HR, Group HR a Diversity Management jsou určenými kontaktními místy. Jsou proškoleni k důvěrnému a respektujícímu vyřizování stížností.'},{head:'Ombudsman skupiny Otto',body:'Nezávislý externí právník vázaný přísnou mlčenlivostí. Hlášení lze podávat anonymně a informace jsou sdíleny pouze s vaším výslovným souhlasem.'}]}},
    {k:'handling',eyebrow:'07 – Po podání hlášení',title:'Přesně takto to probíhá dál.',body:['Každé hlášení je bráno vážně. Od okamžiku kontaktu je proces zdokumentován a strukturován.'],activity:{type:'choice',prompt:'Pravda nebo nepravda: Pokud využijete neformální stížnostní postup, nemůžete již podat formální stížnost.',options:['Pravda — kdo nejprve zvolí neformální cestu, uzavře si cestu formální.','Nepravda — neformální postup nebrání podání formální stížnosti v pozdější fázi.','Pravda pouze tehdy, pokud byl neformální postup úspěšně dokončen.'],answer:1,ok:'Správně. Politika výslovně uvádí, že pokus o neformální řešení nebrání dotčené osobě podat formální stížnost později.',bad:'Není to úplně přesné. Politika chrání vaše právo eskalovat na formální stížnost i v případě, že jste se nejprve pokusili věc vyřešit neformálně.'}},
    {k:'mechanisms',eyebrow:'08 – Tři cesty',title:'Neformální. Formální. Externí.',body:['Vy a vaše určená kontaktní osoba společně rozhodnete, která cesta je pro vaši situaci vhodná.','Neexistuje špatná volba. Vaše přání budou vždy respektována.'],activity:{type:'compare',cols:[{head:'Neformální',body:'Určená kontaktní osoba promluví s údajným obtěžovatelem. Může se konat zprostředkovaná diskuse — pouze s vaším souhlasem a pouze pokud se cítíte bezpečně.'},{head:'Formální',body:'Starší zástupce HR zahájí úplné šetření. Všechny strany jsou vyslýchány odděleně. Je vypracována písemná zpráva se zjištěními a doporučeními.'},{head:'Externí',body:'Kdykoli se můžete obrátit na externí právní orgány nebo ombudsmana skupiny Otto. Toto právo není předchozím využitím interních kanálů nijak dotčeno.'}]},quiz:{quiz:{type:'choice',prompt:'Co se stane, pokud nejprve zkusíte neformální cestu — můžete podat formální stížnost i poté?',options:['Ne — zvolení neformální cesty uzavírá formální možnost.','Ano — neformální cesta neovlivňuje vaše právo podat formální stížnost.','Pouze pokud neformální proces zcela selhal.'],answer:1,ok:'Správně. Neexistuje špatná volba — zvolení nejprve neformální cesty vám nikdy neodejme právo eskalovat na formální stížnost.',bad:'Není to tak úplně. Politika je jasná: vaše právo podat formální stížnost je vždy zachováno bez ohledu na to, kterou cestu jste zvolili jako první.'}}},
    {k:'protection',eyebrow:'09 – Vaše ochrana',title:'Podání hlášení vás nevystaví riziku.',body:['EOS se zavazuje chránit každého, kdo v dobré víře upozorní na problém.','Vaše anonymita bude chráněna v co největší míře, pokud to právní požadavky nevyžadují jinak.','Osoba, na kterou podáváte hlášení, je považována za nevinnou, dokud šetření nedospěje k jinému závěru.'],activity:{type:'flip',prompt:'Tři záruky',cards:[{icon:'🔒',title:'Důvěrnost',text:'Všechny stížnosti jsou po celou dobu procesu řešeny s respektem a důvěrně.'},{icon:'🛡️',title:'Žádné odvetné opatření',text:'Nikdo, kdo v dobré víře podá hlášení, nebude znevýhodněn, penalizován ani šikanován.'},{icon:'⚖️',title:'Spravedlivý proces',text:'Presumpce neviny platí pro každou osobu obviněnou z obtěžování.'}]}},
    {k:'sanctions',eyebrow:'10 – Důsledky',title:'Potvrzené případy mají reálné následky.',body:['Každá osoba, u níž bylo prokázáno sexuální obtěžování, bude čelit přiměřeným disciplinárním opatřením.','Závažnost závisí na četnosti, okolnostech a platném místním právu.','EOS tyto případy nepovažuje za bagatelní.'],activity:{type:'list',heading:'Možná opatření',items:['Ústní nebo písemné napomenutí','Negativní hodnocení výkonu','Snížení variabilní složky odměny (kde to právní předpisy umožňují)','Přeložení na jinou pozici nebo do jiného oddělení','Degradace','Pozastavení činnosti','Ukončení pracovního poměru (v závažných případech okamžité)']}},
    {k:'manager',managerOnly:true,eyebrow:'11 – Vaše role (Vedoucí / HR)',title:'Když za vámi někdo přijde: co dělat.',body:['Často jste první osobou, na kterou se postižený zaměstnanec obrátí.','Jak v tu chvíli zareagujete, je velmi důležité.','Vaším úkolem není vyšetřovat — ale naslouchat, informovat a podporovat.'],activity:{type:'steps',heading:'Když je vznesena stížnost',steps:['Berte ji vážně. Nesnižujte ani nezavrhujte to, co slyšíte.','Naslouchejte bez posuzování a bez slibování konkrétních výsledků.','Informujte osobu o dostupných postupech: neformálním, formálním a externím.','Pečlivě dokumentujte. Doporučte Speak Up pro rychlou digitální stopu.','Koordinujte další kroky s dotčenou osobou — vždy respektujte její přání.','Dodržujte přísnou mlčenlivost. Uplatňujte princip „need to know".']}},
    {k:'manager2',managerOnly:true,eyebrow:'12 – Formální postup (Vedoucí / HR)',title:'Co formální postup od vás vyžaduje.',body:['Jakmile je podána formální stížnost, převezme odpovědnost starší zástupce HR.','Šetření jsou vedena nestranně, důvěrně a rychle.','Vaše role: podporovat proces, nikoli ho řídit — pokud nejste formálně jmenováni jako vyšetřovatel.'],activity:{type:'scenario',tag:'Scénář Vedoucí / HR',text:'Zaměstnankyně vám sdělí, že zažila opakované nevítané návrhy od kolegy na stejné úrovni. Ještě si není jistá, co chce dělat, a ptá se, zda se musí rozhodnout hned.',question:'Jak byste měli reagovat?',answer:'Dejte jí vědět, že se nemusí rozhodovat okamžitě. Vysvětlete dostupné cesty: neformální řešení, formální stížnost a externí možnosti. Zdůrazněte Speak Up jako nejrychlejší a nejbezpečnější digitální cestu. Objasněte, že její přání budou po celou dobu respektována a že upozornění na problém ji neznevýhodní.'},quiz:{quiz:{type:'choice',prompt:'Kdo vede vyšetřování po podání formální stížnosti?',options:['Manažer, který jako první obdržel hlášení.','Senior zástupce HR.','Přímý nadřízený obviněné osoby.'],answer:1,ok:'Správně. Po podání formální stížnosti přebírá zodpovědnost senior zástupce HR — nikoli manažer, který obdržel hlášení.',bad:'Není to tak úplně. Formální proces vede senior zástupce HR, aby bylo zajištěno nestrannosti a důvěrnosti.'}}},
    {k:'close',eyebrow:'Závěr',title:'Nyní jste připraveni.',body:['Víte, co znamená sexuální obtěžování podle politiky EOS.','Znáte kanály pro hlášení a víte, co se stane po podání hlášení.','Znáte svá práva a — pokud jste vedoucí nebo HR — své odpovědnosti.','Respektující chování je společnou odpovědností nás všech.'],activity:{type:'commit',text:'Rozumím klíčovým zásadám firemní politiky EOS týkající se sexuálního obtěžování a vím, kde najít podporu a možnosti hlášení.'}}
  ]
};

    {k:'examples',eyebrow:'03 – Čo sem patrí?',title:'Tri formy — všetky zakázané.',body:['Sexuálne obťažovanie môže mať fyzickú, verbálnu alebo neverbálnu podobu.','Nižšie uvedené príklady nie sú vyčerpávajúce. V prípade pochybností sa opýtajte sami seba: je toto správanie druhou osobou žiadané?'],activity:{type:'tabs',tabs:[{label:'Fyzické',items:['Nevítaný kontakt: poplácavanie, štípanie, hladenie, bozkávanie, objímanie, osahávanie alebo nevhodné dotýkanie — vrátane zdanlivo náhodného kontaktu.','Fyzické násilie vrátane sexuálneho napadnutia.','Využívanie pracovných hrozieb alebo odmien na vymáhanie sexuálnych laskavostí.']},{label:'Verbálne',items:['Sexuálne ponižujúce alebo depersonalizujúce poznámky o osobách alebo ich tele.','Ponižujúce komentáre o sexuálnom živote niekoho.','Nevhodné sexuálne príbehy alebo vtipy.','Nevítané návrhy alebo opakované pozvánky na rande alebo k fyzickej intímnosti.','Povýšenecké alebo paternalistické poznámky.','Zasielanie sexuálne explicitných správ.']},{label:'Neverbálne',items:['Vystavovanie sexuálne explicitného alebo sugestívneho materiálu.','Sexuálne sugestívne gestá.','Vyzývavé pohľady.','Pískanie.']}]},quiz:{quiz:{type:'choice',prompt:'Ktorý z nasledujúcich príkladov je formou neverbálneho sexuálneho obťažovania?',options:['Zasielanie sexuálne explicitných správ','Uprený pohľad alebo pískanie','Nežiaduce fyzické dotyky'],answer:1,ok:'Správne. Uprený pohľad a pískanie sú neverbálne formy sexuálneho obťažovania — bez slov alebo fyzického kontaktu.',bad:'Nie celkom. Zamyslite sa nad troma kategóriami: fyzická, verbálna a neverbálna. Uprený pohľad a pískanie patria do neverbálnej.'}}},
    {k:'boundaries',eyebrow:'04 – Kde platí?',title:'Pracovisko je viac ako kancelária.',body:['Zákaz platí v priestoroch EOS aj mimo bežného pracoviska.','To zahŕňa firemné spoločenské podujatia, pracovné cesty, školenia a konferencie.','Postihnutá môže byť každá osoba bez ohľadu na pohlavie — vrátane osôb rovnakého pohlavia.'],activity:{type:'scenario',tag:'Scenár',text:'Počas večere organizovanej EOS člen tímu opakovane gratuluje kolegyni k jej vzhľadu spôsobom, ktorý ju viditeľne uvádza do nepríjemnej situácie. Kolegyňa nič nehovorí, ale po zvyšok večera sa tejto osobe vyhýba.',question:'Spadá to pod politiku EOS?',answer:'Áno. Politika sa vzťahuje na podujatia organizované EOS mimo bežného pracoviska. Rozhodujúci je nepríjemný pocit, ktorý príjemca zažíva — nie či niečo povedal/a.'}},
    {k:'affected',eyebrow:'05 – Ak sa vás to týka',title:'Máte viac možností, ako si myslíte.',body:['Nie ste povinní priamo konfrontovať druhú osobu — najmä v nerovných vzťahoch.','EOS uznáva, že priame vyjadrenie nie je vždy možné alebo bezpečné.','Nech zvolíte akúkoľvek cestu, vaše obavy budú riešené dôverne a s rešpektom.'],activity:{type:'steps',heading:'Vaše možnosti krok za krokom',steps:['Ak je to bezpečné a vhodné: dajte osobe vedieť, že jej správanie je nevítané.','Ak je priamy kontakt nebezpečný alebo nemožný: obráťte sa na určenú kontaktnú osobu.','Pre rýchly a plne digitálny proces: podajte oznámenie cez Speak Up — dôverne a prípadne anonymne.','Kedykoľvek sa tiež môžete obrátiť na externého ombudsmana skupiny Otto.','Externé právne možnosti (pracovné súdy atď.) zostávajú k dispozícii a využitím interných kanálov nie sú nijako obmedzené.']}},
    {k:'reporting',eyebrow:'06 – Kanály na hlásenie',title:'Speak Up: rýchlo, digitálne, zdokumentovane.',body:['Speak Up je preferovaný interný kanál EOS: bezpečný, zdokumentovaný a dôverný.','Anonymné hlásenie je možné, ak si to prajete.','K dispozícii sú aj ďalšie interné kontakty. Použite ten, ktorý vám najviac vyhovuje.'],activity:{type:'highlight',items:[{head:'Speak Up',body:'Preferovaná cesta. Podajte hlásenie bezpečne, kedykoľvek, dôverne a anonymne, ak je to potrebné. Group Compliance je automaticky upozornený.'},{head:'Interné kontaktné osoby',body:'Miestne HR, Group HR a Diversity Management sú určenými kontaktnými miestami. Sú vyškolení na dôverné a rešpektujúce vybavovanie sťažností.'},{head:'Ombudsman skupiny Otto',body:'Nezávislý externý právnik viazaný prísnou mlčanlivosťou. Hlásenia možno podávať anonymne a informácie sú zdieľané iba s vaším výslovným súhlasom.'}]}},
    {k:'handling',eyebrow:'07 – Po podaní hlásenia',title:'Presne takto to prebieha ďalej.',body:['Každé hlásenie je brané vážne. Od okamihu kontaktu je proces zdokumentovaný a štruktúrovaný.'],activity:{type:'choice',prompt:'Pravda alebo nepravda: Ak využijete neformálny sťažnostný postup, nemôžete už podať formálnu sťažnosť.',options:['Pravda — kto najprv zvolí neformálnu cestu, uzavrie si cestu formálnu.','Nepravda — neformálny postup nebráni podaniu formálnej sťažnosti v neskoršej fáze.','Pravda len vtedy, ak bol neformálny postup úspešne dokončený.'],answer:1,ok:'Správne. Politika výslovne uvádza, že pokus o neformálne riešenie nebráni dotknutej osobe podať formálnu sťažnosť neskôr.',bad:'Nie je to úplne presné. Politika chráni vaše právo eskalovať na formálnu sťažnosť aj v prípade, že ste sa najprv pokúsili vec vyriešiť neformálne.'}},
    {k:'mechanisms',eyebrow:'08 – Tri cesty',title:'Neformálna. Formálna. Externá.',body:['Vy a vaša určená kontaktná osoba spoločne rozhodnete, ktorá cesta je pre vašu situáciu vhodná.','Neexistuje zlá voľba. Vaše priania budú vždy rešpektované.'],activity:{type:'compare',cols:[{head:'Neformálna',body:'Určená kontaktná osoba prehovorí s údajným obťažovateľom. Môže sa konať sprostredkovaná diskusia — iba s vaším súhlasom a iba ak sa cítite bezpečne.'},{head:'Formálna',body:'Starší zástupca HR začne úplné vyšetrovanie. Všetky strany sú vypočúvané oddelene. Je vypracovaná písomná správa so zisteniami a odporúčaniami.'},{head:'Externá',body:'Kedykoľvek sa môžete obrátiť na externé právne orgány alebo ombudsmana skupiny Otto. Toto právo nie je predchádzajúcim využitím interných kanálov nijako dotknuté.'}]},quiz:{quiz:{type:'choice',prompt:'Čo sa stane, ak najprv vyskúšate neformálnu cestu — môžete podať formálnu sťažnosť aj neskôr?',options:['Nie — zvolenie neformálnej cesty uzatvára formálnu možnosť.','Áno — neformálna cesta neovplyvňuje vaše právo podať formálnu sťažnosť.','Iba ak neformálny proces úplne zlyhal.'],answer:1,ok:'Správne. Neexistuje zlá voľba — zvolenie neformálnej cesty vám nikdy neodníme právo eskalovať na formálnu sťažnosť.',bad:'Nie celkom. Politika je jasná: vaše právo podať formálnu sťažnosť je vždy zachované bez ohľadu na to, ktorú cestu ste zvolili ako prvú.'}}},
    {k:'protection',eyebrow:'09 – Vaša ochrana',title:'Podanie hlásenia vás nevystaví riziku.',body:['EOS sa zaväzuje chrániť každého, kto v dobrej viere upozorní na problém.','Vaša anonymita bude chránená v čo najväčšej miere, ak to právne požiadavky nevyžadujú inak.','Osoba, na ktorú podávate hlásenie, je považovaná za nevinnú, kým vyšetrovanie nedospeje k inému záveru.'],activity:{type:'flip',prompt:'Tri záruky',cards:[{icon:'🔒',title:'Dôvernosť',text:'Všetky sťažnosti sú počas celého procesu riešené s rešpektom a dôverne.'},{icon:'🛡️',title:'Žiadne odvetné opatrenie',text:'Nikto, kto v dobrej viere podá hlásenie, nebude znevýhodnený, penalizovaný ani šikanovaný.'},{icon:'⚖️',title:'Spravodlivý proces',text:'Prezumpcia neviny platí pre každú osobu obvinenú z obťažovania.'}]}},
    {k:'sanctions',eyebrow:'10 – Dôsledky',title:'Potvrdené prípady majú reálne následky.',body:['Každá osoba, u ktorej bolo preukázané sexuálne obťažovanie, bude čeliť primeraným disciplinárnym opatreniam.','Závažnosť závisí od frekvencie, okolností a platného miestneho práva.','EOS tieto prípady nepovažuje za bagatelné.'],activity:{type:'list',heading:'Možné opatrenia',items:['Ústne alebo písomné napomenutie','Negatívne hodnotenie výkonu','Zníženie variabilnej zložky odmeny (kde to právne predpisy umožňujú)','Preloženie na inú pozíciu alebo do iného oddelenia','Degradácia','Pozastavenie činnosti','Skončenie pracovného pomeru (v závažných prípadoch okamžité)']}},
    {k:'manager',managerOnly:true,eyebrow:'11 – Vaša rola (Vedúci/Vedúca / HR)',title:'Keď za vami niekto príde: čo robiť.',body:['Často ste prvou osobou, na ktorú sa postihnutý zamestnanec obráti.','Ako v danom okamihu zareagujete, je veľmi dôležité.','Vašou úlohou nie je vyšetrovať — ale počúvať, informovať a podporovať.'],activity:{type:'steps',heading:'Keď je vznesená sťažnosť',steps:['Berte ju vážne. Nesnižujte ani nezavrhujte to, čo počujete.','Počúvajte bez posudzovania a bez sľubovania konkrétnych výsledkov.','Informujte osobu o dostupných postupoch: neformálnom, formálnom a externom.','Starostlivo dokumentujte. Odporučte Speak Up pre rýchlu digitálnu stopu.','Koordinujte ďalšie kroky s dotknutou osobou — vždy rešpektujte jej priania.','Dodržiavajte prísnú mlčanlivosť. Uplatňujte princíp „need to know".']}},
    {k:'manager2',managerOnly:true,eyebrow:'12 – Formálny postup (Vedúci/Vedúca / HR)',title:'Čo formálny postup od vás vyžaduje.',body:['Akonáhle je podaná formálna sťažnosť, prevezme zodpovednosť starší zástupca HR.','Vyšetrovania sú vedené nestranne, dôverne a rýchlo.','Vaša rola: podporovať proces, nie ho riadiť — ak nie ste formálne menovaný/á ako vyšetrovateľ/ka.'],activity:{type:'scenario',tag:'Scenár Vedúci/Vedúca / HR',text:'Zamestnankyňa vám oznámi, že zažila opakované nevítané návrhy od kolegu na rovnakej úrovni. Ešte si nie je istá, čo chce robiť, a pýta sa, či sa musí rozhodnúť hneď.',question:'Ako by ste mali reagovať?',answer:'Dajte jej vedieť, že sa nemusí rozhodovať okamžite. Vysvetlite dostupné cesty: neformálne riešenie, formálna sťažnosť a externé možnosti. Zdôraznite Speak Up ako najrýchlejšiu a najbezpečnejšiu digitálnu cestu. Objasnite, že jej priania budú počas celého procesu rešpektované a že upozornenie na problém ju neznevýhodní.'},quiz:{quiz:{type:'choice',prompt:'Kto vedie vyšetrovanie po podaní formálnej sťažnosti?',options:['Manažér, ktorý ako prvý dostal hlásenie.','Senior zástupca HR.','Priamy nadriadený obvinenej osoby.'],answer:1,ok:'Správne. Po podaní formálnej sťažnosti preberá zodpovednosť senior zástupca HR — nie manažér, ktorý hlásenie dostal.',bad:'Nie celkom. Formálny proces vedie senior zástupca HR, aby bola zabezpečená nestrannosť a dôvernosť.'}}},
    {k:'close',eyebrow:'Záver',title:'Teraz ste pripravení.',body:['Viete, čo znamená sexuálne obťažovanie podľa politiky EOS.','Poznáte kanály na hlásenie a viete, čo sa stane po podaní hlásenia.','Poznáte svoje práva a — ak ste vedúci/a alebo HR — svoje zodpovednosti.','Rešpektujúce správanie je spoločnou zodpovednosťou nás všetkých.'],activity:{type:'commit',text:'Rozumiem kľúčovým zásadám firemnej politiky EOS týkajúcej sa sexuálneho obťažovania a viem, kde nájsť podporu a možnosti hlásenia.'}}
  ]
};

CONTENT['ro'] = {
  ui:{quizHint:'Vă rugăm să selectați răspunsul corect pentru a continua.',back:'Înapoi',continue:'Continuați',finish:'Finalizați',restart:'Începeți din nou',selectLang:'Selectați limba',selectRole:'Cine ești?',employee:'Angajat/Angajată',manager:'Manager / Human Resources',empDesc:'Aflați ce înseamnă hărțuirea sexuală, unde sunt limitele și ce opțiuni aveți dacă sunteți afectat(ă).',mgrDesc:'Tot conținutul pentru angajați, plus un modul dedicat despre cum să sprijiniți persoanele care vin la dvs. cu o problemă.',startBtn:'Începeți instruirea',complete:'Instruire finalizată',completeMsg:'Vă mulțumim că ați finalizat instruirea EOS privind Respectul la Locul de Muncă.',tapHint:'Atingeți un card pentru a-l dezvălui',showGuidance:'Afișați îndrumarea'},
  modules:[
    {k:'purpose',eyebrow:'01 – De ce contează',title:'Toleranță zero înseamnă zero excepții.',body:['EOS are toleranță zero față de hărțuirea sexuală — în orice locație, orice mediu, orice format.','Această politică se aplică la nivel mondial tuturor companiilor din Grupul EOS și este obligatorie pentru toți angajații și conducătorii.','Această instruire vă ajută să înțelegeți ce este acoperit, ce puteți face și cum gestionează EOS sesizările.'],activity:{type:'flip',prompt:'Trei lucruri de știut',cards:[{icon:'🌍',title:'Se aplică la nivel mondial',text:'Toate companiile din Grupul EOS sunt acoperite, indiferent de dimensiune sau structură.'},{icon:'⚖️',title:'Obligatoriu pentru toți',text:'Conducători, manageri și angajați — toți trebuie să respecte politica.'},{icon:'🎯',title:'Ce face această instruire',text:'Crește conștientizarea, explică limitele și vă arată opțiunile disponibile.'}]}},
    {k:'definition',eyebrow:'02 – Ce este hărțuirea sexuală?',title:'Nu este vorba de intenție. Este vorba de impact.',body:['Hărțuirea sexuală este un comportament nedorit de natură sexuală care ofensează, umilește sau intimidează o persoană.','Poate fi un incident izolat sau un tipar de comportament.','Întrebarea cheie: era acest comportament nedorit de persoana căreia i se adresa?'],activity:{type:'choice',prompt:'Scenariu: Un coleg trimite o glumă cu conținut sexual explicit prin chatul companiei. Destinatarul nu răspunde, dar se simte inconfortabil. Aceasta reprezintă hărțuire sexuală conform politicii EOS?',options:['Nu — nimeni nu a spus nimic, deci nu a fost nedorit.','Da — comportamentul era de natură sexuală și l-a făcut pe destinatar să se simtă inconfortabil.','Doar dacă se întâmplă de mai multe ori.'],answer:1,ok:'Corect. Politica precizează că ceea ce contează este dacă comportamentul este nedorit de destinatar — nu dacă cineva a protestat și nu dacă s-a repetat.',bad:'Nu chiar. Politica se concentrează pe dacă comportamentul a fost nedorit de destinatar. Tăcerea nu înseamnă că comportamentul a fost binevenit.'}},
    {k:'examples',eyebrow:'03 – Ce se încadrează?',title:'Trei forme — toate interzise.',body:['Hărțuirea sexuală poate fi fizică, verbală sau nonverbală.','Exemplele de mai jos nu sunt exhaustive. În caz de îndoială, întrebați-vă: este acest comportament dorit de cealaltă persoană?'],activity:{type:'tabs',tabs:[{label:'Fizică',items:['Contact nedorit: bătăi pe umăr, ciupituri, mângâieri, săruturi, îmbrățișări, pipăituri sau atingeri necorespunzătoare — inclusiv contact aparent accidental.','Violență fizică, inclusiv agresiune sexuală.','Utilizarea amenințărilor sau recompenselor legate de muncă pentru a solicita favoruri sexuale.']},{label:'Verbală',items:['Remarci sexuale degradante sau depersonalizante despre persoane sau corpurile lor.','Comentarii degradante despre viața sexuală a cuiva.','Povești sau glume sexuale necorespunzătoare.','Avansuri nedorite sau invitații repetate la întâlniri sau intimitate fizică.','Remarci condescendente sau paternaliste.','Trimiterea de mesaje cu conținut sexual explicit.']},{label:'Nonverbală',items:['Afișarea de materiale cu conținut sexual explicit sau sugestiv.','Gesturi cu conotație sexuală.','Priviri insistente.','Fluierături.']}]},quiz:{quiz:{type:'choice',prompt:'Care dintre următoarele exemple este o formă de hărțuire sexuală non-verbală?',options:['Trimiterea de mesaje cu conținut sexual explicit','Privitul insistent sau fluieratul','Atingerea fizică nedorită'],answer:1,ok:'Corect. Privitul insistent și fluieratul sunt forme non-verbale de hărțuire sexuală — fără cuvinte sau contact fizic.',bad:'Nu chiar. Gândiți-vă la cele trei categorii: fizică, verbală și non-verbală. Privitul insistent și fluieratul se încadrează în cea non-verbală.'}}},
    {k:'boundaries',eyebrow:'04 – Unde se aplică?',title:'Locul de muncă este mai mult decât biroul.',body:['Interdicția se aplică în incintele EOS și în afara locului de muncă obișnuit.','Aceasta include evenimente sociale sponsorizate de companie, călătorii de afaceri, sesiuni de instruire și conferințe.','Orice persoană poate fi afectată, indiferent de sex — inclusiv între persoane de același sex.'],activity:{type:'scenario',tag:'Scenariu',text:'În timpul unei cine sponsorizate de EOS, un membru al echipei face în mod repetat complimente unui coleg privind aspectul său fizic într-un mod care îl face pe acesta vizibil inconfortabil. Colegul nu spune nimic, dar îl evită pe cel în cauză pentru restul serii.',question:'Aceasta se încadrează în politica EOS?',answer:'Da. Politica acoperă evenimentele sponsorizate de EOS în afara locului de muncă obișnuit. Ceea ce contează este disconfortul simțit de destinatar — nu dacă a spus ceva.'}},
    {k:'affected',eyebrow:'05 – Dacă vi se întâmplă',title:'Aveți mai multe opțiuni decât credeți.',body:['Nu sunteți obligat(ă) să confruntați direct cealaltă persoană — mai ales în relații inegale.','EOS recunoaște că exprimarea directă nu este întotdeauna posibilă sau sigură.','Indiferent de calea pe care o alegeți, preocuparea dvs. va fi tratată cu confidențialitate și respect.'],activity:{type:'steps',heading:'Opțiunile dvs., pas cu pas',steps:['Dacă este sigur și adecvat: informați persoana că comportamentul său este nedorit.','Dacă contactul direct pare nesigur sau imposibil: contactați o persoană de contact desemnată.','Pentru un proces rapid și complet digital: raportați prin Speak Up — confidențial și, dacă doriți, anonim.','Puteți contacta oricând și ombudsmanul extern al Grupului Otto.','Opțiunile legale externe (tribunale de muncă etc.) rămân disponibile și nu sunt afectate de utilizarea canalelor interne.']}},
    {k:'reporting',eyebrow:'06 – Canale de raportare',title:'Speak Up: rapid, digital, documentat.',body:['Speak Up este canalul intern preferat al EOS: sigur, documentat și confidențial.','Raportarea anonimă este posibilă dacă se dorește.','Alte contacte interne sunt de asemenea disponibile. Utilizați-l pe cel care vi se pare cel mai potrivit.'],activity:{type:'highlight',items:[{head:'Speak Up',body:'Ruta preferată. Trimiteți un raport în siguranță, oricând, confidențial și anonim dacă este necesar. Group Compliance este notificat automat.'},{head:'Persoane de contact interne',body:'HR local, HR de Grup și Managementul Diversității sunt puncte de contact desemnate. Sunt instruiți să gestioneze plângerile cu respect și confidențialitate.'},{head:'Ombudsmanul Grupului Otto',body:'Un avocat extern independent, supus confidențialității stricte. Rapoartele pot fi trimise anonim, iar informațiile sunt partajate numai cu consimțământul dvs. explicit.'}]}},
    {k:'handling',eyebrow:'07 – După o raportare',title:'Iată exact ce se întâmplă în continuare.',body:['Fiecare raportare este luată în serios. Din momentul în care luați contact, procesul este documentat și structurat.'],activity:{type:'choice',prompt:'Adevărat sau fals: Dacă utilizați procesul informal de plângere, nu mai puteți depune o plângere formală ulterior.',options:['Adevărat — utilizarea mai întâi a căii informale închide calea formală.','Fals — procesul informal nu împiedică depunerea unei plângeri formale într-o etapă ulterioară.','Adevărat numai dacă procesul informal a fost finalizat cu succes.'],answer:1,ok:'Corect. Politica prevede explicit că încercarea de rezolvare informală nu împiedică persoana afectată să depună o plângere formală ulterior.',bad:'Nu chiar. Politica vă protejează dreptul de a escalada la o plângere formală chiar dacă ați încercat mai întâi să o rezolvați informal.'}},
    {k:'mechanisms',eyebrow:'08 – Cele trei căi',title:'Informală. Formală. Externă.',body:['Dvs. și persoana de contact desemnată decideți împreună care cale este potrivită pentru situația dvs.','Nu există o alegere greșită. Dorințele dvs. vor fi respectate în orice moment.'],activity:{type:'compare',cols:[{head:'Informală',body:'O persoană de contact desemnată vorbește cu presupusul hărțuitor. Poate avea loc o discuție facilitată — numai cu consimțământul dvs. și numai dacă vă simțiți în siguranță.'},{head:'Formală',body:'Un(o) reprezentant(ă) senior de HR inițiază o investigație completă. Toate părțile sunt intervievate separat. Se întocmește un raport scris cu constatări și recomandări.'},{head:'Externă',body:'Puteți contacta oricând organisme juridice externe sau ombudsmanul Grupului Otto. Acest drept nu este afectat de utilizarea prealabilă a canalelor interne.'}]},quiz:{quiz:{type:'choice',prompt:'Ce se întâmplă dacă încercați mai întâi calea informală — puteți depune totuși o plângere formală ulterior?',options:['Nu — alegerea căii informale închide opțiunea formală.','Da — calea informală nu vă afectează dreptul de a depune o plângere formală.','Numai dacă procesul informal a eșuat complet.'],answer:1,ok:'Corect. Nu există o alegere greșită — alegerea mai întâi a căii informale nu vă elimină niciodată dreptul de a escalada la o plângere formală.',bad:'Nu chiar. Politica este clară: dreptul dumneavoastră de a depune o plângere formală este întotdeauna păstrat, indiferent de calea aleasă prima dată.'}}},
    {k:'protection',eyebrow:'09 – Protecția dvs.',title:'Depunerea unui raport nu vă va pune în pericol.',body:['EOS se angajează să protejeze orice persoană care ridică o problemă cu bună-credință.','Anonimatul dvs. va fi protejat în cea mai mare măsură posibilă, cu excepția cazului în care cerințele legale impun altfel.','Persoana despre care raportați este prezumată nevinovată până când o investigație conclude altfel.'],activity:{type:'flip',prompt:'Trei garanții',cards:[{icon:'🔒',title:'Confidențialitate',text:'Toate plângerile sunt tratate cu respect și confidențialitate pe parcursul întregului proces.'},{icon:'🛡️',title:'Fără represalii',text:'Nimeni care raportează cu bună-credință nu va fi dezavantajat(ă), penalizat(ă) sau victimizat(ă).'},{icon:'⚖️',title:'Proces echitabil',text:'Prezumția de nevinovăție se aplică oricărei persoane acuzate de hărțuire.'}]}},
    {k:'sanctions',eyebrow:'10 – Consecințe',title:'Cazurile confirmate duc la consecințe reale.',body:['Orice persoană găsită vinovată de hărțuire sexuală va face față unor măsuri disciplinare corespunzătoare.','Severitatea depinde de frecvență, circumstanțe și legislația locală aplicabilă.','EOS nu tratează aceste cazuri ca fiind lipsite de importanță.'],activity:{type:'list',heading:'Măsuri posibile',items:['Avertisment verbal sau scris','Evaluare negativă a performanței','Reducerea remunerației variabile (acolo unde este permis legal)','Transfer la alt rol sau departament','Retrogradare','Suspendare','Concediere (în cazuri grave, imediată)']}},
    {k:'manager',managerOnly:true,eyebrow:'11 – Rolul dvs. (Manager / HR)',title:'Când cineva vine la dvs.: ce să faceți.',body:['Sunteți adesea prima persoană la care apelează un angajat afectat.','Modul în care reacționați în acel moment contează semnificativ.','Sarcina dvs. nu este să investigați — ci să ascultați, să informați și să sprijiniți.'],activity:{type:'steps',heading:'Când este ridicată o problemă',steps:['Luați-o în serios. Nu minimizați și nu respingeți ceea ce auziți.','Ascultați fără a judeca și fără a promite rezultate specifice.','Informați persoana despre procedurile disponibile: informală, formală și externă.','Documentați clar. Recomandați Speak Up pentru o urmă digitală rapidă.','Coordonați pașii următori cu persoana afectată — respectați dorințele acesteia în orice moment.','Mențineți o strictă confidențialitate. Aplicați principiul necesității de a cunoaște.']}},
    {k:'manager2',managerOnly:true,eyebrow:'12 – Gestionarea formală (Manager / HR)',title:'Ce vă cere procesul formal.',body:['Odată depusă o plângere formală, un(o) reprezentant(ă) senior de HR preia responsabilitatea.','Investigațiile sunt conduse imparțial, confidențial și prompt.','Rolul dvs.: să sprijiniți procesul, nu să îl conduceți — cu excepția cazului în care sunteți desemnat(ă) formal ca investigator(oare).'],activity:{type:'scenario',tag:'Scenariu Manager / HR',text:'O angajată vă spune că a experimentat avansuri nedorite repetate din partea unui coleg de același nivel. Nu este sigură ce vrea să facă încă și vă întreabă dacă trebuie să decidă acum.',question:'Cum ar trebui să răspundeți?',answer:'Informați-o că nu trebuie să decidă imediat. Explicați căile disponibile: rezolvare informală, plângere formală și opțiuni externe. Evidențiați Speak Up ca cea mai rapidă și sigură cale digitală. Clarificați că dorințele sale vor fi respectate pe tot parcursul și că ridicarea unei probleme nu o va dezavantaja.'},quiz:{quiz:{type:'choice',prompt:'Cine conduce investigația atunci când este depusă o plângere formală?',options:['Managerul care a primit primul raportul.','Un reprezentant HR senior.','Superiorul direct al persoanei acuzate.'],answer:1,ok:'Corect. Odată depusă o plângere formală, un reprezentant HR senior preia responsabilitatea — nu managerul care a primit raportul.',bad:'Nu chiar. Procesul formal este condus de un reprezentant HR senior pentru a asigura imparțialitate și confidențialitate.'}}},
    {k:'close',eyebrow:'Final',title:'Acum sunteți pregătit(ă).',body:['Știți ce înseamnă hărțuirea sexuală conform politicii EOS.','Cunoașteți canalele de raportare și ce se întâmplă după o raportare.','Vă cunoașteți drepturile și — dacă sunteți manager sau HR — responsabilitățile.','Comportamentul respectuos este responsabilitatea comună a tuturor.'],activity:{type:'commit',text:'Înțeleg principiile cheie ale Politicii Corporative EOS privind Hărțuirea Sexuală și știu unde să găsesc sprijin și opțiuni de raportare.'}}

  ui:{quizHint:'Kérjük, válassza a helyes választ a folytatáshoz.',back:'Vissza',continue:'Tovább',finish:'Befejezés',restart:'Újrakezdés',selectLang:'Válasszon nyelvet',selectRole:'Ki vagy?',employee:'Munkavállaló',manager:'Vezető / Human Resources',empDesc:'Ismerje meg, mit jelent a szexuális zaklatás, hol vannak a határok, és milyen lehetőségei vannak, ha érintett.',mgrDesc:'Az összes munkavállalói tartalom, plusz egy dedikált modul arról, hogyan támogassa azokat, akik problémával fordulnak Önhöz.',startBtn:'Képzés indítása',complete:'Képzés befejezve',completeMsg:'Köszönjük, hogy elvégezte az EOS Tisztelettudó Munkahelyi Képzést.',tapHint:'Érintsen meg egy kártyát a felfedéshez',showGuidance:'Útmutatás megjelenítése'},

    {k:'definition',eyebrow:'02 – Mi a szexuális zaklatás?',title:'Nem a szándék a döntő. A hatás az.',body:['A szexuális zaklatás olyan nemkívánatos, szexuális jellegű magatartás, amely megsérti, megalázza vagy megfélemlíti az érintett személyt.','Lehet egyetlen eset vagy ismétlődő magatartásminta.','A kulcskérdés: a magatartás nemkívánatosnak minősült-e a célszemély számára?'],activity:{type:'choice',prompt:'Forgatókönyv: Egy kolléga szexuálisan explicit viccet küld a céges csevegőn. A címzett nem válaszol, de kellemetlenül érzi magát. Ez szexuális zaklatásnak minősül az EOS irányelve szerint?',options:['Nem — senki sem szólt semmit, tehát nem volt nemkívánatos.','Igen — a magatartás szexuális jellegű volt, és kellemetlen érzést okozott a címzettnek.','Csak akkor, ha egynél többször fordul elő.'],answer:1,ok:'Helyes. Az irányelv egyértelművé teszi, hogy az számít, hogy a magatartás nemkívánatos volt-e a címzett számára — nem az, hogy valaki tiltakozott-e, és nem az, hogy ismétlődött-e.',bad:'Nem egészen. Az irányelv arra összpontosít, hogy a magatartás nemkívánatos volt-e a címzett számára. A hallgatás nem jelenti azt, hogy a magatartás üdvözlendő volt.'}},

    {k:'boundaries',eyebrow:'04 – Hol érvényes?',title:'A munkahely több mint az iroda.',body:['A tilalom az EOS létesítményeire és a szokásos munkahelyen kívülre egyaránt vonatkozik.','Ez magában foglalja a vállalat által szponzorált társadalmi eseményeket, üzleti utakat, képzési foglalkozásokat és konferenciákat.','Bárki érintett lehet, nemtől függetlenül — beleértve az azonos nemű személyek közötti eseteket is.'],activity:{type:'scenario',tag:'Forgatókönyv',text:'Egy EOS által szponzorált vacsora során egy csapattag ismételten bókol egy kollégának a megjelenésével kapcsolatban olyan módon, amely láthatóan kényelmetlenné teszi a kollégát. A kolléga semmit sem szól, de az este hátralévő részében kerüli az illetőt.',question:'Ez az EOS irányelve alá tartozik?',answer:'Igen. Az irányelv kiterjed az EOS által szponzorált, a szokásos munkahelyen kívüli eseményekre. A döntő tényező a célszemély által érzett kényelmetlenség — nem az, hogy mondott-e valamit.'}},
    {k:'affected',eyebrow:'05 – Ha Önnel történik',title:'Több lehetősége van, mint gondolná.',body:['Nem köteles közvetlenül szembesíteni a másik személlyel — különösen egyenlőtlen kapcsolatokban.','Az EOS elismeri, hogy a közvetlen megszólalás nem mindig lehetséges vagy biztonságos.','Bármelyik utat választja is, aggályait bizalmasan és tisztelettel kezelik.'],activity:{type:'steps',heading:'Az Ön lehetőségei lépésről lépésre',steps:['Ha biztonságos és megfelelő: tudassa a személlyel, hogy magatartása nemkívánatos.','Ha a közvetlen kapcsolatfelvétel nem biztonságos vagy lehetetlen: forduljon egy kijelölt kapcsolattartó személyhez.','Gyors és teljesen digitális folyamathoz: tegyen bejelentést a Speak Up rendszeren keresztül — bizalmasan és, ha kívánja, névtelenül.','Az Otto Csoport külső ombudsmanjával is bármikor kapcsolatba léphet.','A külső jogi lehetőségek (munkaügyi bíróságok stb.) továbbra is elérhetők maradnak, és a belső csatornák igénybevétele nem érinti őket.']}},
    {k:'reporting',eyebrow:'06 – Bejelentési csatornák',title:'Speak Up: gyors, digitális, dokumentált.',body:['A Speak Up az EOS preferált belső csatornája: biztonságos, dokumentált és bizalmas.','Névtelen bejelentés lehetséges, ha azt kívánják.','Más belső kapcsolattartók is elérhetők. Azt használja, amelyik a legmegfelelőbbnek tűnik Önnek.'],activity:{type:'highlight',items:[{head:'Speak Up',body:'A preferált út. Tegyen bejelentést biztonságosan, bármikor, bizalmasan és szükség esetén névtelenül. A Group Compliance automatikusan értesítést kap.'},{head:'Belső kapcsolattartó személyek',body:'A helyi HR, a Group HR és a Sokszínűség-menedzsment kijelölt kapcsolattartási pontok. Képzett szakemberek, akik tisztelettel és bizalmasan kezelik a panaszokat.'},{head:'Otto Csoport ombudsmanja',body:'Független külső ügyvéd, akit szigorú titoktartás köt. A bejelentések névtelenül is benyújthatók, és az információkat csak az Ön kifejezett hozzájárulásával osztják meg.'}]}},
    {k:'handling',eyebrow:'07 – Bejelentés után',title:'Pontosan ez történik ezután.',body:['Minden bejelentést komolyan vesznek. A kapcsolatfelvétel pillanatától kezdve a folyamat dokumentált és strukturált.'],activity:{type:'choice',prompt:'Igaz vagy hamis: Ha igénybe veszi az informális panaszeljárást, utólag már nem nyújthat be formális panaszt.',options:['Igaz — aki először az informális utat választja, lezárja a formális utat.','Hamis — az informális eljárás nem akadályozza meg a formális panasz benyújtását egy későbbi szakaszban.','Csak akkor igaz, ha az informális eljárás sikeresen lezárult.'],answer:1,ok:'Helyes. Az irányelv kifejezetten kimondja, hogy az informális megoldás megkísérlése nem akadályozza meg az érintett személyt abban, hogy később formális panaszt nyújtson be.',bad:'Nem egészen. Az irányelv védi az Ön jogát arra, hogy formális panaszra emelje az ügyet, még akkor is, ha először informálisan próbálta megoldani.'}},
    {k:'mechanisms',eyebrow:'08 – A három út',title:'Informális. Formális. Külső.',body:['Ön és a kijelölt kapcsolattartó személy közösen döntenek arról, melyik út megfelelő az adott helyzetben.','Nincs rossz választás. Az Ön kívánságait mindenkor tiszteletben tartják.'],activity:{type:'compare',cols:[{head:'Informális',body:'Egy kijelölt kapcsolattartó személy beszél az állítólagos zaklatóval. Facilitált megbeszélésre is sor kerülhet — kizárólag az Ön hozzájárulásával és csak akkor, ha biztonságban érzi magát.'},{head:'Formális',body:'Egy vezető HR-képviselő teljes körű vizsgálatot indít. Minden érintett felet külön hallgatnak meg. Megállapításokat és ajánlásokat tartalmazó írásos jelentés készül.'},{head:'Külső',body:'Bármikor fordulhat külső jogi szervekhez vagy az Otto Csoport ombudsmanjához. Ezt a jogát a belső csatornák korábbi igénybevétele nem érinti.'}]},quiz:{quiz:{type:'choice',prompt:'Mi történik, ha először a nem hivatalos utat próbálja — utána is benyújthat hivatalos panaszt?',options:['Nem — a nem hivatalos út választása lezárja a hivatalos lehetőséget.','Igen — a nem hivatalos út nem érinti a hivatalos panasz benyújtásához való jogát.','Csak akkor, ha a nem hivatalos folyamat teljesen sikertelen volt.'],answer:1,ok:'Helyes. Nincs rossz döntés — a nem hivatalos út első választása sohasem vonja meg a hivatalos panaszra való eskálálás jogát.',bad:'Nem egészen. A szabályzat egyértelmű: a hivatalos panasz benyújtásához való joga mindig megmarad, függetlenül attól, melyik utat választotta először.'}}},
    {k:'protection',eyebrow:'09 – Az Ön védelme',title:'A bejelentés nem teszi ki Önt kockázatnak.',body:['Az EOS elkötelezi magát amellett, hogy mindenkit megvéd, aki jóhiszeműen jelez egy problémát.','Névtelenségét a lehető legnagyobb mértékben megvédik, kivéve, ha jogi követelmények mást nem írnak elő.','Az a személy, akiről bejelentést tesz, ártatlannak vélelmezendő mindaddig, amíg a vizsgálat más következtetésre nem jut.'],activity:{type:'flip',prompt:'Három garancia',cards:[{icon:'🔒',title:'Titoktartás',text:'Minden panaszt tisztelettel és bizalmasan kezelnek a teljes folyamat során.'},{icon:'🛡️',title:'Megtorlás tilalma',text:'Senkit, aki jóhiszeműen tesz bejelentést, nem érhet hátrány, büntetés vagy megtorlás.'},{icon:'⚖️',title:'Tisztességes eljárás',text:'Az ártatlanság vélelme érvényes minden zaklatással vádolt személyre.'}]}},

    {k:'manager2',managerOnly:true,eyebrow:'12 – Formális kezelés (Vezető / HR)',title:'Mit követel Öntől a formális eljárás.',body:['Amint formális panaszt nyújtanak be, egy vezető HR-képviselő veszi át az ügyet.','A vizsgálatokat pártatlanul, bizalmasan és gyorsan végzik.','Az Ön szerepe: támogatni a folyamatot, nem irányítani — kivéve, ha formálisan vizsgálóként jelölik ki.'],activity:{type:'scenario',tag:'Vezető / HR forgatókönyv',text:'Egy munkavállaló elmondja Önnek, hogy ismételt nemkívánatos közeledést tapasztalt egy azonos szintű kollégától. Még nem biztos abban, hogy mit szeretne tenni, és megkérdezi, hogy most kell-e döntenie.',question:'Hogyan kellene reagálnia?',answer:'Tudassa vele, hogy nem kell azonnal döntenie. Ismertesse az elérhető utakat: informális megoldás, formális panasz és külső lehetőségek. Emelje ki a Speak Up-ot mint a leggyorsabb és legbiztonságosabb digitális utat. Tegye egyértelművé, hogy kívánságait a folyamat egésze során tiszteletben tartják, és hogy a probléma jelzése nem hozza hátrányos helyzetbe.'},quiz:{quiz:{type:'choice',prompt:'Ki vezeti a vizsgálatot, amikor hivatalos panaszt nyújtanak be?',options:['Az a vezető, aki elsőként kapta a bejelentést.','Egy senior HR-képviselő.','A vádolt személy közvetlen felettese.'],answer:1,ok:'Helyes. Miután hivatalos panaszt nyújtanak be, egy senior HR-képviselő veszi át a felelősséget — nem a bejelentést fogadó vezető.',bad:'Nem egészen. A hivatalos folyamatot egy senior HR-képviselő vezeti az elfogulatlanság és a bizalmasság biztosítása érdekében.'}}},

    {k:'purpose',eyebrow:'01 – Защо е важно',title:'Нулева толерантност означава нулеви изключения.',body:['EOS не толерира сексуален тормоз — на никое място, в никаква среда, в никакъв формат.','Тази политика се прилага в световен мащаб за всички компании на Групата EOS и е задължителна за всички служители и ръководители.','Това обучение ви помага да разберете какво е обхванато, какво можете да направите и как EOS се справя със сигналите.'],activity:{type:'flip',prompt:'Три важни факта',cards:[{icon:'🌍',title:'Прилага се в целия свят',text:'Всички компании на Групата EOS са обхванати, независимо от размера или структурата.'},{icon:'⚖️',title:'Задължително за всички',text:'Ръководители, мениджъри и служители — всички трябва да спазват политиката.'},{icon:'🎯',title:'Какво дава това обучение',text:'Повишава осведомеността, изяснява границите и ви показва наличните възможности.'}]}},
    {k:'definition',eyebrow:'02 – Какво е сексуален тормоз?',title:'Не става дума за намерение. Става дума за въздействие.',body:['Сексуалният тормоз е нежелано поведение от сексуален характер, което обижда, унижава или сплашва дадено лице.','Може да бъде единичен инцидент или модел на поведение.','Ключовият въпрос: беше ли това поведение нежелано от лицето, към което беше насочено?'],activity:{type:'choice',prompt:'Сценарий: Колега изпраща сексуално explicit виц през служебния чат. Получателят не отговаря, но се чувства неудобно. Представлява ли това сексуален тормоз според политиката на EOS?',options:['Не — никой нищо не е казал, следователно не е нежелано.','Да — поведението беше от сексуален характер и накара получателя да се чувства неудобно.','Само ако се случи повече от веднъж.'],answer:1,ok:'Правилно. Политиката ясно посочва, че важното е дали поведението е нежелано от получателя — не дали някой е протестирал или дали се е повтаряло.',bad:'Не съвсем. Политиката се фокусира върху това дали поведението е нежелано от получателя. Мълчанието не означава, че поведението е добре дошло.'}},
    {k:'examples',eyebrow:'03 – Какво се включва?',title:'Три форми — всички забранени.',body:['Сексуалният тормоз може да бъде физически, словесен или невербален.','Примерите по-долу не са изчерпателни. При съмнение се запитайте: желано ли е това поведение от другото лице?'],activity:{type:'tabs',tabs:[{label:'Физически',items:['Нежелан контакт: потупване, щипане, галене, целуване, прегръщане, опипване или неподходящо докосване — включително привидно случаен контакт.','Физическо насилие, включително сексуално нападение.','Използване на свързани с работата заплахи или награди за получаване на сексуални услуги.']},{label:'Словесен',items:['Сексуално унизителни или деперсонализиращи забележки за хора или телата им.','Унизителни коментари за нечий сексуален живот.','Неподходящи сексуални истории или шеги.','Нежелани ухажвания или повторни покани за срещи или физическа близост.','Снизходителни или патерналистични забележки.','Изпращане на сексуално explicit съобщения.']},{label:'Невербален',items:['Излагане на сексуално explicit или внушаващ материал.','Сексуално внушаващи жестове.','Вторачване.','Свирене с уста.']}]},quiz:{quiz:{type:'choice',prompt:'Кой от следните примери е форма на невербален сексуален тормоз?',options:['Изпращане на сексуално експлицитни съобщения','Втренчен поглед или свирене с уста','Нежелан физически контакт'],answer:1,ok:'Вярно. Втренченият поглед и свиренето с уста са невербални форми на сексуален тормоз — без думи или физически контакт.',bad:'Не съвсем. Помислете за трите категории: физическа, вербална и невербална. Втренченият поглед и свиренето с уста попадат в невербалната.'}}},
    {k:'boundaries',eyebrow:'04 – Къде се прилага?',title:'Работното място е повече от офиса.',body:['Забраната се прилага в помещенията на EOS и извън редовното работно място.','Това включва спонсорирани от компанията социални събития, командировки, обучения и конференции.','Всеки може да бъде засегнат, независимо от пола — включително между лица от един и същи пол.'],activity:{type:'scenario',tag:'Сценарий',text:'По време на вечеря, спонсорирана от EOS, член на екипа многократно прави комплименти на колега за външния му вид по начин, който явно го поставя в неудобство. Колегата не казва нищо, но избягва това лице за остатъка от вечерта.',question:'Попада ли това под политиката на EOS?',answer:'Да. Политиката обхваща спонсорирани от EOS събития извън редовното работно място. Важното е дискомфортът, изпитан от получателя — не дали е казал нещо.'}},
    {k:'affected',eyebrow:'05 – Ако ви се случи',title:'Имате повече възможности, отколкото мислите.',body:['Не сте длъжни да се конфронтирате директно с другото лице — особено в неравностойни отношения.','EOS признава, че прякото говорене не винаги е възможно или безопасно.','Независимо кой път изберете, вашият сигнал ще бъде обработен с поверителност и уважение.'],activity:{type:'steps',heading:'Вашите възможности стъпка по стъпка',steps:['Когато е безопасно и подходящо: уведомете лицето, че поведението му е нежелано.','Ако прякото свързване изглежда опасно или невъзможно: обърнете се към определено лице за контакт.','За бърз и напълно цифров процес: подайте сигнал чрез Speak Up — поверително и, ако желаете, анонимно.','Можете да се свържете и с външния омбудсман на Групата Ото по всяко време.','Външните правни възможности (трудови съдилища и др.) остават налични и не се засягат от използването на вътрешни канали.']}},
    {k:'reporting',eyebrow:'06 – Канали за подаване на сигнали',title:'Speak Up: бързо, цифрово, документирано.',body:['Speak Up е предпочитаният вътрешен канал на EOS: сигурен, документиран и поверителен.','Анонимното подаване на сигнали е възможно при желание.','Налични са и други вътрешни контакти. Използвайте този, който ви е най-удобен.'],activity:{type:'highlight',items:[{head:'Speak Up',body:'Предпочитаният начин. Подайте сигнал сигурно, по всяко време, поверително и анонимно при необходимост. Group Compliance се уведомява автоматично.'},{head:'Вътрешни лица за контакт',body:'Местният HR, Group HR и Управлението на многообразието са определени точки за контакт. Те са обучени да разглеждат жалби с уважение и поверителност.'},{head:'Омбудсман на Групата Ото',body:'Независим външен адвокат, обвързан от строга поверителност. Сигналите могат да се подават анонимно, а информацията се споделя само с вашето изрично съгласие.'}]}},
    {k:'handling',eyebrow:'07 – След подаване на сигнал',title:'Ето какво се случва след това.',body:['Всеки сигнал се приема сериозно. От момента на свързване процесът е документиран и структуриран.'],activity:{type:'choice',prompt:'Вярно или невярно: Ако използвате неформалната процедура за жалби, вече не можете да подадете официална жалба по-късно.',options:['Вярно — използването първо на неформалния път затваря официалния.','Невярно — неформалната процедура не пречи на подаването на официална жалба на по-късен етап.','Вярно само ако неформалната процедура е приключила успешно.'],answer:1,ok:'Правилно. Политиката изрично посочва, че опитът за неформално разрешаване не пречи на засегнатото лице да подаде официална жалба по-късно.',bad:'Не съвсем. Политиката защитава правото ви да ескалирате до официална жалба, дори ако първо сте се опитали да я разрешите неформално.'}},
    {k:'mechanisms',eyebrow:'08 – Трите пътя',title:'Неформален. Официален. Външен.',body:['Вие и определеното от вас лице за контакт решавате заедно кой път е подходящ за вашата ситуация.','Няма грешен избор. Вашите желания ще бъдат уважавани по всяко време.'],activity:{type:'compare',cols:[{head:'Неформален',body:'Определено лице за контакт говори с предполагаемия извършител. Може да се проведе улеснена дискусия — само с ваше съгласие и само ако се чувствате в безопасност.'},{head:'Официален',body:'Старши представител на HR започва пълно разследване. Всички страни се изслушват поотделно. Изготвя се писмен доклад с констатации и препоръки.'},{head:'Външен',body:'По всяко време можете да се свържете с външни правни органи или с омбудсмана на Групата Ото. Това право не се засяга от предишното използване на вътрешни канали.'}]},quiz:{quiz:{type:'choice',prompt:'Какво се случва, ако първо опитате неформалния път — можете ли след това да подадете официална жалба?',options:['Не — изборът на неформален път затваря официалната опция.','Да — неформалният път не засяга правото ви да подадете официална жалба.','Само ако неформалният процес е пропаднал напълно.'],answer:1,ok:'Вярно. Няма грешен избор — изборът на неформален път никога не отнема правото ви да ескалирате до официална жалба.',bad:'Не съвсем. Политиката е ясна: правото ви да подадете официална жалба винаги е запазено, независимо кой път сте избрали първо.'}}},
    {k:'protection',eyebrow:'09 – Вашата защита',title:'Подаването на сигнал не ви излага на риск.',body:['EOS се ангажира да защитава всеки, който добросъвестно сигнализира за проблем.','Анонимността ви ще бъде защитена в максималната възможна степен, освен ако правните изисквания не налагат друго.','Лицето, за което подавате сигнал, се счита за невинно, докато разследването не достигне до друго заключение.'],activity:{type:'flip',prompt:'Три гаранции',cards:[{icon:'🔒',title:'Поверителност',text:'Всички жалби се обработват с уважение и поверителност през целия процес.'},{icon:'🛡️',title:'Без репресии',text:'Никой, който добросъвестно подаде сигнал, няма да бъде ощетен, наказан или виктимизиран.'},{icon:'⚖️',title:'Справедлив процес',text:'Презумпцията за невиновност се прилага за всяко лице, обвинено в тормоз.'}]}},
    {k:'sanctions',eyebrow:'10 – Последствия',title:'Потвърдените случаи водят до реални последствия.',body:['Всяко лице, за което е установено, че е извършило сексуален тормоз, ще бъде подложено на подходящи дисциплинарни мерки.','Тежестта зависи от честотата, обстоятелствата и приложимото местно законодателство.','EOS не третира тези случаи като маловажни.'],activity:{type:'list',heading:'Възможни мерки',items:['Устно или писмено предупреждение','Отрицателна оценка на изпълнението','Намаляване на променливото възнаграждение (където е законово допустимо)','Преназначаване на друга роля или отдел','Понижаване','Отстраняване','Уволнение (в сериозни случаи — незабавно)']}},
    {k:'manager',managerOnly:true,eyebrow:'11 – Вашата роля (Ръководител / HR)',title:'Когато някой дойде при вас: какво да правите.',body:['Вие често сте първото лице, към което се обръща засегнатият служител.','Начинът, по който реагирате в този момент, е от голямо значение.','Вашата задача не е да разследвате — а да изслушвате, информирате и подкрепяте.'],activity:{type:'steps',heading:'Когато е повдигнат проблем',steps:['Приемете го сериозно. Не омаловажавайте и не отхвърляйте това, което чувате.','Слушайте без да съдите и без да обещавате конкретни резултати.','Информирайте лицето за наличните процедури: неформална, официална и външна.','Документирайте ясно. Препоръчайте Speak Up за бърза цифрова документация.','Координирайте следващите стъпки със засегнатото лице — уважавайте желанията му по всяко време.','Поддържайте строга поверителност. Прилагайте принципа „необходимост да се знае".']}},
    {k:'manager2',managerOnly:true,eyebrow:'12 – Официална процедура (Ръководител / HR)',title:'Какво изисква от вас официалната процедура.',body:['След подаване на официална жалба старши представител на HR поема отговорността.','Разследванията се провеждат безпристрастно, поверително и своевременно.','Вашата роля: да подкрепяте процеса, а не да го ръководите — освен ако не сте официално назначен/а за разследващ/а.'],activity:{type:'scenario',tag:'Сценарий Ръководител / HR',text:'Служителка ви казва, че е преживяла многократни нежелани ухажвания от колега на същото ниво. Тя все още не е сигурна какво иска да направи и пита дали трябва да реши сега.',question:'Как трябва да реагирате?',answer:'Уведомете я, че не трябва да решава незабавно. Обяснете наличните пътища: неформално разрешаване, официална жалба и външни възможности. Откройте Speak Up като най-бързия и най-сигурен цифров начин. Изяснете, че желанията й ще бъдат уважавани по цялото времетраене на процеса и че сигнализирането няма да я постави в неблагоприятно положение.'},quiz:{quiz:{type:'choice',prompt:'Кой ръководи разследването при подаване на официална жалба?',options:['Ръководителят, получил сигнала пръв.','Старши представител на HR.','Прекият ръководител на обвиненото лице.'],answer:1,ok:'Вярно. След подаване на официална жалба старши представител на HR поема отговорността — не ръководителят, получил сигнала.',bad:'Не съвсем. Официалният процес се ръководи от старши представител на HR, за да се осигури безпристрастност и поверителност.'}}},
    {k:'close',eyebrow:'Финал',title:'Вече сте подготвени.',body:['Знаете какво означава сексуален тормоз според политиката на EOS.','Познавате каналите за подаване на сигнали и какво се случва след подаване на сигнал.','Познавате правата си и — ако сте ръководител или HR — отговорностите си.','Уважителното поведение е обща отговорност на всички.'],activity:{type:'commit',text:'Разбирам ключовите принципи на Корпоративната политика на EOS относно сексуалния тормоз и знам къде да намеря подкрепа и възможности за подаване на сигнали.'}}
  ]
};

CONTENT['hr'] = {
