    {k:'purpose',eyebrow:'01 – Warum das wichtig ist',title:'Null Toleranz bedeutet null Ausnahmen.',body:['EOS duldet sexuelle Belästigung in keiner Form — an keinem Ort, in keinem Umfeld, in keinem Format.','Diese Richtlinie gilt weltweit für alle Unternehmen der EOS Group und ist für alle Mitarbeitenden und Führungskräfte verbindlich.','Dieses Training erklärt, was abgedeckt ist, was du tun kannst und wie EOS mit Meldungen umgeht.'],activity:{type:'flip',prompt:'Drei wichtige Fakten',cards:[{icon:'🌍',title:'Weltweite Geltung',text:'Alle Unternehmen der EOS Group sind erfasst, unabhängig von Größe oder Struktur.'},{icon:'⚖️',title:'Verbindlich für alle',text:'Führungskräfte, Manager und Mitarbeitende — alle müssen die Richtlinie einhalten.'},{icon:'🎯',title:'Was dieses Training bewirkt',text:'Schärft das Bewusstsein, erklärt Grenzen und zeigt dir deine Optionen.'}]}},
    {k:'definition',eyebrow:'02 – Was ist sexuelle Belästigung?',title:'Es geht nicht um Absicht. Es geht um Wirkung.',body:['Sexuelle Belästigung ist unerwünschtes Verhalten sexueller Natur, das eine Person beleidigt, demütigt oder einschüchtert.','Es kann sich um einen einzelnen Vorfall oder ein Verhaltensmuster handeln.','Die entscheidende Frage: War das Verhalten von der betroffenen Person unerwünscht?'],activity:{type:'choice',prompt:'Szenario: Ein Kollege schickt über den Firmenchat einen sexuell expliziten Witz. Die empfangende Person antwortet nicht, fühlt sich aber unwohl. Ist das nach der EOS-Richtlinie sexuelle Belästigung?',options:['Nein — niemand hat etwas gesagt, also war es nicht unerwünscht.','Ja — das Verhalten war sexueller Natur und hat die empfangende Person unwohl fühlen lassen.','Nur wenn es mehr als einmal passiert.'],answer:1,ok:'Richtig. Die Richtlinie stellt klar, dass entscheidend ist, ob das Verhalten von der empfangenden Person unerwünscht war — nicht ob jemand gesprochen hat oder ob es sich wiederholt hat.',bad:'Nicht ganz. Die Richtlinie stellt auf das subjektive Empfinden der betroffenen Person ab. Schweigen bedeutet nicht, dass das Verhalten willkommen war.'}},
    {k:'examples',eyebrow:'03 – Was zählt dazu?',title:'Drei Formen — alle verboten.',body:['Sexuelle Belästigung kann körperlicher, verbaler oder nonverbaler Natur sein.','Die folgenden Beispiele sind nicht abschließend. Im Zweifelsfall frage dich: Ist dieses Verhalten von der anderen Person gewünscht?'],activity:{type:'tabs',tabs:[{label:'Körperlich',items:['Unerwünschter Körperkontakt: Tätscheln, Kneifen, Streicheln, Küssen, Umarmen, Betasten oder unangemessenes Berühren — auch scheinbar zufälliger Kontakt.','Körperliche Gewalt, einschließlich sexueller Übergriffe.','Nutzung beruflicher Drohungen oder Belohnungen zur Erlangung sexueller Gefälligkeiten.']},{label:'Verbal',items:['Sexuell entwürdigende oder entpersönlichende Bemerkungen über Personen oder ihren Körper.','Herabsetzende Kommentare über das Sexualleben einer Person.','Unangemessene sexuelle Geschichten oder Witze.','Unerwünschte Annäherungsversuche oder wiederholte Einladungen zu Dates oder körperlicher Intimität.','Herablassende oder bevormundende Bemerkungen.','Versenden sexuell expliziter Nachrichten.']},{label:'Nonverbal',items:['Ausstellen sexuell expliziten oder anzüglichen Materials.','Sexuell anzügliche Gesten.','Anstarren.','Pfeifen.']}]},quiz:{type:'choice',prompt:'Welches der folgenden Beispiele ist eine Form nonverbaler sexueller Belästigung?',options:['Versenden sexuell expliziter Nachrichten','Anstarren oder Pfeifen','Unerwünschter körperlicher Kontakt'],answer:1,ok:'Richtig. Anstarren und Pfeifen sind nonverbale Formen sexueller Belästigung — ohne Worte oder körperlichen Kontakt.',bad:'Nicht ganz. Denk an die drei Kategorien: körperlich, verbal und nonverbal. Anstarren und Pfeifen fallen unter nonverbal.'}},
    {k:'boundaries',eyebrow:'04 – Wo gilt das?',title:'Der Arbeitsplatz ist mehr als das Büro.',body:['Das Verbot gilt auf dem EOS-Gelände und außerhalb des regulären Arbeitsplatzes.','Dies schließt vom Unternehmen gesponserte Veranstaltungen, Dienstreisen, Schulungen und Konferenzen ein.','Jede Person kann betroffen sein, unabhängig vom Geschlecht — auch zwischen Personen desselben Geschlechts.'],activity:{type:'scenario',tag:'Szenario',text:'Beim einem von EOS gesponserten Abendessen macht ein Teammitglied einer Kollegin wiederholt Komplimente zu ihrem Aussehen, die die Kollegin sichtlich unwohl fühlen lassen. Die Kollegin sagt nichts, meidet die Person aber für den Rest des Abends.',question:'Fällt das unter die EOS-Richtlinie?',answer:'Ja. Die Richtlinie deckt von EOS gesponserte Veranstaltungen außerhalb des regulären Arbeitsplatzes ab. Entscheidend ist das Unbehagen der betroffenen Person — nicht ob sie etwas gesagt hat.'}},
    {k:'affected',eyebrow:'05 – Wenn es dir passiert',title:'Du hast verschiedene Möglichkeiten, dich zu melden.',body:['Du bist nicht verpflichtet, die andere Person direkt zu konfrontieren — besonders in ungleichen Beziehungen.','EOS erkennt an, dass direkte Ansprache nicht immer möglich oder sicher ist.','Welchen Weg du auch wählst — dein Anliegen wird vertraulich und respektvoll behandelt.','Konkrete Kontaktdaten findest du später in diesem Training und auf SharePoint.'],activity:{type:'steps',heading:'Deine Optionen Schritt für Schritt',steps:['Wenn sicher und angemessen: Teile der Person mit, dass ihr Verhalten unerwünscht ist. Je nach Situation glauben wir, dass vieles durch direkte Kommunikation gelöst werden kann.','Wenn direkter Kontakt nicht sicher oder möglich ist: Wende dich an eine benannte Kontaktperson.','Für einen gut dokumentierten und formellen Prozess: Melde dich über Speak Up — vertraulich und auf Wunsch anonym.','Wenn keiner der obigen Wege für dich passt: Du kannst dich auch an deine Führungskraft als vertrauensvolle Kontaktperson wenden.','Du kannst dich auch jederzeit an den externen Ombudsmann der Otto Group wenden.','Externe rechtliche Optionen bleiben verfügbar und werden durch die Nutzung interner Kanäle nicht berührt.']}},
    {k:'reporting',eyebrow:'06 – Meldekanäle',title:'Speak Up ist der bevorzugte Weg zur Einreichung einer Beschwerde.',body:['Speak Up ist der bevorzugte interne Kanal: sicher, dokumentiert und vertraulich.','Anonyme Meldungen sind möglich.','Weitere interne Kontakte stehen ebenfalls zur Verfügung. Nutze den Weg, der sich für dich richtig anfühlt.'],activity:{type:'highlight',items:[{head:'Speak Up',body:'Der bevorzugte Weg. Meldung sicher, jederzeit, vertraulich und bei Bedarf anonym einreichen. Group Compliance wird automatisch benachrichtigt.'},{head:'Interne Kontaktpersonen',body:'Lokale Führungskräfte (FK), Group HR und Diversity Management sind benannte Anlaufstellen. Sie sind darin geschult, Beschwerden respektvoll und vertraulich zu behandeln.'},{head:'Otto Group Ombudsmann',body:'Ein unabhängiger externer Anwalt mit strenger Schweigepflicht. Meldungen können anonym eingereicht werden. Dieser Kanal ist besonders für Fälle gedacht, in denen Speak Up oder interne Kontaktwege für dich nicht in Frage kommen.'}]}},
    {k:'mechanisms',eyebrow:'07 – Die drei Wege',title:'Informell. Formell. Extern.',body:['Du und deine Kontaktperson entscheiden gemeinsam, welcher Weg für deine Situation der richtige ist.','Es gibt keine falsche Wahl. Deine Wünsche werden jederzeit respektiert.'],activity:{type:'compare',cols:[{head:'Informell',body:'Eine Führungskraft spricht mit der beschuldigten Person. Ein moderiertes Gespräch kann stattfinden — nur mit deiner Zustimmung und nur wenn du dich sicher fühlst.'},{head:'Formell',body:'Eine leitende HR-Person leitet eine vollständige Untersuchung ein. Alle Beteiligten werden getrennt befragt. Ein schriftlicher Bericht mit Ergebnissen und Empfehlungen wird erstellt.'},{head:'Extern',body:'Du kannst jederzeit externe Stellen oder den Ombudsmann der Otto Group kontaktieren. Dieses Recht wird durch die vorherige Nutzung interner Kanäle nicht beeinträchtigt.'}]},quiz:{type:'choice',prompt:'Was passiert, wenn du zuerst den informellen Weg wählst — kannst du danach noch eine formelle Beschwerde einreichen?',options:['Nein — wer zuerst informell vorgeht, verliert den formellen Weg.','Ja — der informelle Weg berührt dein Recht auf eine formelle Beschwerde nicht.','Nur wenn das informelle Verfahren erfolglos war.'],answer:1,ok:'Richtig. Es gibt keine falsche Wahl — der informelle Weg schließt eine spätere formelle Beschwerde nie aus.',bad:'Nicht ganz. Die Richtlinie ist eindeutig: Dein Recht auf eine formelle Beschwerde bleibt immer gewahrt, egal welchen Weg du zuerst gewählt hast.'}},
    {k:'handling',eyebrow:'08 – Nach einer Meldung',title:'Was als Nächstes passiert.',body:['Jede Meldung wird ernst genommen. Ab dem Moment der Kontaktaufnahme ist der Prozess dokumentiert und strukturiert.'],activity:{type:'choice',prompt:'Richtig oder falsch: Wenn du das informelle Beschwerdeverfahren nutzt, kannst du danach keine formelle Beschwerde mehr einreichen.',options:['Richtig — wer zuerst informell vorgeht, verliert den formellen Weg.','Falsch — das informelle Verfahren schließt eine spätere formelle Beschwerde nicht aus.','Nur richtig, wenn das informelle Verfahren erfolgreich abgeschlossen wurde.'],answer:1,ok:'Richtig. Die Richtlinie stellt ausdrücklich klar, dass ein informeller Lösungsversuch die betroffene Person nicht daran hindert, später eine formelle Beschwerde einzureichen.',bad:'Nicht ganz. Die Richtlinie schützt dein Recht, auch nach einem informellen Verfahren eine formelle Beschwerde einzureichen.'}},
    {k:'protection',eyebrow:'09 – Dein Schutz',title:'Eine Meldung bringt dich nicht in Gefahr.',body:['EOS verpflichtet sich, alle Personen zu schützen, die in gutem Glauben eine Beschwerde einreichen.','Deine Anonymität wird so weit wie möglich gewahrt, sofern keine gesetzlichen Anforderungen etwas anderes verlangen.','Die Person, über die du berichtest, gilt bis zum Abschluss einer Untersuchung als unschuldig.'],activity:{type:'flip',prompt:'Drei Garantien',cards:[{icon:'🔒',title:'Vertraulichkeit',text:'Alle Beschwerden werden während des gesamten Prozesses respektvoll und vertraulich behandelt.'},{icon:'🛡️',title:'Kein Nachteil',text:'Niemand, der in gutem Glauben eine Meldung erstattet, wird benachteiligt, bestraft oder schikaniert.'},{icon:'⚖️',title:'Faires Verfahren',text:'Die Unschuldsvermutung gilt für jede Person, die der Belästigung beschuldigt wird.'}]}},
    {k:'sanctions',eyebrow:'10 – Konsequenzen',title:'Bestätigte Fälle haben reale Folgen.',body:['Jede Person, bei der sexuelle Belästigung nachgewiesen wurde, muss mit angemessenen Disziplinarmaßnahmen rechnen.','Die Schwere hängt von Häufigkeit, Umständen und geltendem lokalem Recht ab.','EOS behandelt diese Fälle nicht als Bagatelle.'],activity:{type:'list',heading:'Mögliche Maßnahmen',items:['Mündliche oder schriftliche Abmahnung','Negative Leistungsbeurteilung','Versetzung in eine andere Rolle oder Abteilung','Degradierung','Suspendierung','Kündigung (in schwerwiegenden Fällen fristlos)']}},
    {k:'manager',managerOnly:true,eyebrow:'11 – Deine Rolle (Führungskraft / HR)',title:'Wenn jemand zu dir kommt: Was tun?',body:['Du bist oft die erste Person, an die sich betroffene Mitarbeitende wenden.','Wie du in diesem Moment reagierst, ist entscheidend.','Deine Aufgabe ist nicht, zu ermitteln — sondern zuzuhören, zu informieren und zu unterstützen.'],activity:{type:'steps',heading:'Wenn ein Anliegen vorgebracht wird',steps:['Nimm es ernst. Verharmlosen oder abtun ist keine Option.','Höre zu ohne zu urteilen und ohne konkrete Ergebnisse zu versprechen.','Informiere die Person über verfügbare Verfahren: informell, formell und extern.','Dokumentiere sorgfältig — besonders wenn Speak Up nicht als Meldekanal genutzt wird.','Stimme die nächsten Schritte mit der betroffenen Person ab — respektiere jederzeit ihre Wünsche.','Wahre strikte Vertraulichkeit. Wende das Need-to-know-Prinzip an.']}},
    {k:'manager2',managerOnly:true,eyebrow:'12 – Formelles Verfahren (Führungskraft / HR)',title:'Was das formelle Verfahren von dir verlangt.',body:['Sobald eine formelle Beschwerde eingereicht wird, übernimmt eine leitende HR-Person die Verantwortung.','Untersuchungen werden unparteiisch, vertraulich und zügig durchgeführt.','Deine Rolle: den Prozess unterstützen, nicht leiten — es sei denn, du wirst formell als Ermittler:in ernannt.'],activity:{type:'scenario',tag:'Führungskraft / HR Szenario',text:'Eine Mitarbeiterin berichtet dir, dass sie wiederholt unerwünschte Annäherungsversuche von einer gleichrangigen Person erlebt hat. Sie ist sich noch nicht sicher, was sie tun möchte, und fragt, ob sie jetzt entscheiden muss.',question:'Wie solltest du reagieren?',answer:'Teile ihr mit, dass sie nicht sofort entscheiden muss. Erkläre die verfügbaren Wege: informelle Lösung, formelle Beschwerde und externe Optionen. Mache deutlich, dass ihre Wünsche jederzeit respektiert werden und dass eine Meldung keine Nachteile für sie hat.'},quiz:{type:'choice',prompt:'Wer leitet die Untersuchung, wenn eine formelle Beschwerde eingereicht wird?',options:['Die Führungskraft, die die Meldung zuerst erhalten hat.','Eine leitende HR-Person.','Die direkte Vorgesetzte der beschuldigten Person.'],answer:1,ok:'Richtig. Sobald eine formelle Beschwerde eingereicht wird, übernimmt eine leitende HR-Person die Verantwortung — nicht die empfangende Führungskraft.',bad:'Nicht ganz. Das formelle Verfahren wird von einer leitenden HR-Person geleitet, um Unparteilichkeit und Vertraulichkeit zu gewährleisten.'}},
    {k:'close',eyebrow:'Abschluss',title:'Du bist jetzt vorbereitet.',body:['Du weißt, was sexuelle Belästigung gemäß der EOS-Richtlinie bedeutet.','Du kennst die Meldekanäle und was nach einer Meldung passiert.','Du kennst deine Rechte und — als Führungskraft oder HR — deine Verantwortlichkeiten.','Respektvolles Verhalten ist die gemeinsame Verantwortung aller.'],activity:{type:'commit',text:'Ich verstehe die wesentlichen Grundsätze der EOS-Unternehmensrichtlinie zu sexueller Belästigung und weiß, wo ich Unterstützung und Meldemöglichkeiten finde.'}}
  ]
};

CONTENT['fr'] = {
  ui:{quizHint:'Veuillez sélectionner la bonne réponse pour continuer.',back:'Retour',continue:'Continuer',finish:'Terminer',restart:'Recommencer',selectLang:'Choisir la langue',selectRole:'Qui êtes-vous ?',employee:'Employé(e)',manager:'Responsable / Ressources Humaines',empDesc:'Découvrez ce que signifie le harcèlement sexuel, où se situent les limites et quelles options s\'offrent à vous si vous êtes concerné(e).',mgrDesc:'Tout le contenu employé, plus un module dédié à l\'accompagnement des personnes qui vous font part d\'une préoccupation.',startBtn:'Démarrer la formation',complete:'Formation terminée',completeMsg:'Merci d\'avoir suivi la formation EOS sur le respect au travail.',tapHint:'Touchez une carte pour révéler',showGuidance:'Afficher la solution'},
  modules:[
    {k:'purpose',eyebrow:'01 – Pourquoi c\'est important',title:'Tolérance zéro signifie zéro exception.',body:['EOS a une tolérance zéro pour le harcèlement sexuel — en tout lieu, tout contexte et tout format.','Cette politique s\'applique mondialement à toutes les sociétés du Groupe EOS et est contraignante pour tous les employés et dirigeants.','Cette formation vous aide à comprendre ce qui est couvert, ce que vous pouvez faire et comment EOS traite les signalements.'],activity:{type:'flip',prompt:'Trois points essentiels',cards:[{icon:'🌍',title:'Application mondiale',text:'Toutes les sociétés du Groupe EOS sont concernées, quelle que soit leur taille ou structure.'},{icon:'⚖️',title:'Obligatoire pour tous',text:'Dirigeants, managers et employés — tous doivent respecter cette politique.'},{icon:'🎯',title:'Objectif de la formation',text:'Sensibiliser, expliquer les limites et vous montrer vos options.'}]}},
    {k:'definition',eyebrow:'02 – Qu\'est-ce que le harcèlement sexuel ?',title:'Ce n\'est pas une question d\'intention. C\'est une question d\'impact.',body:['Le harcèlement sexuel est un comportement non désiré à caractère sexuel qui offense, humilie ou intimide une personne.','Il peut s\'agir d\'un incident isolé ou d\'un comportement répété.','La question clé : ce comportement était-il non désiré par la personne visée ?'],activity:{type:'choice',prompt:'Scénario : Un collègue envoie une blague à caractère sexuellement explicite via la messagerie d\'entreprise. Le destinataire ne répond pas mais se sent mal à l\'aise. S\'agit-il de harcèlement sexuel selon la politique EOS ?',options:['Non — personne n\'a rien dit, donc ce n\'était pas non désiré.','Oui — le comportement était à caractère sexuel et a mis le destinataire mal à l\'aise.','Seulement si cela se produit plus d\'une fois.'],answer:1,ok:'Correct. La politique précise que ce qui compte, c\'est si le comportement est non désiré par le destinataire — pas si quelqu\'un a protesté, ni si cela s\'est répété.',bad:'Pas tout à fait. La politique se concentre sur le caractère non désiré du comportement pour le destinataire. Le silence ne signifie pas que le comportement était bienvenu.'}},
    {k:'examples',eyebrow:'03 – Qu\'est-ce qui est concerné ?',title:'Trois formes — toutes interdites.',body:['Le harcèlement sexuel peut être physique, verbal ou non verbal.','Les exemples ci-dessous ne sont pas exhaustifs. En cas de doute, demandez-vous : ce comportement est-il désiré par l\'autre personne ?'],activity:{type:'tabs',tabs:[{label:'Physique',items:['Contact non désiré : tapoter, pincer, caresser, embrasser, enlacer, peloter ou toucher de manière inappropriée — y compris les contacts apparemment accidentels.','Violence physique, y compris les agressions sexuelles.','Utilisation de menaces ou de récompenses professionnelles pour obtenir des faveurs sexuelles.']},{label:'Verbal',items:['Remarques sexuellement dégradantes ou dépersonnalisantes sur des personnes ou leur corps.','Commentaires dégradants sur la vie sexuelle d\'une personne.','Histoires ou blagues sexuelles inappropriées.','Avances non désirées ou invitations répétées à des rendez-vous ou à l\'intimité physique.','Remarques condescendantes ou paternalistes.','Envoi de messages à caractère sexuellement explicite.']},{label:'Non verbal',items:['Affichage de matériel sexuellement explicite ou suggestif.','Gestes à connotation sexuelle.','Regards insistants.','Sifflements.']}]},quiz:{type:'choice',prompt:'Lequel des exemples suivants est une forme de harcèlement sexuel non verbal ?',options:['Envoyer des messages à caractère sexuellement explicite','Regarder fixement ou siffler','Toucher physiquement sans consentement'],answer:1,ok:'Correct. Regarder fixement et siffler sont des formes non verbales de harcèlement sexuel — sans mots ni contact physique.',bad:'Pas tout à fait. Pensez aux trois catégories : physique, verbal et non verbal. Regarder fixement et siffler relèvent du non verbal.'}},
    {k:'boundaries',eyebrow:'04 – Où s\'applique-t-il ?',title:'Le lieu de travail est plus grand que le bureau.',body:['L\'interdiction s\'applique sur les locaux EOS et en dehors du lieu de travail habituel.','Cela inclut les événements sociaux organisés par l\'entreprise, les voyages d\'affaires, les sessions de formation et les conférences.','Toute personne peut être concernée, quel que soit son sexe — y compris entre personnes du même sexe.'],activity:{type:'scenario',tag:'Scénario',text:'Lors d\'un dîner organisé par EOS, un membre de l\'équipe fait à plusieurs reprises des compliments à un(e) collègue sur son apparence, ce qui le/la met visiblement mal à l\'aise. Le/la collègue ne dit rien mais évite la personne pour le reste de la soirée.',question:'Cela relève-t-il de la politique EOS ?',answer:'Oui. La politique couvre les événements organisés par EOS en dehors du lieu de travail habituel. Ce qui compte, c\'est le malaise ressenti par le/la destinataire — pas s\'il/elle a dit quelque chose.'}},
    {k:'affected',eyebrow:'05 – Si cela vous arrive',title:'Vous disposez de plusieurs options pour vous manifester.',body:['Vous n\'êtes pas tenu(e) de confronter directement l\'autre personne — surtout dans des relations inégales.','EOS reconnaît que s\'exprimer directement n\'est pas toujours possible ou sûr.','Quelle que soit la voie que vous choisissez, vos préoccupations seront traitées avec confidentialité et respect.','Les coordonnées concrètes sont disponibles plus loin dans cette formation et sur SharePoint.'],activity:{type:'steps',heading:'Vos options, étape par étape',steps:['Si cela est sûr et approprié : faites savoir à la personne que son comportement est non désiré. Selon la situation, nous pensons que beaucoup de choses peuvent se résoudre par une communication directe.','Si le contact direct semble dangereux ou impossible : contactez une personne de contact désignée.','Pour un processus bien documenté et formel : signalez via Speak Up — de manière confidentielle et anonyme si vous le souhaitez.','Si aucune des options ci-dessus ne vous convient : vous pouvez également vous tourner vers votre responsable en tant que personne de confiance.','Vous pouvez également contacter à tout moment l\'ombudsman externe du Groupe Otto.','Les options juridiques externes restent disponibles et ne sont pas affectées par l\'utilisation des canaux internes.']}},
    {k:'reporting',eyebrow:'06 – Canaux de signalement',title:'Speak Up est la voie privilégiée pour déposer une plainte.',body:['Speak Up est le canal interne privilégié : sécurisé, documenté et confidentiel.','Le signalement anonyme est possible si souhaité.','D\'autres contacts internes sont également disponibles. Utilisez celui qui vous convient le mieux.'],activity:{type:'highlight',items:[{head:'Speak Up',body:'La voie privilégiée. Soumettez un rapport en toute sécurité, à tout moment, de manière confidentielle et anonyme si nécessaire. Le Groupe Compliance est automatiquement notifié.'},{head:'Personnes de contact internes',body:'Les responsables locaux (FK), les RH du Groupe et la Gestion de la diversité sont des points de contact désignés. Ils sont formés pour traiter les plaintes avec respect et confidentialité.'},{head:'Ombudsman du Groupe Otto',body:'Un avocat externe indépendant, soumis à une stricte confidentialité. Les rapports peuvent être soumis anonymement. Ce canal est particulièrement destiné aux cas où Speak Up ou les voies de contact internes ne semblent pas envisageables pour vous.'}]}},
    {k:'mechanisms',eyebrow:'07 – Les trois voies',title:'Informelle. Formelle. Externe.',body:['Vous et votre personne de contact désignée décidez ensemble quelle voie convient à votre situation.','Il n\'y a pas de mauvais choix. Vos souhaits seront respectés à tout moment.'],activity:{type:'compare',cols:[{head:'Informelle',body:'Un(e) responsable parle avec la personne mise en cause. Une discussion facilitée peut avoir lieu — uniquement avec votre consentement et seulement si vous vous sentez en sécurité.'},{head:'Formelle',body:'Un(e) représentant(e) RH senior lance une enquête complète. Toutes les parties sont interrogées séparément. Un rapport écrit avec les conclusions et recommandations est préparé.'},{head:'Externe',body:'Vous pouvez contacter à tout moment les instances juridiques externes ou l\'ombudsman du Groupe Otto. Ce droit n\'est pas affecté par l\'utilisation préalable des canaux internes.'}]},quiz:{type:'choice',prompt:'Que se passe-t-il si vous choisissez d\'abord la voie informelle — pouvez-vous encore déposer une plainte formelle ensuite ?',options:['Non — choisir la voie informelle en premier ferme la voie formelle.','Oui — la voie informelle n\'affecte pas votre droit de déposer une plainte formelle.','Seulement si la procédure informelle a échoué.'],answer:1,ok:'Correct. Il n\'y a pas de mauvais choix — emprunter la voie informelle en premier ne supprime jamais votre droit d\'escalader vers une plainte formelle.',bad:'Pas tout à fait. La politique est claire : votre droit de déposer une plainte formelle est toujours préservé, quelle que soit la voie empruntée en premier.'}},
    {k:'handling',eyebrow:'08 – Après un signalement',title:'Voici ce qui se passe ensuite.',body:['Chaque signalement est pris au sérieux. Dès le moment où vous prenez contact, le processus est documenté et structuré.'],activity:{type:'choice',prompt:'Vrai ou faux : Si vous utilisez la procédure de plainte informelle, vous ne pouvez plus déposer de plainte formelle par la suite.',options:['Vrai — utiliser la voie informelle en premier ferme la voie formelle.','Faux — la procédure informelle n\'empêche pas de déposer une plainte formelle ultérieurement.','Seulement vrai si la procédure informelle a été menée à bien.'],answer:1,ok:'Correct. La politique stipule explicitement que la tentative d\'une résolution informelle n\'empêche pas la personne concernée de déposer une plainte formelle ultérieurement.',bad:'Pas tout à fait. La politique protège votre droit de passer à une plainte formelle même si vous avez d\'abord essayé de résoudre le problème de manière informelle.'}},
    {k:'protection',eyebrow:'09 – Votre protection',title:'Faire un signalement ne vous mettra pas en danger.',body:['EOS s\'engage à protéger toute personne qui soulève une préoccupation de bonne foi.','Votre anonymat sera protégé dans toute la mesure du possible, sauf si des exigences légales l\'imposent autrement.','La personne que vous signalez est présumée innocente jusqu\'à ce qu\'une enquête conclue autrement.'],activity:{type:'flip',prompt:'Trois garanties',cards:[{icon:'🔒',title:'Confidentialité',text:'Toutes les plaintes sont traitées avec respect et confidentialité tout au long du processus.'},{icon:'🛡️',title:'Pas de représailles',text:'Personne qui signale de bonne foi ne sera désavantagé(e), sanctionné(e) ou victimisé(e).'},{icon:'⚖️',title:'Procédure équitable',text:'La présomption d\'innocence s\'applique à toute personne accusée de harcèlement.'}]}},
    {k:'sanctions',eyebrow:'10 – Conséquences',title:'Les cas confirmés entraînent de vraies conséquences.',body:['Toute personne reconnue coupable de harcèlement sexuel fera l\'objet de mesures disciplinaires appropriées.','La gravité dépend de la fréquence, des circonstances et du droit local applicable.','EOS ne traite pas ces cas comme anodins.'],activity:{type:'list',heading:'Mesures possibles',items:['Avertissement verbal ou écrit','Évaluation de performance négative','Mutation vers un autre poste ou département','Rétrogradation','Suspension','Licenciement (dans les cas graves, avec effet immédiat)']}},
    {k:'manager',managerOnly:true,eyebrow:'11 – Votre rôle (Responsable / RH)',title:'Quand quelqu\'un vient vous voir : que faire ?',body:['Vous êtes souvent la première personne à qui les employés concernés s\'adressent.','La façon dont vous réagissez à ce moment-là est déterminante.','Votre rôle n\'est pas d\'enquêter — mais d\'écouter, d\'informer et de soutenir.'],activity:{type:'steps',heading:'Quand une préoccupation est soulevée',steps:['Prenez-la au sérieux. Minimiser ou rejeter n\'est pas une option.','Écoutez sans juger et sans promettre de résultats spécifiques.','Informez la personne des procédures disponibles : informelle, formelle et externe.','Documentez soigneusement — surtout si Speak Up n\'est pas utilisé comme canal de signalement.','Convenez des prochaines étapes avec la personne concernée — respectez ses souhaits à tout moment.','Maintenez une stricte confidentialité. Appliquez le principe du besoin de savoir.']}},
    {k:'manager2',managerOnly:true,eyebrow:'12 – Procédure formelle (Responsable / RH)',title:'Ce que la procédure formelle exige de vous.',body:['Une fois une plainte formelle déposée, un(e) représentant(e) RH senior prend en charge le dossier.','Les enquêtes sont menées de manière impartiale, confidentielle et rapide.','Votre rôle : soutenir le processus, pas le diriger — sauf si vous êtes formellement désigné(e) comme enquêteur/enquêtrice.'],activity:{type:'scenario',tag:'Scénario Responsable / RH',text:'Une employée vous dit qu\'elle a subi à plusieurs reprises des avances non désirées de la part d\'un pair. Elle n\'est pas encore sûre de ce qu\'elle veut faire et demande si elle doit décider maintenant.',question:'Comment devriez-vous réagir ?',answer:'Dites-lui qu\'elle n\'a pas besoin de décider immédiatement. Expliquez les voies disponibles : résolution informelle, plainte formelle et options externes. Précisez que ses souhaits seront respectés à tout moment et que faire un signalement n\'aura aucune conséquence négative pour elle.'},quiz:{type:'choice',prompt:'Lorsqu\'une plainte formelle est déposée, qui prend la tête de l\'enquête ?',options:['Le/la responsable qui a reçu le signalement en premier.','Un(e) représentant(e) RH senior.','Le/la supérieur(e) direct(e) de la personne mise en cause.'],answer:1,ok:'Correct. Une fois une plainte formelle déposée, un(e) représentant(e) RH senior prend en charge — pas le/la responsable qui a reçu le signalement.',bad:'Pas tout à fait. La procédure formelle est dirigée par un(e) représentant(e) RH senior pour garantir impartialité et confidentialité.'}},
    {k:'close',eyebrow:'Conclusion',title:'Vous êtes maintenant préparé(e).',body:['Vous savez ce que signifie le harcèlement sexuel selon la politique EOS.','Vous connaissez les canaux de signalement et ce qui se passe après un signalement.','Vous connaissez vos droits et — en tant que responsable ou RH — vos responsabilités.','Le respect est la responsabilité commune de tous.'],activity:{type:'commit',text:'Je comprends les principes essentiels de la politique d\'entreprise EOS sur le harcèlement sexuel et je sais où trouver un soutien et des options de signalement.'}}
  ]
};

CONTENT['nl'] = {
  ui:{quizHint:'Selecteer het juiste antwoord om verder te gaan.',back:'Terug',continue:'Verder',finish:'Afronden',restart:'Opnieuw starten',selectLang:'Taal kiezen',selectRole:'Wie ben jij?',employee:'Medewerker',manager:'Manager / Human Resources',empDesc:'Leer wat seksuele intimidatie betekent, waar de grenzen liggen en welke opties je hebt als je ermee te maken krijgt.',mgrDesc:'Alle medewerkersinhoud, plus een speciaal module over hoe je mensen ondersteunt die met een bezorgdheid naar je toekomen.',startBtn:'Training starten',complete:'Training voltooid',completeMsg:'Bedankt voor het voltooien van de EOS Respectvolle Werkplek Training.',tapHint:'Tik op een kaart om te onthullen',showGuidance:'Oplossing tonen'},
  modules:[
    {k:'purpose',eyebrow:'01 – Waarom dit belangrijk is',title:'Nultolerantie betekent nul uitzonderingen.',body:['EOS tolereert geen enkele vorm van seksuele intimidatie — op geen enkele plek, in geen enkele context, in geen enkel format.','Dit beleid is wereldwijd van toepassing op alle EOS Group-bedrijven en is bindend voor alle medewerkers en managers.','Deze training legt uit wat er onder valt, wat je kunt doen en hoe EOS omgaat met meldingen.'],activity:{type:'flip',prompt:'Drie kernfeiten',cards:[{icon:'🌍',title:'Wereldwijd bereik',text:'Alle EOS Group-bedrijven vallen hieronder, ongeacht omvang of structuur.'},{icon:'⚖️',title:'Bindend voor iedereen',text:'Managers, leidinggevenden en medewerkers — iedereen moet dit beleid naleven.'},{icon:'🎯',title:'Wat deze training doet',text:'Vergroot bewustzijn, verduidelijkt grenzen en laat je je opties zien.'}]}},
    {k:'definition',eyebrow:'02 – Wat is seksuele intimidatie?',title:'Het gaat niet om intentie. Het gaat om impact.',body:['Seksuele intimidatie is ongewenst gedrag van seksuele aard dat een persoon beledigt, vernedert of intimideert.','Het kan gaan om een enkel incident of een patroon van gedrag.','De kernvraag: was het gedrag ongewenst door de betrokken persoon?'],activity:{type:'choice',prompt:'Scenario: Een collega stuurt een seksueel expliciete grap via de bedrijfschat. De ontvanger reageert niet maar voelt zich ongemakkelijk. Is dit seksuele intimidatie onder het EOS-beleid?',options:['Nee — niemand heeft iets gezegd, dus het was niet ongewenst.','Ja — het gedrag was seksueel van aard en maakte de ontvanger ongemakkelijk.','Alleen als het meer dan één keer gebeurt.'],answer:1,ok:'Correct. Het beleid maakt duidelijk dat het erom gaat of het gedrag ongewenst was door de ontvanger — niet of iemand bezwaar heeft gemaakt of dat het herhaald werd.',bad:'Niet helemaal. Het beleid richt zich op of het gedrag ongewenst was door de ontvanger. Stilzwijgen betekent niet dat het gedrag welkom was.'}},
    {k:'examples',eyebrow:'03 – Wat valt hieronder?',title:'Drie vormen — alle verboden.',body:['Seksuele intimidatie kan fysiek, verbaal of non-verbaal zijn.','De onderstaande voorbeelden zijn niet uitputtend. Vraag jezelf bij twijfel af: is dit gedrag gewenst door de andere persoon?'],activity:{type:'tabs',tabs:[{label:'Fysiek',items:['Ongewenst fysiek contact: kloppen, knijpen, strelen, kussen, omhelzen, betasten of ongepast aanraken — inclusief schijnbaar toevallig contact.','Fysiek geweld, inclusief seksueel geweld.','Gebruik van professionele dreigingen of beloningen om seksuele gunsten te verkrijgen.']},{label:'Verbaal',items:['Seksueel denigrerend of depersonaliserend opmerkingen over personen of hun lichaam.','Kleinerende opmerkingen over iemands seksleven.','Ongepaste seksuele verhalen of grappen.','Ongewenste avances of herhaalde uitnodigingen voor dates of fysieke intimiteit.','Neerbuigende of betuttelende opmerkingen.','Sturen van seksueel expliciete berichten.']},{label:'Non-verbaal',items:['Tentoonstellen van seksueel expliciet of suggestief materiaal.','Seksueel suggestieve gebaren.','Staren.','Fluiten.']}]},quiz:{type:'choice',prompt:'Welk van de volgende voorbeelden is een vorm van non-verbale seksuele intimidatie?',options:['Seksueel expliciete berichten sturen','Staren of fluiten','Ongewenst fysiek aanraken'],answer:1,ok:'Correct. Staren en fluiten zijn non-verbale vormen van seksuele intimidatie — zonder woorden of fysiek contact.',bad:'Niet helemaal. Denk aan de drie categorieën: fysiek, verbaal en non-verbaal. Staren en fluiten vallen onder non-verbaal.'}},
    {k:'boundaries',eyebrow:'04 – Waar geldt dit?',title:'De werkplek is meer dan het kantoor.',body:['Het verbod geldt op EOS-locaties en buiten de reguliere werkplek.','Dit omvat bedrijfsgestuurde evenementen, zakenreizen, trainingssessies en conferenties.','Iedereen kan worden getroffen, ongeacht geslacht — inclusief tussen personen van hetzelfde geslacht.'],activity:{type:'scenario',tag:'Scenario',text:'Tijdens een EOS-gesponsord diner maakt een teamlid herhaaldelijk complimenten aan een collega over zijn/haar uiterlijk, wat hem/haar zichtbaar ongemakkelijk maakt. De collega zegt niets maar vermijdt de persoon voor de rest van de avond.',question:'Valt dit onder het EOS-beleid?',answer:'Ja. Het beleid omvat door EOS gesponsorde evenementen buiten de reguliere werkplek. Wat telt is het ongemak van de betrokkene — niet of hij/zij iets heeft gezegd.'}},
    {k:'affected',eyebrow:'05 – Als het jou overkomt',title:'Je hebt meerdere opties om contact op te nemen.',body:['Je bent niet verplicht de andere persoon direct te confronteren — zeker niet in ongelijke verhoudingen.','EOS erkent dat direct spreken niet altijd mogelijk of veilig is.','Welk pad je ook kiest, jouw bezorgdheid wordt vertrouwelijk en respectvol behandeld.','Concrete contactgegevens vind je verderop in deze training en op SharePoint.'],activity:{type:'steps',heading:'Jouw opties stap voor stap',steps:['Als het veilig en gepast is: laat de persoon weten dat zijn/haar gedrag ongewenst is. Afhankelijk van de situatie geloven we dat veel dingen opgelost kunnen worden via directe communicatie.','Als direct contact onveilig of onmogelijk lijkt: neem contact op met een aangewezen contactpersoon.','Voor een goed gedocumenteerd en formeel proces: meld via Speak Up — vertrouwelijk en anoniem als je dat wilt.','Als geen van de bovenstaande opties voor jou voelt: je kunt ook naar je manager stappen als vertrouwenspersoon.','Je kunt ook op elk moment contact opnemen met de externe Otto Group ombudsman.','Externe juridische opties blijven beschikbaar en worden niet beïnvloed door het gebruik van interne kanalen.']}},
    {k:'reporting',eyebrow:'06 – Meldingskanalen',title:'Speak Up is de voorkeursmethode voor het indienen van een klacht.',body:['Speak Up is het voorkeurs interne kanaal: veilig, gedocumenteerd en vertrouwelijk.','Anoniem melden is mogelijk indien gewenst.','Andere interne contacten zijn ook beschikbaar. Gebruik wat voor jou het beste aanvoelt.'],activity:{type:'highlight',items:[{head:'Speak Up',body:'De voorkeursroute. Dien een melding in op elk moment, vertrouwelijk en anoniem indien nodig. Group Compliance wordt automatisch geïnformeerd.'},{head:'Interne contactpersonen',body:'Lokale managers (FK), Group HR en Diversity Management zijn aangewezen contactpunten. Zij zijn getraind om klachten met respect en vertrouwelijkheid te behandelen.'},{head:'Otto Group Ombudsman',body:'Een onafhankelijke externe advocaat, gebonden aan strikte vertrouwelijkheid. Meldingen kunnen anoniem worden ingediend. Dit kanaal is speciaal bedoeld voor gevallen waarin Speak Up of interne contactroutes voor jou niet mogelijk voelen.'}]}},
    {k:'mechanisms',eyebrow:'07 – De drie paden',title:'Informeel. Formeel. Extern.',body:['Samen met jouw contactpersoon beslis je welk pad het best bij jouw situatie past.','Er is geen verkeerde keuze. Jouw wensen worden altijd gerespecteerd.'],activity:{type:'compare',cols:[{head:'Informeel',body:'Een manager spreekt met de beschuldigde persoon. Een begeleid gesprek kan plaatsvinden — alleen met jouw toestemming en alleen als jij je veilig voelt.'},{head:'Formeel',body:'Een senior HR-persoon start een volledig onderzoek. Alle partijen worden apart gehoord. Een schriftelijk rapport met bevindingen en aanbevelingen wordt opgesteld.'},{head:'Extern',body:'Je kunt op elk moment externe instanties of de Otto Group ombudsman contacteren. Dit recht wordt niet beïnvloed door eerder gebruik van interne kanalen.'}]},quiz:{type:'choice',prompt:'Wat gebeurt er als je eerst het informele pad kiest — kun je daarna nog een formele klacht indienen?',options:['Nee — het informele pad kiezen sluit de formele optie.','Ja — het informele pad heeft geen invloed op jouw recht om een formele klacht in te dienen.','Alleen als de informele procedure mislukt is.'],answer:1,ok:'Correct. Er is geen verkeerde keuze — het informele pad eerst kiezen neemt nooit jouw recht weg om later een formele klacht in te dienen.',bad:'Niet helemaal. Het beleid is duidelijk: jouw recht om een formele klacht in te dienen blijft altijd behouden, ongeacht welk pad je eerst hebt gekozen.'}},
    {k:'handling',eyebrow:'08 – Na een melding',title:'Wat er daarna gebeurt.',body:['Elke melding wordt serieus genomen. Vanaf het moment dat je contact opneemt, is het proces gedocumenteerd en gestructureerd.'],activity:{type:'choice',prompt:'Waar of niet waar: Als je de informele klachtenprocedure gebruikt, kun je daarna geen formele klacht meer indienen.',options:['Waar — het informele pad eerst kiezen sluit de formele route.','Niet waar — de informele procedure verhindert niet dat je later een formele klacht indient.','Alleen waar als de informele procedure succesvol was afgerond.'],answer:1,ok:'Correct. Het beleid stelt expliciet dat een poging tot informele oplossing de betrokkene er niet van weerhoudt later een formele klacht in te dienen.',bad:'Niet helemaal. Het beleid beschermt jouw recht om over te gaan op een formele klacht, ook na een informele poging.'}},
    {k:'protection',eyebrow:'09 – Jouw bescherming',title:'Een melding doen brengt je niet in gevaar.',body:['EOS zet zich in om alle personen te beschermen die te goeder trouw een klacht indienen.','Jouw anonimiteit wordt zo veel mogelijk gewaarborgd, tenzij wettelijke vereisten anders eisen.','De persoon over wie je rapporteert wordt als onschuldig beschouwd totdat een onderzoek anders concludeert.'],activity:{type:'flip',prompt:'Drie garanties',cards:[{icon:'🔒',title:'Vertrouwelijkheid',text:'Alle klachten worden gedurende het hele proces met respect en vertrouwelijkheid behandeld.'},{icon:'🛡️',title:'Geen nadeel',text:'Niemand die te goeder trouw meldt, wordt benadeeld, bestraft of slachtoffer gemaakt.'},{icon:'⚖️',title:'Eerlijk proces',text:'Het vermoeden van onschuld geldt voor elke persoon die wordt beschuldigd van intimidatie.'}]}},
    {k:'sanctions',eyebrow:'10 – Gevolgen',title:'Bevestigde gevallen hebben echte gevolgen.',body:['Iedere persoon die seksuele intimidatie heeft gepleegd, krijgt passende disciplinaire maatregelen opgelegd.','De ernst hangt af van frequentie, omstandigheden en toepasselijk lokaal recht.','EOS beschouwt deze gevallen niet als kleinigheden.'],activity:{type:'list',heading:'Mogelijke maatregelen',items:['Mondelinge of schriftelijke waarschuwing','Negatieve prestatiebeoordeling','Overplaatsing naar een andere rol of afdeling','Degradatie','Schorsing','Ontslag (in ernstige gevallen zonder opzegtermijn)']}},
    {k:'manager',managerOnly:true,eyebrow:'11 – Jouw rol (Manager / HR)',title:'Als iemand naar jou toekomt: wat doe je?',body:['Je bent vaak de eerste persoon tot wie getroffen medewerkers zich wenden.','Hoe je op dat moment reageert is bepalend.','Jouw rol is niet om te onderzoeken — maar om te luisteren, te informeren en te ondersteunen.'],activity:{type:'steps',heading:'Wanneer een bezorgdheid wordt geuit',steps:['Neem het serieus. Bagatelliseren of afwijzen is geen optie.','Luister zonder te oordelen en zonder specifieke uitkomsten te beloven.','Informeer de persoon over beschikbare procedures: informeel, formeel en extern.','Documenteer zorgvuldig — zeker als Speak Up niet wordt gebruikt als meldingskanaal.','Spreek vervolgstappen af met de betrokkene — respecteer altijd zijn/haar wensen.','Bewaar strikte vertrouwelijkheid. Pas het need-to-know principe toe.']}},
    {k:'manager2',managerOnly:true,eyebrow:'12 – Formele procedure (Manager / HR)',title:'Wat de formele procedure van jou vereist.',body:['Zodra een formele klacht is ingediend, neemt een senior HR-persoon de verantwoordelijkheid.','Onderzoeken worden onpartijdig, vertrouwelijk en snel uitgevoerd.','Jouw rol: het proces ondersteunen, niet leiden — tenzij je formeel als onderzoeker bent aangesteld.'],activity:{type:'scenario',tag:'Manager / HR Scenario',text:'Een medewerker vertelt je dat ze herhaaldelijk ongewenste avances heeft ervaren van een collega. Ze weet nog niet zeker wat ze wil doen en vraagt of ze nu moet beslissen.',question:'Hoe reageer je?',answer:'Vertel haar dat ze niet onmiddellijk hoeft te beslissen. Leg de beschikbare paden uit: informele oplossing, formele klacht en externe opties. Maak duidelijk dat haar wensen altijd worden gerespecteerd en dat een melding geen negatieve gevolgen voor haar heeft.'},quiz:{type:'choice',prompt:'Wie leidt het onderzoek wanneer een formele klacht wordt ingediend?',options:['De manager die de melding als eerste ontving.','Een senior HR-vertegenwoordiger.','De directe leidinggevende van de beschuldigde persoon.'],answer:1,ok:'Correct. Zodra een formele klacht is ingediend, neemt een senior HR-vertegenwoordiger de leiding — niet de ontvangende manager.',bad:'Niet helemaal. De formele procedure wordt geleid door een senior HR-vertegenwoordiger om onpartijdigheid en vertrouwelijkheid te garanderen.'}},
    {k:'close',eyebrow:'Afsluiting',title:'Je bent nu voorbereid.',body:['Je weet wat seksuele intimidatie betekent volgens het EOS-beleid.','Je kent de meldingskanalen en wat er na een melding gebeurt.','Je kent jouw rechten en — als manager of HR — jouw verantwoordelijkheden.','Respectvol gedrag is de gemeenschappelijke verantwoordelijkheid van iedereen.'],activity:{type:'commit',text:'Ik begrijp de essentiële principes van het EOS-bedrijfsbeleid inzake seksuele intimidatie en weet waar ik ondersteuning en meldingsopties kan vinden.'}}
  ]
};

CONTENT['es'] = {
  ui:{quizHint:'Por favor, selecciona la respuesta correcta para continuar.',back:'Atrás',continue:'Continuar',finish:'Finalizar',restart:'Reiniciar',selectLang:'Elegir idioma',selectRole:'¿Quién eres?',employee:'Empleado/a',manager:'Responsable / Recursos Humanos',empDesc:'Aprende qué significa el acoso sexual, dónde están los límites y qué opciones tienes si te ves afectado/a.',mgrDesc:'Todo el contenido para empleados, más un módulo dedicado sobre cómo apoyar a las personas que acuden a ti con una preocupación.',startBtn:'Iniciar formación',complete:'Formación completada',completeMsg:'Gracias por completar la Formación sobre Lugar de Trabajo Respetuoso de EOS.',tapHint:'Toca una tarjeta para revelar',showGuidance:'Mostrar solución'},
  modules:[
    {k:'purpose',eyebrow:'01 – Por qué esto importa',title:'Tolerancia cero significa cero excepciones.',body:['EOS no tolera ninguna forma de acoso sexual — en ningún lugar, contexto o formato.','Esta política se aplica globalmente a todas las empresas del Grupo EOS y es vinculante para todos los empleados y directivos.','Esta formación explica qué cubre, qué puedes hacer y cómo gestiona EOS las denuncias.'],activity:{type:'flip',prompt:'Tres puntos clave',cards:[{icon:'🌍',title:'Alcance global',text:'Todas las empresas del Grupo EOS están incluidas, independientemente de su tamaño o estructura.'},{icon:'⚖️',title:'Vinculante para todos',text:'Directivos, managers y empleados — todos deben seguir esta política.'},{icon:'🎯',title:'Qué hace esta formación',text:'Aumenta la conciencia, aclara los límites y te muestra tus opciones.'}]}},
    {k:'definition',eyebrow:'02 – ¿Qué es el acoso sexual?',title:'No se trata de la intención. Se trata del impacto.',body:['El acoso sexual es un comportamiento no deseado de naturaleza sexual que ofende, humilla o intimida a una persona.','Puede ser un incidente aislado o un patrón de comportamiento.','La pregunta clave: ¿fue el comportamiento no deseado por la persona afectada?'],activity:{type:'choice',prompt:'Escenario: Un compañero envía un chiste sexualmente explícito por el chat de la empresa. El receptor no responde pero se siente incómodo. ¿Es esto acoso sexual según la política de EOS?',options:['No — nadie dijo nada, por lo que no era no deseado.','Sí — el comportamiento era de naturaleza sexual e hizo sentir incómodo al receptor.','Solo si ocurre más de una vez.'],answer:1,ok:'Correcto. La política deja claro que lo que importa es si el comportamiento fue no deseado por el receptor — no si alguien protestó o si se repitió.',bad:'No del todo. La política se centra en si el comportamiento fue no deseado por el receptor. El silencio no significa que el comportamiento fuera bienvenido.'}},
    {k:'examples',eyebrow:'03 – ¿Qué incluye?',title:'Tres formas — todas prohibidas.',body:['El acoso sexual puede ser físico, verbal o no verbal.','Los ejemplos a continuación no son exhaustivos. En caso de duda, pregúntate: ¿es este comportamiento deseado por la otra persona?'],activity:{type:'tabs',tabs:[{label:'Físico',items:['Contacto físico no deseado: palmadas, pellizcos, caricias, besos, abrazos, manoseos o tocamientos inapropiados — incluido el contacto aparentemente accidental.','Violencia física, incluida la agresión sexual.','Uso de amenazas o recompensas profesionales para obtener favores sexuales.']},{label:'Verbal',items:['Comentarios sexualmente degradantes o despersonalizadores sobre personas o sus cuerpos.','Comentarios degradantes sobre la vida sexual de una persona.','Historias o chistes sexuales inapropiados.','Insinuaciones no deseadas o invitaciones repetidas a citas o intimidad física.','Comentarios condescendientes o paternalistas.','Envío de mensajes sexualmente explícitos.']},{label:'No verbal',items:['Exhibición de material sexualmente explícito o sugerente.','Gestos sexualmente sugerentes.','Miradas fijas.','Silbidos.']}]},quiz:{type:'choice',prompt:'¿Cuál de los siguientes ejemplos es una forma de acoso sexual no verbal?',options:['Enviar mensajes sexualmente explícitos','Mirar fijamente o silbar','Tocamiento físico no deseado'],answer:1,ok:'Correcto. Mirar fijamente y silbar son formas no verbales de acoso sexual — sin palabras ni contacto físico.',bad:'No del todo. Piensa en las tres categorías: físico, verbal y no verbal. Mirar fijamente y silbar corresponden a lo no verbal.'}},
    {k:'boundaries',eyebrow:'04 – ¿Dónde aplica?',title:'El lugar de trabajo es más que la oficina.',body:['La prohibición aplica en las instalaciones de EOS y fuera del lugar de trabajo habitual.','Esto incluye eventos patrocinados por la empresa, viajes de negocios, sesiones de formación y conferencias.','Cualquier persona puede verse afectada, independientemente del género — incluso entre personas del mismo género.'],activity:{type:'scenario',tag:'Escenario',text:'En una cena patrocinada por EOS, un miembro del equipo hace repetidamente cumplidos a un/a compañero/a sobre su apariencia, lo que le hace sentir visiblemente incómodo/a. El/la compañero/a no dice nada pero evita a la persona el resto de la velada.',question:'¿Entra esto dentro de la política de EOS?',answer:'Sí. La política cubre los eventos patrocinados por EOS fuera del lugar de trabajo habitual. Lo que importa es la incomodidad de la persona afectada — no si dijo algo.'}},
    {k:'affected',eyebrow:'05 – Si te ocurre a ti',title:'Tienes varias opciones para ponerte en contacto.',body:['No estás obligado/a a confrontar directamente a la otra persona — especialmente en relaciones desiguales.','EOS reconoce que hablar directamente no siempre es posible o seguro.','Cualquiera que sea el camino que elijas, tu preocupación será tratada con confidencialidad y respeto.','Los datos de contacto concretos se encuentran más adelante en esta formación y en SharePoint.'],activity:{type:'steps',heading:'Tus opciones paso a paso',steps:['Si es seguro y apropiado: hazle saber a la persona que su comportamiento no es deseado. Según la situación, creemos que muchas cosas pueden resolverse mediante comunicación directa.','Si el contacto directo parece inseguro o imposible: contacta a una persona de contacto designada.','Para un proceso bien documentado y formal: denuncia a través de Speak Up — de forma confidencial y anónima si lo deseas.','Si ninguna de las opciones anteriores te parece adecuada: también puedes acudir a tu responsable como persona de confianza.','También puedes contactar en cualquier momento al ombudsman externo del Grupo Otto.','Las opciones legales externas siguen disponibles y no se ven afectadas por el uso de canales internos.']}},
    {k:'reporting',eyebrow:'06 – Canales de denuncia',title:'Speak Up es la forma preferida de presentar una queja.',body:['Speak Up es el canal interno preferido: seguro, documentado y confidencial.','La denuncia anónima es posible si se desea.','También hay otros contactos internos disponibles. Usa el que mejor te parezca.'],activity:{type:'highlight',items:[{head:'Speak Up',body:'La ruta preferida. Envía un informe de forma segura, en cualquier momento, de forma confidencial y anónima si es necesario. Group Compliance es notificado automáticamente.'},{head:'Personas de contacto internas',body:'Los responsables locales (FK), RRHH del Grupo y Gestión de Diversidad son puntos de contacto designados. Están formados para gestionar las quejas con respeto y confidencialidad.'},{head:'Ombudsman del Grupo Otto',body:'Un abogado externo independiente, sujeto a estricta confidencialidad. Las denuncias pueden presentarse de forma anónima. Este canal está especialmente pensado para casos en los que Speak Up o las vías de contacto internas no te parecen posibles.'}]}},
    {k:'mechanisms',eyebrow:'07 – Los tres caminos',title:'Informal. Formal. Externo.',body:['Junto con tu persona de contacto decides qué camino se adapta mejor a tu situación.','No hay elección incorrecta. Tus deseos serán respetados en todo momento.'],activity:{type:'compare',cols:[{head:'Informal',body:'Un/a responsable habla con la persona denunciada. Puede tener lugar una conversación facilitada — solo con tu consentimiento y solo si te sientes seguro/a.'},{head:'Formal',body:'Un/a responsable de RRHH senior inicia una investigación completa. Todas las partes son entrevistadas por separado. Se elabora un informe escrito con conclusiones y recomendaciones.'},{head:'Externo',body:'Puedes contactar en cualquier momento a organismos externos o al ombudsman del Grupo Otto. Este derecho no se ve afectado por el uso previo de canales internos.'}]},quiz:{type:'choice',prompt:'¿Qué ocurre si primero eliges el camino informal — puedes presentar una queja formal después?',options:['No — elegir primero el camino informal cierra la opción formal.','Sí — el camino informal no afecta tu derecho a presentar una queja formal.','Solo si el proceso informal fracasó.'],answer:1,ok:'Correcto. No hay elección incorrecta — elegir primero el camino informal nunca elimina tu derecho a escalar a una queja formal.',bad:'No del todo. La política es clara: tu derecho a presentar una queja formal siempre se preserva, independientemente del camino que hayas elegido primero.'}},
    {k:'handling',eyebrow:'08 – Después de una denuncia',title:'Qué sucede a continuación.',body:['Cada denuncia se toma en serio. Desde el momento en que haces contacto, el proceso está documentado y estructurado.'],activity:{type:'choice',prompt:'Verdadero o falso: Si utilizas el procedimiento de queja informal, ya no puedes presentar una queja formal después.',options:['Verdadero — usar primero la vía informal cierra la vía formal.','Falso — el procedimiento informal no impide presentar una queja formal posteriormente.','Solo verdadero si el procedimiento informal se completó con éxito.'],answer:1,ok:'Correcto. La política establece explícitamente que intentar una resolución informal no impide que la persona afectada presente una queja formal posteriormente.',bad:'No del todo. La política protege tu derecho a pasar a una queja formal incluso después de intentar resolver el asunto de forma informal.'}},
    {k:'protection',eyebrow:'09 – Tu protección',title:'Hacer una denuncia no te pone en riesgo.',body:['EOS se compromete a proteger a todas las personas que presenten una queja de buena fe.','Tu anonimato se mantendrá en la medida de lo posible, a menos que los requisitos legales exijan lo contrario.','La persona sobre la que informas se presume inocente hasta que una investigación concluya lo contrario.'],activity:{type:'flip',prompt:'Tres garantías',cards:[{icon:'🔒',title:'Confidencialidad',text:'Todas las quejas se gestionan con respeto y confidencialidad durante todo el proceso.'},{icon:'🛡️',title:'Sin perjuicio',text:'Nadie que denuncie de buena fe será perjudicado, sancionado o victimizado.'},{icon:'⚖️',title:'Proceso justo',text:'La presunción de inocencia se aplica a toda persona acusada de acoso.'}]}},
    {k:'sanctions',eyebrow:'10 – Consecuencias',title:'Los casos confirmados tienen consecuencias reales.',body:['Cualquier persona que haya cometido acoso sexual se enfrentará a medidas disciplinarias apropiadas.','La gravedad depende de la frecuencia, las circunstancias y la legislación local aplicable.','EOS no trata estos casos como asuntos menores.'],activity:{type:'list',heading:'Posibles medidas',items:['Advertencia verbal o escrita','Evaluación de rendimiento negativa','Traslado a un rol o departamento diferente','Degradación','Suspensión','Despido (en casos graves sin preaviso)']}},
    {k:'manager',managerOnly:true,eyebrow:'11 – Tu rol (Responsable / RRHH)',title:'Cuando alguien acude a ti: ¿qué hacer?',body:['A menudo eres la primera persona a la que acuden los empleados afectados.','Cómo respondas en ese momento es decisivo.','Tu papel no es investigar — sino escuchar, informar y apoyar.'],activity:{type:'steps',heading:'Cuando se plantea una preocupación',steps:['Tómala en serio. Minimizar o desestimar no es una opción.','Escucha sin juzgar y sin prometer resultados específicos.','Informa a la persona sobre los procedimientos disponibles: informal, formal y externo.','Documenta cuidadosamente — especialmente si no se usa Speak Up como canal de denuncia.','Acuerda los próximos pasos con la persona afectada — respeta sus deseos en todo momento.','Mantén estricta confidencialidad. Aplica el principio de necesidad de saber.']}},
    {k:'manager2',managerOnly:true,eyebrow:'12 – Procedimiento formal (Responsable / RRHH)',title:'Lo que el procedimiento formal requiere de ti.',body:['Una vez presentada una queja formal, un/a responsable de RRHH senior asume la responsabilidad.','Las investigaciones se llevan a cabo de forma imparcial, confidencial y rápida.','Tu papel: apoyar el proceso, no liderarlo — a menos que seas formalmente designado/a como investigador/a.'],activity:{type:'scenario',tag:'Escenario Responsable / RRHH',text:'Una empleada te dice que ha experimentado repetidamente insinuaciones no deseadas por parte de un compañero. Aún no está segura de lo que quiere hacer y pregunta si tiene que decidir ahora.',question:'¿Cómo deberías responder?',answer:'Dile que no tiene que decidir de inmediato. Explica los caminos disponibles: resolución informal, queja formal y opciones externas. Deja claro que sus deseos serán respetados en todo momento y que hacer una denuncia no tendrá consecuencias negativas para ella.'},quiz:{type:'choice',prompt:'Cuando se presenta una queja formal, ¿quién lidera la investigación?',options:['El/la responsable que recibió la denuncia primero.','Un/a responsable de RRHH senior.','El/la superior/a directo/a de la persona denunciada.'],answer:1,ok:'Correcto. Una vez presentada una queja formal, un/a responsable de RRHH senior asume el liderazgo — no el/la responsable que recibió la denuncia.',bad:'No del todo. El proceso formal es liderado por un/a responsable de RRHH senior para garantizar imparcialidad y confidencialidad.'}},
    {k:'close',eyebrow:'Cierre',title:'Ahora estás preparado/a.',body:['Sabes qué significa el acoso sexual según la política de EOS.','Conoces los canales de denuncia y lo que ocurre después de una denuncia.','Conoces tus derechos y — como responsable o RRHH — tus responsabilidades.','El comportamiento respetuoso es responsabilidad común de todos.'],activity:{type:'commit',text:'Entiendo los principios esenciales de la política corporativa de EOS sobre acoso sexual y sé dónde encontrar apoyo y opciones de denuncia.'}}
  ]
};

  modules:[
    {k:'purpose',eyebrow:'01 – Por que isto importa',title:'Tolerância zero significa zero exceções.',body:['A EOS não tolera qualquer forma de assédio sexual — em nenhum lugar, contexto ou formato.','Esta política aplica-se globalmente a todas as empresas do Grupo EOS e é vinculativa para todos os colaboradores e gestores.','Esta formação explica o que está abrangido, o que pode fazer e como a EOS gere as denúncias.'],activity:{type:'flip',prompt:'Três factos essenciais',cards:[{icon:'🌍',title:'Alcance global',text:'Todas as empresas do Grupo EOS estão abrangidas, independentemente da dimensão ou estrutura.'},{icon:'⚖️',title:'Vinculativo para todos',text:'Gestores, líderes e colaboradores — todos devem seguir esta política.'},{icon:'🎯',title:'O que esta formação faz',text:'Aumenta a consciencialização, clarifica os limites e mostra-lhe as suas opções.'}]}},
    {k:'definition',eyebrow:'02 – O que é o assédio sexual?',title:'Não se trata de intenção. Trata-se de impacto.',body:['O assédio sexual é um comportamento indesejado de natureza sexual que ofende, humilha ou intimida uma pessoa.','Pode ser um único incidente ou um padrão de comportamento.','A questão-chave: o comportamento foi indesejado pela pessoa afetada?'],activity:{type:'choice',prompt:'Cenário: Um colega envia uma piada sexualmente explícita através do chat da empresa. O destinatário não responde mas sente-se desconfortável. Isto constitui assédio sexual segundo a política da EOS?',options:['Não — ninguém disse nada, por isso não era indesejado.','Sim — o comportamento era de natureza sexual e deixou o destinatário desconfortável.','Apenas se acontecer mais do que uma vez.'],answer:1,ok:'Correto. A política deixa claro que o que importa é se o comportamento foi indesejado pelo destinatário — não se alguém protestou ou se foi repetido.',bad:'Não exatamente. A política centra-se em saber se o comportamento foi indesejado pelo destinatário. O silêncio não significa que o comportamento foi bem-vindo.'}},
    {k:'examples',eyebrow:'03 – O que está incluído?',title:'Três formas — todas proibidas.',body:['O assédio sexual pode ser físico, verbal ou não verbal.','Os exemplos abaixo não são exaustivos. Em caso de dúvida, pergunte-se: este comportamento é desejado pela outra pessoa?'],activity:{type:'tabs',tabs:[{label:'Físico',items:['Contacto físico indesejado: tocar, beliscar, acariciar, beijar, abraçar, apalpar ou tocar de forma inapropriada — incluindo contacto aparentemente acidental.','Violência física, incluindo agressão sexual.','Uso de ameaças ou recompensas profissionais para obter favores sexuais.']},{label:'Verbal',items:['Comentários sexualmente degradantes ou despersonalizantes sobre pessoas ou os seus corpos.','Comentários depreciativos sobre a vida sexual de uma pessoa.','Histórias ou piadas sexuais inapropriadas.','Avanços indesejados ou convites repetidos para encontros ou intimidade física.','Comentários condescendentes ou paternalistas.','Envio de mensagens sexualmente explícitas.']},{label:'Não verbal',items:['Exibição de material sexualmente explícito ou sugestivo.','Gestos sexualmente sugestivos.','Olhar fixo.','Assobios.']}]},quiz:{type:'choice',prompt:'Qual dos seguintes exemplos é uma forma de assédio sexual não verbal?',options:['Enviar mensagens sexualmente explícitas','Olhar fixo ou assobiar','Toque físico indesejado'],answer:1,ok:'Correto. Olhar fixo e assobiar são formas não verbais de assédio sexual — sem palavras ou contacto físico.',bad:'Não exatamente. Pense nas três categorias: físico, verbal e não verbal. Olhar fixo e assobiar enquadram-se no não verbal.'}},
    {k:'boundaries',eyebrow:'04 – Onde se aplica?',title:'O local de trabalho é mais do que o escritório.',body:['A proibição aplica-se nas instalações da EOS e fora do local de trabalho habitual.','Isto inclui eventos patrocinados pela empresa, viagens de negócios, sessões de formação e conferências.','Qualquer pessoa pode ser afetada, independentemente do género — inclusive entre pessoas do mesmo género.'],activity:{type:'scenario',tag:'Cenário',text:'Num jantar patrocinado pela EOS, um membro da equipa faz repetidamente elogios à aparência de um/a colega, deixando-o/a visivelmente desconfortável. O/a colega não diz nada mas evita a pessoa pelo resto da noite.',question:'Isto enquadra-se na política da EOS?',answer:'Sim. A política abrange eventos patrocinados pela EOS fora do local de trabalho habitual. O que importa é o desconforto da pessoa afetada — não se disse alguma coisa.'}},
    {k:'affected',eyebrow:'05 – Se acontecer consigo',title:'Tem várias opções para entrar em contacto.',body:['Não é obrigado/a a confrontar diretamente a outra pessoa — especialmente em relações desiguais.','A EOS reconhece que falar diretamente nem sempre é possível ou seguro.','Qualquer que seja o caminho que escolher, a sua preocupação será tratada com confidencialidade e respeito.','Os dados de contacto concretos encontram-se mais adiante nesta formação e no SharePoint.'],activity:{type:'steps',heading:'As suas opções passo a passo',steps:['Se for seguro e apropriado: informe a pessoa de que o seu comportamento é indesejado. Dependendo da situação, acreditamos que muitas coisas podem ser resolvidas através de comunicação direta.','Se o contacto direto parecer inseguro ou impossível: contacte uma pessoa de contacto designada.','Para um processo bem documentado e formal: denuncie através do Speak Up — confidencialmente e anonimamente, se desejar.','Se nenhuma das opções acima lhe parecer adequada: pode também recorrer ao seu/sua gestor/a como pessoa de confiança.','Pode também contactar o ombudsman externo do Grupo Otto a qualquer momento.','As opções legais externas continuam disponíveis e não são afetadas pela utilização de canais internos.']}},
    {k:'reporting',eyebrow:'06 – Canais de denúncia',title:'O Speak Up é a forma preferida de apresentar uma queixa.',body:['O Speak Up é o canal interno preferido: seguro, documentado e confidencial.','A denúncia anónima é possível, se desejado.','Outros contactos internos também estão disponíveis. Use o que lhe parecer mais adequado.'],activity:{type:'highlight',items:[{head:'Speak Up',body:'A rota preferida. Envie uma denúncia de forma segura, a qualquer momento, confidencialmente e anonimamente se necessário. O Group Compliance é notificado automaticamente.'},{head:'Pessoas de contacto internas',body:'Gestores locais (FK), RH do Grupo e Gestão da Diversidade são pontos de contacto designados. Estão treinados para tratar queixas com respeito e confidencialidade.'},{head:'Ombudsman do Grupo Otto',body:'Um advogado externo independente, vinculado pela estrita confidencialidade. As denúncias podem ser apresentadas anonimamente. Este canal destina-se especialmente a casos em que o Speak Up ou as vias de contacto internas não lhe parecem possíveis.'}]}},
    {k:'mechanisms',eyebrow:'07 – Os três caminhos',title:'Informal. Formal. Externo.',body:['Juntamente com a sua pessoa de contacto, decide qual o caminho mais adequado à sua situação.','Não há escolha errada. Os seus desejos serão sempre respeitados.'],activity:{type:'compare',cols:[{head:'Informal',body:'Um/a gestor/a fala com a pessoa visada. Pode ter lugar uma conversa facilitada — apenas com o seu consentimento e apenas se se sentir seguro/a.'},{head:'Formal',body:'Um/a responsável de RH sénior inicia uma investigação completa. Todas as partes são entrevistadas separadamente. É elaborado um relatório escrito com conclusões e recomendações.'},{head:'Externo',body:'Pode contactar organismos externos ou o ombudsman do Grupo Otto a qualquer momento. Este direito não é afetado pela utilização prévia de canais internos.'}]},quiz:{type:'choice',prompt:'O que acontece se primeiro escolher o caminho informal — pode ainda apresentar uma queixa formal depois?',options:['Não — escolher primeiro o caminho informal fecha a opção formal.','Sim — o caminho informal não afeta o seu direito de apresentar uma queixa formal.','Apenas se o processo informal tiver falhado.'],answer:1,ok:'Correto. Não há escolha errada — escolher primeiro o caminho informal nunca elimina o seu direito de escalar para uma queixa formal.',bad:'Não exatamente. A política é clara: o seu direito de apresentar uma queixa formal é sempre preservado, independentemente do caminho escolhido primeiro.'}},
    {k:'handling',eyebrow:'08 – Após uma denúncia',title:'O que acontece a seguir.',body:['Cada denúncia é levada a sério. Desde o momento em que faz contacto, o processo está documentado e estruturado.'],activity:{type:'choice',prompt:'Verdadeiro ou falso: Se utilizar o procedimento de queixa informal, já não pode apresentar uma queixa formal depois.',options:['Verdadeiro — usar primeiro a via informal fecha a via formal.','Falso — o procedimento informal não impede a apresentação de uma queixa formal posteriormente.','Apenas verdadeiro se o procedimento informal tiver sido concluído com sucesso.'],answer:1,ok:'Correto. A política estabelece explicitamente que tentar uma resolução informal não impede a pessoa afetada de apresentar uma queixa formal posteriormente.',bad:'Não exatamente. A política protege o seu direito de avançar para uma queixa formal mesmo após ter tentado resolver o assunto informalmente.'}},
    {k:'protection',eyebrow:'09 – A sua proteção',title:'Fazer uma denúncia não o/a coloca em risco.',body:['A EOS compromete-se a proteger todas as pessoas que apresentem uma queixa de boa fé.','O seu anonimato será mantido tanto quanto possível, a menos que os requisitos legais exijam o contrário.','A pessoa sobre quem denuncia é presumida inocente até que uma investigação conclua o contrário.'],activity:{type:'flip',prompt:'Três garantias',cards:[{icon:'🔒',title:'Confidencialidade',text:'Todas as queixas são tratadas com respeito e confidencialidade ao longo de todo o processo.'},{icon:'🛡️',title:'Sem prejuízo',text:'Ninguém que denuncie de boa fé será prejudicado, punido ou vitimizado.'},{icon:'⚖️',title:'Processo justo',text:'A presunção de inocência aplica-se a qualquer pessoa acusada de assédio.'}]}},
    {k:'sanctions',eyebrow:'10 – Consequências',title:'Os casos confirmados têm consequências reais.',body:['Qualquer pessoa condenada por assédio sexual enfrentará medidas disciplinares adequadas.','A gravidade depende da frequência, das circunstâncias e da legislação local aplicável.','A EOS não trata estes casos como assuntos menores.'],activity:{type:'list',heading:'Medidas possíveis',items:['Advertência verbal ou escrita','Avaliação de desempenho negativa','Transferência para uma função ou departamento diferente','Rebaixamento','Suspensão','Despedimento (em casos graves sem aviso prévio)']}},
    {k:'manager',managerOnly:true,eyebrow:'11 – O seu papel (Gestor/a / RH)',title:'Quando alguém recorre a si: o que fazer?',body:['É frequentemente a primeira pessoa a quem os colaboradores afetados recorrem.','A forma como responde nesse momento é decisiva.','O seu papel não é investigar — mas ouvir, informar e apoiar.'],activity:{type:'steps',heading:'Quando uma preocupação é levantada',steps:['Leve-a a sério. Minimizar ou rejeitar não é uma opção.','Ouça sem julgar e sem prometer resultados específicos.','Informe a pessoa sobre os procedimentos disponíveis: informal, formal e externo.','Documente cuidadosamente — especialmente se o Speak Up não for utilizado como canal de denúncia.','Concorde os próximos passos com a pessoa afetada — respeite sempre os seus desejos.','Mantenha estrita confidencialidade. Aplique o princípio da necessidade de saber.']}},
    {k:'manager2',managerOnly:true,eyebrow:'12 – Procedimento formal (Gestor/a / RH)',title:'O que o procedimento formal exige de si.',body:['Assim que uma queixa formal é apresentada, um/a responsável de RH sénior assume a responsabilidade.','As investigações são conduzidas de forma imparcial, confidencial e célere.','O seu papel: apoiar o processo, não liderá-lo — a menos que seja formalmente nomeado/a como investigador/a.'],activity:{type:'scenario',tag:'Cenário Gestor/a / RH',text:'Uma colaboradora diz-lhe que tem experimentado repetidamente avanços indesejados por parte de um colega. Ainda não tem a certeza do que quer fazer e pergunta se tem de decidir agora.',question:'Como deve responder?',answer:'Diga-lhe que não tem de decidir imediatamente. Explique os caminhos disponíveis: resolução informal, queixa formal e opções externas. Deixe claro que os seus desejos serão sempre respeitados e que fazer uma denúncia não terá quaisquer consequências negativas para ela.'},quiz:{type:'choice',prompt:'Quando é apresentada uma queixa formal, quem lidera a investigação?',options:['O/a gestor/a que recebeu a denúncia primeiro.','Um/a responsável de RH sénior.','O/a superior/a direto/a da pessoa visada.'],answer:1,ok:'Correto. Assim que uma queixa formal é apresentada, um/a responsável de RH sénior assume a liderança — não o/a gestor/a que recebeu a denúncia.',bad:'Não exatamente. O processo formal é liderado por um/a responsável de RH sénior para garantir imparcialidade e confidencialidade.'}},
    {k:'close',eyebrow:'Conclusão',title:'Está agora preparado/a.',body:['Sabe o que significa assédio sexual segundo a política da EOS.','Conhece os canais de denúncia e o que acontece após uma denúncia.','Conhece os seus direitos e — como gestor/a ou RH — as suas responsabilidades.','O comportamento respeitoso é responsabilidade comum de todos.'],activity:{type:'commit',text:'Compreendo os princípios essenciais da política corporativa da EOS sobre assédio sexual e sei onde encontrar apoio e opções de denúncia.'}}
