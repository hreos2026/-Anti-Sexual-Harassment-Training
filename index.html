  modules:[
    {k:'purpose',eyebrow:'01 – Zakaj je to pomembno',title:'Ničelna toleranca pomeni nič izjem.',body:['EOS ne tolerira spolnega nadlegovanja — na nobeni lokaciji, v nobenem okolju ali formatu.','Ta politika velja globalno za vse družbe EOS Skupine in je zavezujoča za vse zaposlene in vodstvene delavce.','To usposabljanje pomaga razumeti, kaj je zajeto, kaj lahko storiš in kako EOS obravnava prijave.'],activity:{type:'flip',prompt:'Tri pomembne dejstva',cards:[{icon:'🌍',title:'Velja globalno',text:'Zajete so vse družbe EOS Skupine, ne glede na velikost ali strukturo.'},{icon:'⚖️',title:'Zavezujoče za vse',text:'Vodstveni delavci, menedžerji in zaposleni — vsi morajo spoštovati politiko.'},{icon:'🎯',title:'Namen tega usposabljanja',text:'Povečuje ozaveščenost, pojasnjuje meje in prikazuje razpoložljive možnosti.'}]}},
    {k:'definition',eyebrow:'02 – Kaj je spolno nadlegovanje?',title:'Ni pomembna namera. Pomemben je učinek.',body:['Spolno nadlegovanje je nezaželeno ravnanje spolne narave, ki osebo žali, ponižuje ali zastraši.','Lahko je enkraten incident ali vzorec ravnanja.','Ključno vprašanje: ali je bilo ravnanje za osebo, ki ji je bilo namenjeno, nezaželeno?'],activity:{type:'choice',prompt:'Scenarij: Sodelavec pošlje spolno ekspliciten vic prek poslovnega klepeta. Prejemnik ne odgovori, a se počuti nelagodno. Ali je to spolno nadlegovanje po politiki EOS?',options:['Ne — nihče ni nič rekel, torej ni bilo nezaželeno.','Da — ravnanje je bilo spolne narave in je pri prejemniku povzročilo nelagodje.','Samo če se zgodi več kot enkrat.'],answer:1,ok:'Pravilno. Politika jasno določa, da je pomembno, ali je bilo ravnanje za prejemnika nezaželeno — ne ali je kdo protestiral in ne ali se je ponavljalo.',bad:'Ni povsem točno. Politika se osredotoča na to, ali je bilo ravnanje za prejemnika nezaželeno. Molk ne pomeni, da je bilo ravnanje dobrodošlo.'}},
    {k:'examples',eyebrow:'03 – Kaj sodi sem?',title:'Tri oblike — vse prepovedane.',body:['Spolno nadlegovanje je lahko fizično, verbalno ali neverbalno.','Spodnji primeri niso izčrpni. V primeru dvoma se vprašaj: ali je to ravnanje zaželeno s strani druge osebe?'],activity:{type:'tabs',tabs:[{label:'Fizično',items:['Nezaželeni stik: tapkanje, ščipanje, božanje, poljubljanje, objemanje, tipanje ali neprimerno dotikanje — vključno z navidezno naključnim stikom.','Fizično nasilje, vključno s spolnim napadom.','Uporaba delovnih groženj ali nagrad za izsiljevanje spolnih uslug.']},{label:'Verbalno',items:['Spolno poniževalne ali depersonalizirajoče opombe o osebah ali njihovih telesih.','Poniževalni komentarji o spolnem življenju nekoga.','Neprimerne spolne zgodbe ali vicevi.','Nezaželena dvorjenja ali ponavljajoča vabila na zmenke ali telesno intimnost.','Pokroviteljske ali paternalistične opombe.','Pošiljanje spolno eksplicitnih sporočil.']},{label:'Neverbalno',items:['Razstavljanje spolno eksplicitnega ali sugestivnega gradiva.','Spolno sugestivne geste.','Pohoten pogled.','Žvižganje.']}]},quiz:{quiz:{type:'choice',prompt:'Kateri od naslednjih primerov je oblika neverbalnega spolnega nadlegovanja?',options:['Pošiljanje spolno eksplicitnih sporočil','Zijanje ali žvižganje','Nezaželeni telesni stik'],answer:1,ok:'Pravilno. Zijanje in žvižganje sta neverbalni obliki spolnega nadlegovanja — brez besed ali telesnega stika.',bad:'Ne povsem. Pomislite na tri kategorije: telesna, verbalna in neverbalna. Zijanje in žvižganje spadata pod neverbalno.'}}},
    {k:'boundaries',eyebrow:'04 – Kje velja?',title:'Delovno mesto je več kot pisarna.',body:['Prepoved velja v prostorih EOS in zunaj rednega delovnega mesta.','To vključuje družabne dogodke, ki jih sponzorira podjetje, poslovna potovanja, usposabljanja in konference.','Prizadeta je lahko vsaka oseba, ne glede na spol — vključno med osebami istega spola.'],activity:{type:'scenario',tag:'Scenarij',text:'Na večerji, ki jo sponzorira EOS, član ekipe večkrat pohvali sodelavko glede njenega videza na način, ki jo vidno spravi v nelagodje. Sodelavka ne reče nič, a se ves preostali večer izogiba tej osebi.',question:'Ali to spada pod politiko EOS?',answer:'Da. Politika zajema dogodke, ki jih sponzorira EOS, zunaj rednega delovnega mesta. Odločilno je nelagodje, ki ga čuti prejemnik — ne ali je kaj rekel/a.'}},
    {k:'affected',eyebrow:'05 – Če se ti to zgodi',title:'Imaš več možnosti, kot misliš.',body:['Nisi dolžan/a neposredno soočiti se z drugo osebo — zlasti v neenakopravnih razmerjih.','EOS priznava, da neposredna izpostavitev ni vedno mogoča ali varna.','Ne glede na pot, ki jo izbereš, bo tvoja skrb obravnavana zaupno in spoštljivo.'],activity:{type:'steps',heading:'Tvoje možnosti korak za korakom',steps:['Če je varno in primerno: osebi sporoči, da je njeno ravnanje nezaželeno.','Če je neposredni stik nevaren ali nemogoč: obrni se na imenovano kontaktno osebo.','Za hiter in popolnoma digitalen postopek: prijavi prek Speak Up — zaupno in, če želiš, anonimno.','Kadar koli se lahko obrneš tudi na zunanjega varuha pravic Skupine Otto.','Zunanje pravne možnosti (delovna sodišča itd.) ostajajo na voljo in jih uporaba notranjih kanalov ne omejuje.']}},
    {k:'reporting',eyebrow:'06 – Kanali za prijavo',title:'Speak Up: hitro, digitalno, dokumentirano.',body:['Speak Up je prednostni notranji kanal EOS: varen, dokumentiran in zaupen.','Anonimna prijava je mogoča, kjer je to zaželeno.','Na voljo so tudi drugi notranji stiki. Uporabi tistega, ki se ti zdi najprimernejši.'],activity:{type:'highlight',items:[{head:'Speak Up',body:'Prednostna pot. Oddaj prijavo varno, kadarkoli, zaupno in anonimno, če je potrebno. Group Compliance je samodejno obveščen.'},{head:'Notranje kontaktne osebe',body:'Lokalni HR, Group HR in upravljanje raznolikosti so imenovane kontaktne točke. Usposobljeni so za obravnavo pritožb s spoštovanjem in zaupnostjo.'},{head:'Varuh pravic Skupine Otto',body:'Neodvisni zunanji odvetnik, ki ga zavezuje stroga zaupnost. Prijave je mogoče oddati anonimno, informacije pa se delijo samo z izrecnim soglasjem.'}]}},
    {k:'handling',eyebrow:'07 – Po prijavi',title:'Točno to se zgodi nato.',body:['Vsaka prijava je resno obravnavana. Od trenutka stika je postopek dokumentiran in strukturiran.'],activity:{type:'choice',prompt:'Res ali ne: Če uporabiš neformalni postopek pritožbe, pozneje ne moreš več vložiti formalne pritožbe.',options:['Res — kdor najprej uporabi neformalno pot, si zapre formalno.','Ni res — neformalni postopek ne preprečuje vložitve formalne pritožbe v kasnejši fazi.','Res samo, če je bil neformalni postopek uspešno zaključen.'],answer:1,ok:'Pravilno. Politika izrecno določa, da poskus neformalnega reševanja prizadeti osebi ne preprečuje, da pozneje vloži formalno pritožbo.',bad:'Ni povsem točno. Politika varuje tvojo pravico do eskalacije na formalno pritožbo, tudi če si najprej poskusil/a neformalno rešiti situacijo.'}},
    {k:'mechanisms',eyebrow:'08 – Tri poti',title:'Neformalna. Formalna. Zunanja.',body:['Ti in tvoja imenovana kontaktna oseba skupaj odločita, katera pot je primerna za tvojo situacijo.','Ni napačne izbire. Tvoje želje bodo vedno spoštovane.'],activity:{type:'compare',cols:[{head:'Neformalna',body:'Imenovana kontaktna oseba se pogovori z domnevnim nadlegovalcem. Potekal je lahko olajšan pogovor — le s tvojim soglasjem in le, če se počutiš varno.'},{head:'Formalna',body:'Višji HR predstavnik sproži popolno preiskavo. Vse stranke so zaslišane ločeno. Pripravi se pisno poročilo z ugotovitvami in priporočili.'},{head:'Zunanja',body:'Kadar koli se lahko obrneš na zunanje pravne organe ali varuha pravic Skupine Otto. Ta pravica ni prizadeta z morebitno predhodno uporabo notranjih kanalov.'}]},quiz:{quiz:{type:'choice',prompt:'Kaj se zgodi, če najprej poskusite neformalno pot — ali lahko pozneje vseeno vložite formalno pritožbo?',options:['Ne — izbira neformalne poti zapre formalno možnost.','Da — neformalna pot ne vpliva na vašo pravico do vložitve formalne pritožbe.','Samo če je neformalni postopek popolnoma propadel.'],answer:1,ok:'Pravilno. Ni napačne izbire — izbira neformalne poti vam nikoli ne odvzame pravice do eskalacije na formalno pritožbo.',bad:'Ne povsem. Politika je jasna: vaša pravica do vložitve formalne pritožbe je vedno ohranjena, ne glede na to, katero pot ste izbrali najprej.'}}},
    {k:'protection',eyebrow:'09 – Tvoja zaščita',title:'Vložitev prijave te ne bo izpostavila tveganju.',body:['EOS se zavezuje zaščititi vsakogar, ki v dobri veri izrazi skrb.','Tvoja anonimnost bo zaščitena v največji možni meri, razen če pravne zahteve ne nalagajo drugače.','Oseba, o kateri poročaš, velja za nedolžno, dokler preiskava ne ugotovi drugače.'],activity:{type:'flip',prompt:'Tri zagotovila',cards:[{icon:'🔒',title:'Zaupnost',text:'Vse pritožbe so obravnavane s spoštovanjem in zaupnostjo skozi celoten postopek.'},{icon:'🛡️',title:'Brez povračilnih ukrepov',text:'Nihče, ki v dobri veri vloži prijavo, ne bo prikrajšan, kaznovan ali viktimiziran.'},{icon:'⚖️',title:'Pošten postopek',text:'Domneva nedolžnosti velja za vsako osebo, obtoženo nadlegovanja.'}]}},
    {k:'sanctions',eyebrow:'10 – Posledice',title:'Potrjeni primeri imajo resnične posledice.',body:['Vsaka oseba, pri kateri se ugotovi spolno nadlegovanje, bo soočena z ustreznimi disciplinskimi ukrepi.','Resnost je odvisna od pogostosti, okoliščin in veljavne lokalne zakonodaje.','EOS teh primerov ne obravnava kot nepomembne.'],activity:{type:'list',heading:'Možni ukrepi',items:['Ustno ali pisno opozorilo','Negativna ocena uspešnosti','Zmanjšanje spremenljivega plačila (kjer je to zakonsko dovoljeno)','Premestitev na drugo delovno mesto ali oddelek','Degradacija','Suspenzija','Odpustitev (v resnih primerih, takojšnja)']}},
    {k:'manager',managerOnly:true,eyebrow:'11 – Tvoja vloga (Vodja / HR)',title:'Ko se nekdo obrne na tebe: kaj storiti.',body:['Pogosto si prva oseba, na katero se prizadeti zaposleni obrne.','Kako se odzoveš v tistem trenutku, je izjemno pomembno.','Tvoja naloga ni preiskovati — temveč poslušati, obveščati in podpirati.'],activity:{type:'steps',heading:'Ko je izražena skrb',steps:['Jemi resno. Ne zmanjšuj in ne zavrni tega, kar slišiš.','Poslušaj brez obsojanja in brez obljubljanja konkretnih rezultatov.','Obvestitii osebo o razpoložljivih postopkih: neformalnem, formalnem in zunanjem.','Jasno dokumentiraj. Priporoči Speak Up za hiter digitalni zapis.','Usklajuj naslednje korake s prizadeto osebo — vedno spoštuj njene/njegove želje.','Ohrani strogo zaupnost. Upoštevaj načelo potrebe po vedenju.']}},
    {k:'manager2',managerOnly:true,eyebrow:'12 – Formalna obravnava (Vodja / HR)',title:'Kaj od tebe zahteva formalni postopek.',body:['Ko je vložena formalna pritožba, prevzame odgovornost višji HR predstavnik.','Preiskave se izvajajo nepristransko, zaupno in hitro.','Tvoja vloga: podpirati postopek, ne voditi ga — razen če si formalno imenovan/a za preiskovalca/ko.'],activity:{type:'scenario',tag:'Scenarij Vodja / HR',text:'Zaposlena ti pove, da je doživela ponavljajoča se nezaželena dvorjenja s strani sodelavca na enaki ravni. Še ni prepričana, kaj želi storiti, in vpraša, ali mora zdaj odločiti.',question:'Kako bi se moral/a odzvati?',answer:'Sporoči ji, da se ji ni treba odločiti takoj. Razloži razpoložljive poti: neformalna rešitev, formalna pritožba in zunanje možnosti. Izpostavi Speak Up kot najhitrejšo in najvarnejšo digitalno pot. Pojasni, da bodo njene/njegove želje spoštovane skozi celoten postopek in da izražanje skrbi ne bo imelo zanjo/njega negativnih posledic.'},quiz:{quiz:{type:'choice',prompt:'Kdo vodi preiskavo, ko je vložena formalna pritožba?',options:['Vodja, ki je prejel prijavo kot prvi.','Višji predstavnik HR.','Neposredni nadrejeni obtožene osebe.'],answer:1,ok:'Pravilno. Ko je vložena formalna pritožba, prevzame odgovornost višji predstavnik HR — ne vodja, ki je prejel prijavo.',bad:'Ne povsem. Formalnim postopkom vodi višji predstavnik HR, da se zagotovi nepristranskost in zaupnost.'}}},
    {k:'close',eyebrow:'Zaključek',title:'Zdaj si pripravljen/a.',body:['Veš, kaj pomeni spolno nadlegovanje po politiki EOS.','Poznaš kanale za prijavo in kaj se zgodi po prijavi.','Poznaš svoje pravice in — če si vodja ali HR — svoje odgovornosti.','Spoštljivo ravnanje je skupna odgovornost vseh.'],activity:{type:'commit',text:'Razumem ključna načela korporativne politike EOS o spolnem nadlegovanju in vem, kje poiskati podporo in možnosti za prijavo.'}}
  ]
};

CONTENT['da'] = {
  ui:{quizHint:'Vælg venligst det rigtige svar for at fortsætte.',back:'Tilbage',continue:'Fortsæt',finish:'Afslut',restart:'Start forfra',selectLang:'Vælg sprog',selectRole:'Hvem er du?',employee:'Medarbejder',manager:'Leder / Human Resources',empDesc:'Lær hvad seksuel chikane betyder, hvor grænserne går, og hvilke muligheder du har, hvis du bliver berørt.',mgrDesc:'Alt medarbejderindhold samt et dedikeret modul om, hvordan du støtter personer, der henvender sig til dig med en bekymring.',startBtn:'Start uddannelse',complete:'Uddannelse gennemført',completeMsg:'Tak fordi du har gennemført EOS\'s uddannelse i respektfuldt arbejdsmiljø.',tapHint:'Tryk på et kort for at afsløre',showGuidance:'Vis vejledning'},
  modules:[
    {k:'purpose',eyebrow:'01 – Hvorfor det er vigtigt',title:'Nultolerance betyder nul undtagelser.',body:['EOS har nultolerance over for seksuel chikane — uanset sted, miljø eller format.','Denne politik gælder globalt for alle virksomheder i EOS-koncernen og er bindende for alle medarbejdere og ledere.','Denne uddannelse hjælper dig med at forstå, hvad der er dækket, hvad du kan gøre, og hvordan EOS håndterer indberetninger.'],activity:{type:'flip',prompt:'Tre ting at vide',cards:[{icon:'🌍',title:'Gælder globalt',text:'Alle virksomheder i EOS-koncernen er omfattet, uanset størrelse eller struktur.'},{icon:'⚖️',title:'Bindende for alle',text:'Ledere, chefer og medarbejdere — alle skal overholde politikken.'},{icon:'🎯',title:'Hvad denne uddannelse giver',text:'Øger bevidstheden, forklarer grænserne og viser dig dine muligheder.'}]}},
    {k:'definition',eyebrow:'02 – Hvad er seksuel chikane?',title:'Det handler ikke om hensigt. Det handler om virkning.',body:['Seksuel chikane er uønsket adfærd af seksuel karakter, der krænker, ydmyger eller intimiderer en person.','Det kan være en enkeltstående hændelse eller et mønster af adfærd.','Nøglespørgsmålet: var adfærden uønsket af den person, den var rettet mod?'],activity:{type:'choice',prompt:'Scenarie: En kollega sender en seksuelt eksplicit joke via virksomhedens chat. Modtageren svarer ikke, men føler sig utilpas. Er dette seksuel chikane ifølge EOS\' politik?',options:['Nej — ingen sagde noget, så det var ikke uønsket.','Ja — adfærden var af seksuel karakter og fik modtageren til at føle sig utilpas.','Kun hvis det sker mere end én gang.'],answer:1,ok:'Korrekt. Politikken gør det klart, at det afgørende er, om adfærden var uønsket af modtageren — ikke om nogen protesterede, og ikke om det gentog sig.',bad:'Ikke helt. Politikken fokuserer på, om adfærden var uønsket af modtageren. Tavshed betyder ikke, at adfærden var velkommen.'}},
    {k:'examples',eyebrow:'03 – Hvad tæller?',title:'Tre former — alle forbudt.',body:['Seksuel chikane kan være fysisk, verbal eller ikke-verbal.','Eksemplerne nedenfor er ikke udtømmende. Spørg dig selv i tvivlstilfælde: er denne adfærd ønsket af den anden person?'],activity:{type:'tabs',tabs:[{label:'Fysisk',items:['Uønsket kontakt: klap, knibing, strykning, kys, omfavnelse, berøring eller upassende kontakt — herunder tilsyneladende utilsigtet kontakt.','Fysisk vold, herunder seksovergreb.','Brug af jobrelaterede trusler eller belønninger til at opnå seksuelle tjenester.']},{label:'Verbal',items:['Seksuelt nedværdigende eller depersonaliserende bemærkninger om personer eller deres kroppe.','Nedværdigende kommentarer om en persons sexliv.','Upassende seksuelle historier eller jokes.','Uønskede tilnærmelser eller gentagne invitationer til dates eller fysisk intimitet.','Nedladende eller paternalistiske bemærkninger.','Afsendelse af seksuelt eksplicitte beskeder.']},{label:'Ikke-verbal',items:['Fremvisning af seksuelt eksplicit eller suggestivt materiale.','Seksuelt suggestive gestikulation.','Stirring.','Fløjten.']}]},quiz:{quiz:{type:'choice',prompt:'Hvilket af følgende eksempler er en form for ikke-verbal seksuel chikane?',options:['At sende seksuelt eksplicitte beskeder','At stirre eller fløjte','Uønsket fysisk berøring'],answer:1,ok:'Korrekt. At stirre og fløjte er ikke-verbale former for seksuel chikane — uden ord eller fysisk kontakt.',bad:'Ikke helt. Tænk på de tre kategorier: fysisk, verbal og ikke-verbal. At stirre og fløjte falder under ikke-verbal.'}}},
    {k:'boundaries',eyebrow:'04 – Hvor gælder det?',title:'Arbejdspladsen er mere end kontoret.',body:['Forbuddet gælder på EOS\' lokaler og uden for den normale arbejdsplads.','Dette inkluderer virksomhedssponsorerede sociale arrangementer, forretningsrejser, kurser og konferencer.','Alle kan blive berørt, uanset køn — herunder mellem personer af samme køn.'],activity:{type:'scenario',tag:'Scenarie',text:'Under en EOS-sponsoreret middag komplimenterer et teammedlem gentagne gange en kollega om vedkommendes udseende på en måde, der tydeligt gør kollegaen utilpas. Kollegaen siger ingenting, men undgår personen resten af aftenen.',question:'Falder dette ind under EOS\' politik?',answer:'Ja. Politikken dækker EOS-sponsorerede arrangementer uden for den normale arbejdsplads. Det afgørende er den ubehagsfølelse, modtageren oplever — ikke om vedkommende sagde noget.'}},
    {k:'affected',eyebrow:'05 – Hvis det sker for dig',title:'Du har flere muligheder, end du tror.',body:['Du er ikke forpligtet til at konfrontere den anden person direkte — især ikke i ulige relationer.','EOS anerkender, at det ikke altid er muligt eller sikkert at sige noget direkte.','Uanset hvilken vej du vælger, vil din bekymring blive behandlet fortroligt og med respekt.'],activity:{type:'steps',heading:'Dine muligheder trin for trin',steps:['Hvor det er sikkert og passende: gør personen opmærksom på, at adfærden er uønsket.','Hvis direkte kontakt føles usikkert eller umuligt: kontakt en udpeget kontaktperson.','For en hurtig og fuldt digital proces: indberet via Speak Up — fortroligt og, hvis du foretrækker det, anonymt.','Du kan også til enhver tid kontakte Otto-koncernens eksterne ombudsmand.','Eksterne juridiske muligheder (arbejdsdomstole mv.) forbliver tilgængelige og påvirkes ikke af brugen af interne kanaler.']}},
    {k:'reporting',eyebrow:'06 – Indberetningskanaler',title:'Speak Up: hurtigt, digitalt, dokumenteret.',body:['Speak Up er EOS\' foretrukne interne kanal: sikker, dokumenteret og fortrolig.','Anonym indberetning er mulig, hvis det ønskes.','Andre interne kontakter er også tilgængelige. Brug den, der føles rigtig for dig.'],activity:{type:'highlight',items:[{head:'Speak Up',body:'Den foretrukne vej. Indsend en rapport sikkert, til enhver tid, fortroligt og anonymt hvis nødvendigt. Group Compliance underrettes automatisk.'},{head:'Interne kontaktpersoner',body:'Lokal HR, Group HR og Diversity Management er udpegede kontaktpunkter. De er uddannet til at håndtere klager med respekt og fortrolighed.'},{head:'Otto-koncernens ombudsmand',body:'En uafhængig ekstern advokat bundet af streng tavshedspligt. Rapporter kan indsendes anonymt, og oplysninger deles kun med dit udtrykkelige samtykke.'}]}},
    {k:'handling',eyebrow:'07 – Efter en indberetning',title:'Her er præcis, hvad der sker derefter.',body:['Enhver indberetning tages alvorligt. Fra det øjeblik du tager kontakt, er processen dokumenteret og struktureret.'],activity:{type:'choice',prompt:'Sandt eller falsk: Hvis du bruger den uformelle klageprocedure, kan du ikke indgive en formel klage efterfølgende.',options:['Sandt — at bruge den uformelle vej først lukker den formelle vej.','Falsk — den uformelle procedure forhindrer ikke en formel klage på et senere tidspunkt.','Kun sandt hvis den uformelle procedure blev gennemført med succes.'],answer:1,ok:'Korrekt. Politikken angiver udtrykkeligt, at et forsøg på uformel løsning ikke forhindrer den berørte person i at indgive en formel klage efterfølgende.',bad:'Ikke helt. Politikken beskytter din ret til at eskalere til en formel klage, selv hvis du først forsøgte at løse det uformelt.'}},
    {k:'mechanisms',eyebrow:'08 – De tre veje',title:'Uformel. Formel. Ekstern.',body:['Du og din udpegede kontaktperson beslutter sammen, hvilken vej der er den rigtige for din situation.','Der er intet forkert valg. Dine ønsker vil blive respekteret til enhver tid.'],activity:{type:'compare',cols:[{head:'Uformel',body:'En udpeget kontaktperson taler med den formodede krænker. En faciliteret samtale kan finde sted — kun med dit samtykke og kun hvis du føler dig tryg.'},{head:'Formel',body:'En senior HR-repræsentant igangsætter en fuld undersøgelse. Alle parter interviewes separat. En skriftlig rapport med resultater og anbefalinger udarbejdes.'},{head:'Ekstern',body:'Du kan til enhver tid kontakte eksterne juridiske organer eller Otto-koncernens ombudsmand. Denne ret påvirkes ikke af forudgående brug af interne kanaler.'}]},quiz:{quiz:{type:'choice',prompt:'Hvad sker der, hvis du først prøver den uformelle vej — kan du stadig indgive en formel klage bagefter?',options:['Nej — valget af den uformelle vej lukker den formelle mulighed.','Ja — den uformelle vej påvirker ikke din ret til at indgive en formel klage.','Kun hvis den uformelle proces fuldstændig mislykkedes.'],answer:1,ok:'Korrekt. Der er intet forkert valg — at vælge den uformelle vej først fjerner aldrig din ret til at eskalere til en formel klage.',bad:'Ikke helt. Politikken er klar: din ret til at indgive en formel klage er altid bevaret, uanset hvilken vej du valgte først.'}}},
    {k:'protection',eyebrow:'09 – Din beskyttelse',title:'At indberette vil ikke sætte dig i fare.',body:['EOS forpligter sig til at beskytte alle, der rejser en bekymring i god tro.','Din anonymitet vil blive beskyttet i videst muligt omfang, medmindre juridiske krav kræver andet.','Den person, du indberetter om, anses for uskyldig, indtil en undersøgelse konkluderer det modsatte.'],activity:{type:'flip',prompt:'Tre garantier',cards:[{icon:'🔒',title:'Fortrolighed',text:'Alle klager behandles med respekt og fortrolighed gennem hele processen.'},{icon:'🛡️',title:'Ingen gengældelse',text:'Ingen, der indberetter i god tro, vil blive stillet dårligere, straffet eller viktimiseret.'},{icon:'⚖️',title:'Retfærdig proces',text:'Uskyldsformodningen gælder for enhver person, der beskyldes for chikane.'}]}},
    {k:'sanctions',eyebrow:'10 – Konsekvenser',title:'Bekræftede sager fører til reelle konsekvenser.',body:['Enhver person, der er fundet skyldig i seksuel chikane, vil blive mødt med passende disciplinære foranstaltninger.','Alvoren afhænger af hyppighed, omstændigheder og gældende lokal lovgivning.','EOS behandler ikke disse sager som ubetydelige.'],activity:{type:'list',heading:'Mulige foranstaltninger',items:['Mundtlig eller skriftlig advarsel','Negativ præstationsvurdering','Reduktion af variabel løn (hvor det er juridisk tilladt)','Forflyttelse til en anden rolle eller afdeling','Degradering','Suspension','Afskedigelse (i alvorlige tilfælde, med øjeblikkelig virkning)']}},
    {k:'manager',managerOnly:true,eyebrow:'11 – Din rolle (Leder / HR)',title:'Når nogen henvender sig til dig: hvad skal du gøre.',body:['Du er ofte den første person, en berørt medarbejder henvender sig til.','Hvordan du reagerer i det øjeblik, betyder meget.','Dit job er ikke at efterforske — det er at lytte, informere og støtte.'],activity:{type:'steps',heading:'Når en bekymring rejses',steps:['Tag det alvorligt. Minimer ikke og afvis ikke det, du hører.','Lyt uden at dømme og uden at love specifikke resultater.','Informer personen om tilgængelige procedurer: uformel, formel og ekstern.','Dokumenter tydeligt. Anbefal Speak Up for et hurtigt digitalt spor.','Koordiner næste skridt med den berørte person — respekter altid vedkommendes ønsker.','Oprethold streng fortrolighed. Anvend need-to-know-princippet.']}},
    {k:'manager2',managerOnly:true,eyebrow:'12 – Formel håndtering (Leder / HR)',title:'Hvad den formelle proces kræver af dig.',body:['Når en formel klage er indgivet, overtager en senior HR-repræsentant ansvaret.','Undersøgelser gennemføres upartisk, fortroligt og hurtigt.','Din rolle: støtte processen, ikke lede den — medmindre du formelt er udpeget som efterforsker.'],activity:{type:'scenario',tag:'Leder / HR scenarie',text:'En medarbejder fortæller dig, at hun har oplevet gentagne uønskede tilnærmelser fra en kollega på samme niveau. Hun er ikke sikker på, hvad hun vil gøre endnu, og spørger, om hun skal beslutte sig nu.',question:'Hvordan bør du reagere?',answer:'Fortæl hende, at hun ikke behøver at beslutte sig med det samme. Forklar de tilgængelige veje: uformel løsning, formel klage og eksterne muligheder. Fremhæv Speak Up som den hurtigste og mest sikre digitale vej. Gør det klart, at hendes ønsker vil blive respekteret gennem hele forløbet, og at det at rejse en bekymring ikke vil stille hende dårligere.'},quiz:{quiz:{type:'choice',prompt:'Hvem leder undersøgelsen, når en formel klage indgives?',options:['Den leder, der først modtog rapporten.','En senior HR-repræsentant.','Den anklagede persons nærmeste leder.'],answer:1,ok:'Korrekt. Når en formel klage er indgivet, overtager en senior HR-repræsentant ansvaret — ikke den leder, der modtog rapporten.',bad:'Ikke helt. Den formelle proces ledes af en senior HR-repræsentant for at sikre upartiskhed og fortrolighed.'}}},
    {k:'close',eyebrow:'Afslutning',title:'Du er nu klar.',body:['Du ved, hvad seksuel chikane betyder ifølge EOS\' politik.','Du kender indberetningskanalerne og ved, hvad der sker efter en indberetning.','Du kender dine rettigheder og — hvis du er leder eller HR — dine ansvarsområder.','Respektfuld adfærd er alles fælles ansvar.'],activity:{type:'commit',text:'Jeg forstår nøgleprincipperne i EOS\' virksomhedspolitik om seksuel chikane og ved, hvor jeg kan finde støtte og indberetningsmulighederne.'}}
  ]
};

CONTENT['el'] = {
  ui:{quizHint:'Παρακαλώ επιλέξτε τη σωστή απάντηση για να συνεχίσετε.',back:'Πίσω',continue:'Συνέχεια',finish:'Ολοκλήρωση',restart:'Επανεκκίνηση',selectLang:'Επιλέξτε γλώσσα',selectRole:'Ποιος/α είσαι;',employee:'Εργαζόμενος/η',manager:'Διευθυντής/ρια / Human Resources',empDesc:'Μάθετε τι σημαίνει σεξουαλική παρενόχληση, πού είναι τα όρια και ποιες επιλογές έχετε αν επηρεαστείτε.',mgrDesc:'Όλο το περιεχόμενο για εργαζομένους, συν ένα αποκλειστικό άρθρωμα για το πώς να υποστηρίξετε άτομα που σας απευθύνονται με κάποιο ζήτημα.',startBtn:'Έναρξη εκπαίδευσης',complete:'Η εκπαίδευση ολοκληρώθηκε',completeMsg:'Σας ευχαριστούμε που ολοκληρώσατε την εκπαίδευση EOS για τον σεβασμό στον χώρο εργασίας.',tapHint:'Πατήστε μια κάρτα για αποκάλυψη',showGuidance:'Εμφάνιση οδηγιών'},
  modules:[
    {k:'purpose',eyebrow:'01 – Γιατί έχει σημασία',title:'Μηδενική ανοχή σημαίνει μηδενικές εξαιρέσεις.',body:['Η EOS έχει μηδενική ανοχή στη σεξουαλική παρενόχληση — σε οποιοδήποτε μέρος, περιβάλλον ή μορφή.','Αυτή η πολιτική εφαρμόζεται παγκοσμίως σε όλες τις εταιρείες του Ομίλου EOS και είναι δεσμευτική για όλους τους εργαζομένους και τα στελέχη.','Αυτή η εκπαίδευση σας βοηθά να κατανοήσετε τι καλύπτεται, τι μπορείτε να κάνετε και πώς η EOS χειρίζεται τις αναφορές.'],activity:{type:'flip',prompt:'Τρία πράγματα που πρέπει να γνωρίζετε',cards:[{icon:'🌍',title:'Εφαρμόζεται παγκοσμίως',text:'Όλες οι εταιρείες του Ομίλου EOS καλύπτονται, ανεξάρτητα από μέγεθος ή δομή.'},{icon:'⚖️',title:'Δεσμευτική για όλους',text:'Στελέχη, διευθυντές και εργαζόμενοι — όλοι πρέπει να συμμορφώνονται.'},{icon:'🎯',title:'Τι προσφέρει αυτή η εκπαίδευση',text:'Αυξάνει την ευαισθητοποίηση, εξηγεί τα όρια και σας δείχνει τις επιλογές σας.'}]}},
    {k:'definition',eyebrow:'02 – Τι είναι η σεξουαλική παρενόχληση;',title:'Δεν πρόκειται για πρόθεση. Πρόκειται για αντίκτυπο.',body:['Η σεξουαλική παρενόχληση είναι ανεπιθύμητη συμπεριφορά σεξουαλικού χαρακτήρα που προσβάλλει, ταπεινώνει ή εκφοβίζει ένα άτομο.','Μπορεί να είναι ένα μεμονωμένο περιστατικό ή επαναλαμβανόμενη συμπεριφορά.','Το βασικό ερώτημα: ήταν αυτή η συμπεριφορά ανεπιθύμητη από το άτομο στο οποίο απευθυνόταν;'],activity:{type:'choice',prompt:'Σενάριο: Ένας συνάδελφος στέλνει ένα σεξουαλικά ρητό αστείο μέσω της εταιρικής συνομιλίας. Ο παραλήπτης δεν απαντά αλλά νιώθει άβολα. Αποτελεί αυτό σεξουαλική παρενόχληση σύμφωνα με την πολιτική της EOS;',options:['Όχι — κανείς δεν είπε τίποτα, άρα δεν ήταν ανεπιθύμητο.','Ναι — η συμπεριφορά ήταν σεξουαλικού χαρακτήρα και έκανε τον παραλήπτη να νιώσει άβολα.','Μόνο αν συμβεί περισσότερες από μία φορές.'],answer:1,ok:'Σωστό. Η πολιτική διευκρινίζει ότι αυτό που μετράει είναι αν η συμπεριφορά ήταν ανεπιθύμητη από τον παραλήπτη — όχι αν κάποιος διαμαρτυρήθηκε, και όχι αν επαναλήφθηκε.',bad:'Όχι ακριβώς. Η πολιτική εστιάζει στο αν η συμπεριφορά ήταν ανεπιθύμητη από τον παραλήπτη. Η σιωπή δεν σημαίνει ότι η συμπεριφορά ήταν ευπρόσδεκτη.'}},
    {k:'examples',eyebrow:'03 – Τι περιλαμβάνεται;',title:'Τρεις μορφές — όλες απαγορευμένες.',body:['Η σεξουαλική παρενόχληση μπορεί να είναι σωματική, λεκτική ή μη λεκτική.','Τα παρακάτω παραδείγματα δεν είναι εξαντλητικά. Σε περίπτωση αμφιβολίας, ρωτήστε τον εαυτό σας: είναι αυτή η συμπεριφορά επιθυμητή από το άλλο άτομο;'],activity:{type:'tabs',tabs:[{label:'Σωματική',items:['Ανεπιθύμητη επαφή: χτύπημα, τσίμπημα, χάδι, φιλί, αγκαλιά, ψηλάφισμα ή ακατάλληλη αφή — συμπεριλαμβανομένης της φαινομενικά τυχαίας επαφής.','Σωματική βία, συμπεριλαμβανομένης της σεξουαλικής επίθεσης.','Χρήση επαγγελματικών απειλών ή ανταμοιβών για την απόκτηση σεξουαλικών χαρίτων.']},{label:'Λεκτική',items:['Σεξουαλικά υποτιμητικές ή αποπροσωποποιητικές παρατηρήσεις για άτομα ή το σώμα τους.','Υποτιμητικά σχόλια για τη σεξουαλική ζωή κάποιου.','Ακατάλληλες σεξουαλικές ιστορίες ή αστεία.','Ανεπιθύμητες προσεγγίσεις ή επανειλημμένες προσκλήσεις για ραντεβού ή σωματική οικειότητα.','Κατευναστικές ή πατερναλιστικές παρατηρήσεις.','Αποστολή σεξουαλικά ρητών μηνυμάτων.']},{label:'Μη λεκτική',items:['Προβολή σεξουαλικά ρητού ή υπαινικτικού υλικού.','Σεξουαλικά υπαινικτικές χειρονομίες.','Επίμονο κοίταγμα.','Σφύριγμα.']}]},quiz:{quiz:{type:'choice',prompt:'Ποιο από τα παρακάτω παραδείγματα είναι μορφή μη λεκτικής σεξουαλικής παρενόχλησης;',options:['Αποστολή σεξουαλικά ρητών μηνυμάτων','Αδιάκριτο κοίταγμα ή σφύριγμα','Ανεπιθύμητη σωματική επαφή'],answer:1,ok:'Σωστό. Το αδιάκριτο κοίταγμα και το σφύριγμα είναι μη λεκτικές μορφές σεξουαλικής παρενόχλησης — χωρίς λόγια ή σωματική επαφή.',bad:'Όχι ακριβώς. Σκεφτείτε τις τρεις κατηγορίες: σωματική, λεκτική και μη λεκτική. Το αδιάκριτο κοίταγμα και το σφύριγμα εμπίπτουν στη μη λεκτική.'}}},
    {k:'boundaries',eyebrow:'04 – Πού εφαρμόζεται;',title:'Ο χώρος εργασίας είναι μεγαλύτερος από το γραφείο.',body:['Η απαγόρευση ισχύει στις εγκαταστάσεις της EOS και εκτός του κανονικού χώρου εργασίας.','Αυτό περιλαμβάνει εταιρικές κοινωνικές εκδηλώσεις, επαγγελματικά ταξίδια, εκπαιδευτικές συνεδρίες και συνέδρια.','Οποιοσδήποτε μπορεί να επηρεαστεί, ανεξάρτητα από το φύλο — συμπεριλαμβανομένων ατόμων του ίδιου φύλου.'],activity:{type:'scenario',tag:'Σενάριο',text:'Κατά τη διάρκεια ενός δείπνου που χρηματοδοτεί η EOS, ένα μέλος της ομάδας κάνει επανειλημμένα κομπλιμέντα σε έναν συνάδελφο για την εμφάνισή του με τρόπο που τον κάνει εμφανώς άβολο. Ο συνάδελφος δεν λέει τίποτα αλλά αποφεύγει το άτομο για το υπόλοιπο της βραδιάς.',question:'Εμπίπτει αυτό στην πολιτική της EOS;',answer:'Ναι. Η πολιτική καλύπτει εκδηλώσεις που χρηματοδοτεί η EOS εκτός του κανονικού χώρου εργασίας. Αυτό που μετράει είναι η δυσφορία που βιώνει ο παραλήπτης — όχι αν είπε κάτι.'}},
    {k:'affected',eyebrow:'05 – Αν σας συμβεί',title:'Έχετε περισσότερες επιλογές από ό,τι νομίζετε.',body:['Δεν είστε υποχρεωμένοι να αντιμετωπίσετε άμεσα το άλλο άτομο — ειδικά σε άνισες σχέσεις.','Η EOS αναγνωρίζει ότι η άμεση έκφραση δεν είναι πάντα δυνατή ή ασφαλής.','Ανεξάρτητα από τη διαδρομή που επιλέγετε, το ζήτημά σας θα αντιμετωπιστεί με εμπιστευτικότητα και σεβασμό.'],activity:{type:'steps',heading:'Οι επιλογές σας, βήμα προς βήμα',steps:['Όταν είναι ασφαλές και κατάλληλο: ενημερώστε το άτομο ότι η συμπεριφορά του είναι ανεπιθύμητη.','Αν η άμεση επαφή φαίνεται επικίνδυνη ή αδύνατη: απευθυνθείτε σε ορισμένο άτομο επικοινωνίας.','Για έναν γρήγορο και πλήρως ψηφιακό τρόπο: υποβάλετε αναφορά μέσω Speak Up — εμπιστευτικά και, αν προτιμάτε, ανώνυμα.','Μπορείτε επίσης να επικοινωνήσετε ανά πάσα στιγμή με τον εξωτερικό διαμεσολαβητή του Ομίλου Otto.','Οι εξωτερικές νομικές επιλογές (εργατικά δικαστήρια κ.λπ.) παραμένουν διαθέσιμες και δεν επηρεάζονται από τη χρήση εσωτερικών καναλιών.']}},
    {k:'reporting',eyebrow:'06 – Κανάλια αναφοράς',title:'Speak Up: γρήγορα, ψηφιακά, τεκμηριωμένα.',body:['Το Speak Up είναι το προτιμώμενο εσωτερικό κανάλι της EOS: ασφαλές, τεκμηριωμένο και εμπιστευτικό.','Η ανώνυμη αναφορά είναι δυνατή εάν το επιθυμείτε.','Άλλες εσωτερικές επαφές είναι επίσης διαθέσιμες. Χρησιμοποιήστε αυτή που σας φαίνεται πιο κατάλληλη.'],activity:{type:'highlight',items:[{head:'Speak Up',body:'Η προτιμώμενη διαδρομή. Υποβάλετε αναφορά με ασφάλεια, ανά πάσα στιγμή, εμπιστευτικά και ανώνυμα αν χρειάζεται. Το Group Compliance ειδοποιείται αυτόματα.'},{head:'Εσωτερικά άτομα επικοινωνίας',body:'Το τοπικό HR, το Group HR και η Διαχείριση Ποικιλομορφίας είναι ορισμένα σημεία επαφής. Είναι εκπαιδευμένοι να χειρίζονται παράπονα με σεβασμό και εμπιστευτικότητα.'},{head:'Διαμεσολαβητής Ομίλου Otto',body:'Ανεξάρτητος εξωτερικός δικηγόρος δεσμευμένος από αυστηρό απόρρητο. Οι αναφορές μπορούν να υποβληθούν ανώνυμα και οι πληροφορίες κοινοποιούνται μόνο με τη ρητή συγκατάθεσή σας.'}]}},
    {k:'handling',eyebrow:'07 – Μετά από μια αναφορά',title:'Αυτό είναι ακριβώς τι συμβαίνει στη συνέχεια.',body:['Κάθε αναφορά λαμβάνεται σοβαρά υπόψη. Από τη στιγμή που επικοινωνείτε, η διαδικασία τεκμηριώνεται και δομείται.'],activity:{type:'choice',prompt:'Αλήθεια ή ψέμα: Αν χρησιμοποιήσετε την άτυπη διαδικασία καταγγελίας, δεν μπορείτε πλέον να υποβάλετε επίσημη καταγγελία αργότερα.',options:['Αλήθεια — η χρήση πρώτα της άτυπης οδού κλείνει την επίσημη.','Ψέμα — η άτυπη διαδικασία δεν εμποδίζει την υποβολή επίσημης καταγγελίας σε μεταγενέστερο στάδιο.','Μόνο αλήθεια αν η άτυπη διαδικασία ολοκληρώθηκε επιτυχώς.'],answer:1,ok:'Σωστό. Η πολιτική ορίζει ρητά ότι η απόπειρα άτυπης επίλυσης δεν εμποδίζει το θιγόμενο άτομο να υποβάλει επίσημη καταγγελία αργότερα.',bad:'Όχι ακριβώς. Η πολιτική προστατεύει το δικαίωμά σας να κλιμακώσετε σε επίσημη καταγγελία ακόμα και αν προσπαθήσατε πρώτα να το επιλύσετε άτυπα.'}},
    {k:'mechanisms',eyebrow:'08 – Οι τρεις διαδρομές',title:'Άτυπη. Επίσημη. Εξωτερική.',body:['Εσείς και το ορισμένο άτομο επικοινωνίας αποφασίζετε από κοινού ποια διαδρομή είναι κατάλληλη για την κατάστασή σας.','Δεν υπάρχει λάθος επιλογή. Οι επιθυμίες σας θα γίνονται σεβαστές ανά πάσα στιγμή.'],activity:{type:'compare',cols:[{head:'Άτυπη',body:'Ένα ορισμένο άτομο επικοινωνίας μιλά με τον φερόμενο παρενοχλητή. Μπορεί να πραγματοποιηθεί διευκολυνόμενη συζήτηση — μόνο με τη συγκατάθεσή σας και μόνο αν αισθάνεστε ασφαλείς.'},{head:'Επίσημη',body:'Ένας ανώτερος εκπρόσωπος HR κινεί πλήρη έρευνα. Όλα τα μέρη παρουσιάζονται χωριστά. Συντάσσεται γραπτή έκθεση με ευρήματα και συστάσεις.'},{head:'Εξωτερική',body:'Μπορείτε ανά πάσα στιγμή να απευθυνθείτε σε εξωτερικούς νομικούς φορείς ή τον διαμεσολαβητή του Ομίλου Otto. Αυτό το δικαίωμα δεν επηρεάζεται από προηγούμενη χρήση εσωτερικών καναλιών.'}]},quiz:{quiz:{type:'choice',prompt:'Τι συμβαίνει αν πρώτα δοκιμάσετε τον ανεπίσημο δρόμο — μπορείτε ακόμα να υποβάλετε επίσημη καταγγελία αργότερα;',options:['Όχι — η επιλογή του ανεπίσημου δρόμου κλείνει την επίσημη επιλογή.','Ναι — η χρήση του ανεπίσημου δρόμου δεν επηρεάζει το δικαίωμά σας να υποβάλετε επίσημη καταγγελία.','Μόνο αν η ανεπίσημη διαδικασία απέτυχε εντελώς.'],answer:1,ok:'Σωστό. Δεν υπάρχει λάθος επιλογή — η χρήση του ανεπίσημου δρόμου πρώτα δεν αφαιρεί ποτέ το δικαίωμά σας να κλιμακωθείτε σε επίσημη καταγγελία.',bad:'Όχι ακριβώς. Η πολιτική είναι σαφής: το δικαίωμά σας να υποβάλετε επίσημη καταγγελία διατηρείται πάντα, ανεξαρτήτως ποιον δρόμο δοκιμάσατε πρώτα.'}}},

    {k:'manager',managerOnly:true,eyebrow:'11 – Ο ρόλος σας (Διευθυντής/ρια / HR)',title:'Όταν κάποιος έρχεται σε εσάς: τι να κάνετε.',body:['Είστε συχνά το πρώτο άτομο στο οποίο απευθύνεται ένας θιγόμενος εργαζόμενος.','Ο τρόπος που αντιδράτε εκείνη τη στιγμή έχει μεγάλη σημασία.','Η δουλειά σας δεν είναι να ερευνάτε — είναι να ακούτε, να ενημερώνετε και να υποστηρίζετε.'],activity:{type:'steps',heading:'Όταν εγείρεται ζήτημα',steps:['Πάρτε το σοβαρά. Μην υποτιμάτε και μην απορρίπτετε αυτό που ακούτε.','Ακούστε χωρίς να κρίνετε και χωρίς να υπόσχεστε συγκεκριμένα αποτελέσματα.','Ενημερώστε το άτομο για τις διαθέσιμες διαδικασίες: άτυπη, επίσημη και εξωτερική.','Τεκμηριώστε με σαφήνεια. Προτείνετε το Speak Up για γρήγορο ψηφιακό ίχνος.','Συντονίστε τα επόμενα βήματα με το θιγόμενο άτομο — σεβαστείτε πάντα τις επιθυμίες του.','Διατηρήστε αυστηρή εμπιστευτικότητα. Εφαρμόστε την αρχή need-to-know.']}},
    {k:'manager2',managerOnly:true,eyebrow:'12 – Επίσημος χειρισμός (Διευθυντής/ρια / HR)',title:'Τι απαιτεί από εσάς η επίσημη διαδικασία.',body:['Μόλις υποβληθεί επίσημη καταγγελία, ένας ανώτερος εκπρόσωπος HR αναλαμβάνει την ευθύνη.','Οι έρευνες διενεργούνται αμερόληπτα, εμπιστευτικά και άμεσα.','Ο ρόλος σας: να υποστηρίξετε τη διαδικασία, όχι να την καθοδηγήσετε — εκτός αν οριστείτε επίσημα ως ερευνητής/τρια.'],activity:{type:'scenario',tag:'Σενάριο Διευθυντής/ρια / HR',text:'Μια εργαζόμενη σας λέει ότι έχει βιώσει επαναλαμβανόμενες ανεπιθύμητες προσεγγίσεις από έναν συνάδελφο του ίδιου επιπέδου. Δεν είναι ακόμα σίγουρη τι θέλει να κάνει και ρωτά αν πρέπει να αποφασίσει τώρα.',question:'Πώς πρέπει να ανταποκριθείτε;',answer:'Ενημερώστε την ότι δεν χρειάζεται να αποφασίσει άμεσα. Εξηγήστε τις διαθέσιμες διαδρομές: άτυπη επίλυση, επίσημη καταγγελία και εξωτερικές επιλογές. Αναδείξτε το Speak Up ως την ταχύτερη και πιο ασφαλή ψηφιακή διαδρομή. Διευκρινίστε ότι οι επιθυμίες της θα γίνονται σεβαστές καθ\'όλη τη διάρκεια και ότι η εγερση ζητήματος δεν θα τη μειονεκτήσει.'},quiz:{quiz:{type:'choice',prompt:'Όταν υποβάλλεται επίσημη καταγγελία, ποιος αναλαμβάνει την ηγεσία της έρευνας;',options:['Ο διευθυντής που έλαβε πρώτος την αναφορά.','Ένα ανώτερο στέλεχος HR.','Ο άμεσος προϊστάμενος του κατηγορούμενου ατόμου.'],answer:1,ok:'Σωστό. Μόλις υποβληθεί επίσημη καταγγελία, ένα ανώτερο στέλεχος HR αναλαμβάνει — όχι ο διευθυντής που έλαβε την αναφορά.',bad:'Όχι ακριβώς. Η επίσημη διαδικασία ηγείται από ανώτερο στέλεχος HR για να εξασφαλιστεί αμεροληψία και εμπιστευτικότητα.'}}},
    {k:'close',eyebrow:'Τελικό',title:'Είστε πλέον έτοιμοι.',body:['Γνωρίζετε τι σημαίνει σεξουαλική παρενόχληση σύμφωνα με την πολιτική της EOS.','Γνωρίζετε τα κανάλια αναφοράς και τι συμβαίνει μετά από μια αναφορά.','Γνωρίζετε τα δικαιώματά σας και — αν είστε διευθυντής/ρια ή HR — τις ευθύνες σας.','Η σεβαστική συμπεριφορά είναι κοινή ευθύνη όλων.'],activity:{type:'commit',text:'Κατανοώ τις βασικές αρχές της Εταιρικής Πολιτικής της EOS για τη Σεξουαλική Παρενόχληση και γνωρίζω πού να βρω υποστήριξη και επιλογές αναφοράς.'}}
  ]
};


// ── STATE ─────────────────────────────────────────────────────────────
let S={lang:'en',role:null,idx:0};
function T(){return CONTENT[S.lang]||CONTENT.en}
function MODS(){return (T().modules||[]).filter(m=>!m.managerOnly||S.role==='manager')}

// ── UTIL ──────────────────────────────────────────────────────────────
function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('page-'+id).classList.add('active')}
function updateTopbar(){
  const ui=T().ui;
  const rb=document.getElementById('role-badge-wrap');
  const pw=document.getElementById('prog-wrap');
  if(S.role){
    rb.innerHTML=`<span class="role-badge">${S.role==='manager'?ui.manager:ui.employee}</span>`;
    const mods=MODS();const pct=Math.round(((S.idx+1)/mods.length)*100);
    document.getElementById('prog-fill').style.width=pct+'%';
    document.getElementById('prog-label').textContent=`${S.idx+1} / ${mods.length}`;
    pw.style.display='flex';
  } else {rb.innerHTML='';pw.style.display='none';}
}
function esc(s){return(s||'').replace(/'/g,"\\'").replace(/"/g,'&quot;')}

// ── LANGUAGE ──────────────────────────────────────────────────────────
function renderLanguage(){
  const ui=T().ui;
  const btns=LANGS.map(([c,n])=>`<button class="lang-btn" onclick="pickLang('${c}')"><span>${n}</span><span style="opacity:.35">›</span></button>`).join('');
  document.getElementById('page-language').innerHTML=`
  <div class="hero-wrap">
    <div class="hero-left">
      <div class="tag">EOS Group &middot; Compliance Training</div>
      <h1>Respectful<br><em>Workplace</em><br>Training.</h1>
      <p>A concise learning module based on the EOS Corporate Policy on Sexual Harassment. Clear, direct, and built for everyone.</p>
    </div>
    <div class="hero-right">
      <h2>${ui.selectLang}</h2>
      <div class="lang-grid">${btns}</div>
    </div>
  </div>`;
  showPage('language');updateTopbar();
}
function pickLang(c){S.lang=c;renderRole()}

// ── ROLE ──────────────────────────────────────────────────────────────
function renderRole(){
  const ui=T().ui;
  document.getElementById('page-role').innerHTML=`
  <div class="hero-wrap">
    <div class="hero-left">
      <div class="tag">EOS Group &middot; Compliance Training</div>
      <h1>Respectful<br><em>Workplace</em><br>Training.</h1>
      <p>${ui.empDesc}</p>
    </div>
    <div class="hero-right">
      <h2>${ui.selectRole}</h2>
      <div class="role-grid">
        <div class="role-card" onclick="startTraining('employee')">
          <h3>${ui.employee}</h3>
          <p>${ui.empDesc}</p>
          <div class="arrow">${ui.startBtn} →</div>
        </div>
        <div class="role-card" onclick="startTraining('manager')">
          <h3>${ui.manager}</h3>
          <p>${ui.mgrDesc}</p>
          <div class="arrow">${ui.startBtn} →</div>
        </div>
      </div>
      <button class="btn btn-ghost" style="margin-top:1.25rem" onclick="renderLanguage()">← ${ui.back}</button>
    </div>
  </div>`;
  showPage('role');updateTopbar();
}
function startTraining(role){S.role=role;S.idx=0;SCORM.set('cmi.location',`${S.lang}|${role}|0`);renderModule()}

function renderActivityBox(m,ui){
  var out=buildActivity(m.activity,ui);
  if(m.activity&&m.activity.quiz){
    out+='<div style="margin-top:1.25rem;border-top:1px solid var(--border);padding-top:1rem">'+buildActivity(m.activity.quiz,ui)+'</div>';
  }
  return out;
}

// ── MODULE ────────────────────────────────────────────────────────────
function renderModule(){
  const ui=T().ui;const mods=MODS();const m=mods[S.idx];const isLast=S.idx===mods.length-1;
  const isChoice=(m.activity&&m.activity.type==='choice')||!!m.quiz;
  const lockClass=isChoice?' locked':'';
  document.getElementById('page-module').innerHTML=`
  <div class="module-page-inner">
    <div class="module-wrap">
      <div class="module-left">
        <div class="mod-eyebrow">${m.eyebrow}</div>
        <div class="mod-title">${m.title}</div>
        <div class="body-points">${(m.body||[]).map(b=>`<div class="body-point"><div class="dot"></div><span>${b}</span></div>`).join('')}</div>
      </div>
      <div class="module-right">
        <div class="activity-box">${buildActivity(m.activity,ui)}</div>
        ${m.quiz?`<div class="activity-box" style="margin-top:1rem">${buildActivity(m.quiz,ui)}</div>`:''}
      </div>
    </div>
    <div class="nav-row">
      <button class="btn btn-ghost" onclick="goBack()">← ${ui.back}</button>
      <button id="next-btn" class="btn btn-${isLast?'red':'primary'}${lockClass}" onclick="goNext()">${isLast?ui.finish:ui.continue} →</button>
    </div>
    ${isChoice?`<p class="quiz-lock-hint show" id="quiz-hint">${ui.quizHint||'Please answer the question correctly to continue.'}</p>`:''}
  </div>`;
  showPage('module');updateTopbar();
  const fh=document.querySelector('.tab-head');if(fh)fh.click();
}
function goBack(){if(S.idx>0){S.idx--;renderModule();}else renderRole()}
function goNext(){const mods=MODS();if(S.idx<mods.length-1){S.idx++;SCORM.set('cmi.location',`${S.lang}|${S.role}|${S.idx}`);renderModule();}else{SCORM.complete();renderDone()}}

// ── DONE ──────────────────────────────────────────────────────────────
function renderDone(){
  const ui=T().ui;
  document.getElementById('page-done').innerHTML=`
  <div class="done-wrap">
    <div class="done-box">
      <div class="done-circle">✓</div>
      <div class="done-title">${ui.complete}</div>
      <p class="done-sub">${ui.completeMsg}</p>
      <button class="btn btn-primary" style="margin-top:1.75rem" onclick="S={lang:'en',role:null,idx:0};renderLanguage()">${ui.restart}</button>
    </div>
  </div>`;
  showPage('done');
  document.getElementById('prog-wrap').style.display='none';
  document.getElementById('role-badge-wrap').innerHTML='';
}

// ── ACTIVITIES ────────────────────────────────────────────────────────
function buildActivity(a,ui){
  if(!a)return'';
  if(a.type==='flip'){
    const cards=(a.cards||[]).map(c=>`
      <div class="flip-card" onclick="this.classList.toggle('flipped')">
        <div class="flip-card-inner">
          <div class="flip-front"><div class="ficon">${c.icon||'💡'}</div><div class="ftitle">${c.title}</div></div>
          <div class="flip-back"><p>${c.text}</p></div>
        </div>
      </div>`).join('');
    return`<p class="act-prompt">${a.prompt}</p><div class="flip-grid">${cards}</div><p class="flip-hint">${ui.tapHint}</p>`;
  }
  if(a.type==='choice'){
    const opts=(a.options||[]).map((o,i)=>`<div class="choice-opt" onclick="pickChoice(this,${i},${a.answer},'${esc(a.ok)}','${esc(a.bad)}')">${o}</div>`).join('');
    return`<p class="act-prompt">${a.prompt}</p><div class="choice-opts">${opts}</div><div class="choice-fb" id="choice-fb"></div>`;
  }
  if(a.type==='tabs'){
    const heads=(a.tabs||[]).map((t,i)=>`<button class="tab-head${i===0?' active':''}" onclick="switchTab(this,${i})">${t.label}</button>`).join('');
    const panes=(a.tabs||[]).map((t,i)=>`<div class="tab-pane${i===0?' active':''}" data-tab="${i}"><ul>${(t.items||[]).map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('');
    return`<div class="tab-heads">${heads}</div>${panes}`;
  }
  if(a.type==='scenario'){
    return`<div class="scenario-shell">
      <div class="scenario-top"><div class="scenario-tag">${a.tag}</div><p class="scenario-text">${a.text}</p></div>
      <div class="scenario-q">${a.question}</div>
      <button class="scenario-reveal" onclick="revealScenario(this)">${ui.showGuidance} ↓</button>
      <div class="scenario-ans"><p>${a.answer}</p></div>
    </div>`;
  }
  if(a.type==='steps'){
    const items=(a.steps||[]).map((s,i)=>`<div class="step-item"><div class="step-num">${i+1}</div><div class="step-text">${s}</div></div>`).join('');
    return`${a.heading?`<p class="steps-heading">${a.heading}</p>`:''}
    <div class="steps-list">${items}</div>`;
  }
  if(a.type==='highlight'){
    const cards=(a.items||[]).map(x=>`<div class="hl-card"><div class="hl-head"><div class="hl-dot"></div>${x.head}</div><div class="hl-body">${x.body}</div></div>`).join('');
    return`<div class="hl-grid">${cards}</div>`;
  }
  if(a.type==='compare'){
    const cols=(a.cols||[]).map(x=>`<div class="compare-card"><div class="compare-head">${x.head}</div><div class="compare-body">${x.body}</div></div>`).join('');
    return`<div class="compare-grid">${cols}</div>`;
  }
  if(a.type==='list'){
    const items=(a.items||[]).map(x=>`<div class="list-item">${x}</div>`).join('');
    return`${a.heading?`<p class="list-heading">${a.heading}</p>`:''}
    <div class="list-grid">${items}</div>`;
  }
  if(a.type==='commit'){
    return`<div class="commit-box"><div class="commit-check">✓</div><p class="commit-text">${a.text}</p></div>`;
  }
  return'';
}

// ── INTERACTION ───────────────────────────────────────────────────────
function pickChoice(el,i,ans,ok,bad){
  const opts=el.parentElement.querySelectorAll('.choice-opt');
  opts.forEach((o,idx)=>{o.classList.remove('correct','wrong');if(idx===i)o.classList.add(i===ans?'correct':'wrong')});
  const fb=el.parentElement.nextElementSibling;
  if(fb){fb.className='choice-fb show '+(i===ans?'ok':'bad');fb.textContent=i===ans?ok:bad;}
  if(i===ans){
    const nb=document.getElementById('next-btn');
    if(nb){nb.classList.remove('locked');}
    const hint=document.getElementById('quiz-hint');
    if(hint){hint.classList.remove('show');}
  }
}
function switchTab(btn,idx){
  const box=btn.closest('.activity-box');
  box.querySelectorAll('.tab-head').forEach(h=>h.classList.remove('active'));
  box.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  box.querySelector(`[data-tab="${idx}"]`).classList.add('active');
}
function revealScenario(btn){
  btn.nextElementSibling.style.display='block';btn.style.display='none';
}

// ── INIT ──────────────────────────────────────────────────────────────
renderLanguage();
</script>
