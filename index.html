  modules:[
    {k:'purpose',eyebrow:'01 – Zašto je to važno',title:'Nulta tolerancija znači nula iznimaka.',body:['EOS ne tolerira seksualno uznemiravanje — ni na jednoj lokaciji, okruženju ni formatu.','Ova politika primjenjuje se globalno na sve tvrtke EOS Grupe i obvezujuća je za sve zaposlenike i rukovoditelje.','Ova obuka pomaže razumjeti što je obuhvaćeno, što možeš poduzeti i kako EOS postupa s prijavama.'],activity:{type:'flip',prompt:'Tri važne činjenice',cards:[{icon:'🌍',title:'Primjenjuje se globalno',text:'Sve tvrtke EOS Grupe su obuhvaćene, bez obzira na veličinu ili strukturu.'},{icon:'⚖️',title:'Obvezujuće za sve',text:'Rukovoditelji, menadžeri i zaposlenici — svi moraju poštovati politiku.'},{icon:'🎯',title:'Svrha ove obuke',text:'Povećava svijest, objašnjava granice i pokazuje dostupne mogućnosti.'}]}},
    {k:'definition',eyebrow:'02 – Što je seksualno uznemiravanje?',title:'Nije bitna namjera. Bitan je učinak.',body:['Seksualno uznemiravanje je neželjeno ponašanje seksualne prirode koje osobu vrijeđa, ponižava ili zastrašuje.','Može biti jednokratni incident ili obrazac ponašanja.','Ključno pitanje: je li ponašanje bilo neželjeno od strane osobe kojoj je bilo upućeno?'],activity:{type:'choice',prompt:'Scenarij: Kolega šalje seksualno eksplicitan vic putem poslovnog chata. Primatelj ne odgovara, ali se osjeća nelagodno. Je li ovo seksualno uznemiravanje prema politici EOS-a?',options:['Ne — nitko ništa nije rekao, dakle nije bilo neželjeno.','Da — ponašanje je bilo seksualne prirode i izazvalo je nelagodu kod primatelja.','Samo ako se dogodi više od jednom.'],answer:1,ok:'Točno. Politika jasno navodi da je važno je li ponašanje neželjeno za primatelja — ne je li netko protestirao niti je li se ponavljalo.',bad:'Nije sasvim točno. Politika se fokusira na to je li ponašanje bilo neželjeno za primatelja. Šutnja ne znači da je ponašanje bilo dobrodošlo.'}},
    {k:'examples',eyebrow:'03 – Što se ubraja?',title:'Tri oblika — svi zabranjeni.',body:['Seksualno uznemiravanje može biti fizičko, verbalno ili neverbalno.','Donji primjeri nisu iscrpni. U slučaju sumnje, pitaj se: je li ovo ponašanje željeno od strane druge osobe?'],activity:{type:'tabs',tabs:[{label:'Fizičko',items:['Neželjeni kontakt: tapšanje, štipanje, milovanje, ljubljenje, zagrljaji, pipanje ili neprimjereno dodirivanje — uključujući naizgled slučajni kontakt.','Fizičko nasilje, uključujući seksualni napad.','Korištenje poslovnih prijetnji ili nagrada za iznuđivanje seksualnih usluga.']},{label:'Verbalno',items:['Seksualno ponižavajuće ili depersonalizirajuće primjedbe o osobama ili njihovim tijelima.','Ponižavajući komentari o nečijem seksualnom životu.','Neprimjerene seksualne priče ili vicevi.','Neželjena udvaranja ili ponovljeni pozivi na izlaske ili fizičku intimnost.','Snishodljive ili paternalističke primjedbe.','Slanje seksualno eksplicitnih poruka.']},{label:'Neverbalno',items:['Izlaganje seksualno eksplicitnog ili sugestivnog materijala.','Seksualno sugestivne geste.','Promatranje s požudom.','Zviždanje.']}]},quiz:{quiz:{type:'choice',prompt:'Koji od sljedećih primjera je oblik neverbalnog seksualnog uznemiravanja?',options:['Slanje seksualno eksplicitnih poruka','Zurenje ili zviždanje','Neželjeni fizički kontakt'],answer:1,ok:'Točno. Zurenje i zviždanje su neverbalni oblici seksualnog uznemiravanja — bez riječi ili fizičkog kontakta.',bad:'Ne sasvim. Razmisli o tri kategorije: fizičko, verbalno i neverbalno. Zurenje i zviždanje spadaju u neverbalno.'}}},
    {k:'boundaries',eyebrow:'04 – Gdje se primjenjuje?',title:'Radno mjesto je više od ureda.',body:['Zabrana se primjenjuje na prostorima EOS-a i izvan redovnog radnog mjesta.','To uključuje društvene događaje koje sponzorira tvrtka, poslovna putovanja, obuke i konferencije.','Svaka osoba može biti pogođena, bez obzira na spol — uključujući između osoba istog spola.'],activity:{type:'scenario',tag:'Scenarij',text:'Tijekom večere koju sponzorira EOS, član tima više puta komplimentira kolegici izgled na način koji je vidljivo čini nelagodnom. Kolegica ništa ne govori, ali izbjegava tu osobu do kraja večeri.',question:'Spada li ovo pod politiku EOS-a?',answer:'Da. Politika obuhvaća događaje koje sponzorira EOS izvan redovnog radnog mjesta. Ono što se računa je nelagoda primatelja — ne je li nešto rekao/rekla.'}},
    {k:'affected',eyebrow:'05 – Ako ti se to dogodi',title:'Imaš više mogućnosti nego što misliš.',body:['Nisi dužan/a izravno se suočiti s drugom osobom — posebno u neravnopravnim odnosima.','EOS prepoznaje da izravno oglašavanje nije uvijek moguće ili sigurno.','Koji god put odabereš, tvoja će se briga rješavati povjerljivo i s poštovanjem.'],activity:{type:'steps',heading:'Tvoje mogućnosti korak po korak',steps:['Ako je sigurno i prikladno: obavijesti osobu da je njezino ponašanje neželjeno.','Ako je izravni kontakt nesiguran ili nemoguć: obrati se imenovanoj kontaktnoj osobi.','Za brz i potpuno digitalni proces: prijavi putem Speak Up — povjerljivo i, ako želiš, anonimno.','U bilo kojem trenutku možeš se obratiti i vanjskom ombudsmanu Otto Grupe.','Vanjske pravne mogućnosti (radni sudovi itd.) ostaju dostupne i nisu ograničene korištenjem internih kanala.']}},
    {k:'reporting',eyebrow:'06 – Kanali za prijavu',title:'Speak Up: brzo, digitalno, dokumentirano.',body:['Speak Up je preferirani interni kanal EOS-a: siguran, dokumentiran i povjerljiv.','Anonimna prijava je moguća gdje se to želi.','Dostupni su i drugi interni kontakti. Koristi onaj koji ti se čini najprikladnijim.'],activity:{type:'highlight',items:[{head:'Speak Up',body:'Preferirani put. Podnesi prijavu sigurno, u bilo koje vrijeme, povjerljivo i anonimno ako je potrebno. Group Compliance automatski se obavještava.'},{head:'Interne kontaktne osobe',body:'Lokalni HR, Group HR i upravljanje raznolikošću su imenovane kontaktne točke. Osposobljeni su za rješavanje pritužbi s poštovanjem i povjerljivošću.'},{head:'Ombudsman Otto Grupe',body:'Neovisni vanjski odvjetnik vezan strogom povjerljivošću. Prijave se mogu podnijeti anonimno, a informacije se dijele samo uz izričitu suglasnost.'}]}},
    {k:'handling',eyebrow:'07 – Nakon prijave',title:'Evo što se točno događa dalje.',body:['Svaka prijava se shvaća ozbiljno. Od trenutka kontakta, proces je dokumentiran i strukturiran.'],activity:{type:'choice',prompt:'Točno ili netočno: Ako koristiš neformalni postupak pritužbe, više ne možeš podnijeti formalnu pritužbu.',options:['Točno — tko prvo koristi neformalni put, zatvara si formalni.','Netočno — neformalni postupak ne sprječava formalnu pritužbu u kasnijoj fazi.','Točno samo ako je neformalni postupak uspješno završen.'],answer:1,ok:'Točno. Politika izričito navodi da pokušaj neformalnog rješavanja ne sprječava pogođenu osobu da kasnije podnese formalnu pritužbu.',bad:'Nije sasvim točno. Politika štiti tvoje pravo na eskalaciju na formalnu pritužbu čak i ako si prvo pokušao/la neformalno riješiti situaciju.'}},
    {k:'mechanisms',eyebrow:'08 – Tri puta',title:'Neformalni. Formalni. Vanjski.',body:['Ti i tvoja imenovana kontaktna osoba zajedno odlučujete koji je put pravi za tvoju situaciju.','Ne postoji pogrešan izbor. Tvoje želje bit će uvijek poštovane.'],activity:{type:'compare',cols:[{head:'Neformalni',body:'Imenovana kontaktna osoba razgovara s navodnim uznemiravateljem. Može se održati olakšani razgovor — samo uz tvoj pristanak i samo ako se osjećaš sigurno.'},{head:'Formalni',body:'Viši HR predstavnik pokreće potpunu istragu. Sve se stranke saslušavaju odvojeno. Priprema se pisano izvješće s nalazima i preporukama.'},{head:'Vanjski',body:'U bilo koje vrijeme možeš se obratiti vanjskim pravnim tijelima ili ombudsmanu Otto Grupe. To pravo nije pod utjecajem prethodnog korištenja internih kanala.'}]},quiz:{quiz:{type:'choice',prompt:'Što se događa ako prvo pokušaš neformalni put — možeš li i dalje podnijeti formalnu pritužbu?',options:['Ne — odabir neformalnog puta zatvara formalnu opciju.','Da — neformalni put ne utječe na tvoje pravo podnošenja formalne pritužbe.','Samo ako je neformalni proces potpuno propao.'],answer:1,ok:'Točno. Nema pogrešnog izbora — odabir neformalnog puta nikada ti ne oduzima pravo na eskalaciju do formalne pritužbe.',bad:'Ne sasvim. Politika je jasna: tvoje pravo na podnošenje formalne pritužbe uvijek je sačuvano, bez obzira koji si put odabrao/la prvi.'}}},
    {k:'protection',eyebrow:'09 – Tvoja zaštita',title:'Podnošenje prijave te neće dovesti u opasnost.',body:['EOS se obvezuje zaštititi svakoga tko u dobroj vjeri iznese zabrinutost.','Tvoja anonimnost bit će zaštićena u što je moguće većoj mjeri, osim ako pravni zahtjevi ne nalažu drugačije.','Osoba o kojoj prijaviš smatra se nevinim dok istraga ne zaključi suprotno.'],activity:{type:'flip',prompt:'Tri jamstva',cards:[{icon:'🔒',title:'Povjerljivost',text:'Sve se pritužbe rješavaju s poštovanjem i povjerljivošću tijekom cijelog procesa.'},{icon:'🛡️',title:'Bez odmazde',text:'Nitko tko prijavi u dobroj vjeri neće biti doveden u nepovoljniji položaj, kažnjen ili viktimiziran.'},{icon:'⚖️',title:'Pravičan postupak',text:'Presumpcija nevinosti primjenjuje se na svakoga optuženog za uznemiravanje.'}]}},
    {k:'sanctions',eyebrow:'10 – Posljedice',title:'Potvrđeni slučajevi imaju stvarne posljedice.',body:['Svaka osoba za koju se utvrdi da je seksualno uznemiravala bit će podvrgnuta odgovarajućim disciplinskim mjerama.','Težina ovisi o učestalosti, okolnostima i primjenjivom lokalnom zakonu.','EOS ne tretira ove slučajeve kao trivijalne.'],activity:{type:'list',heading:'Moguće mjere',items:['Usmena ili pisana opomena','Negativna ocjena uspješnosti','Smanjenje varijabilne naknade (gdje je zakonski dopušteno)','Premještaj na drugu ulogu ili odjel','Degradacija','Suspenzija','Otkaz (u ozbiljnim slučajevima, trenutačni)']}},
    {k:'manager',managerOnly:true,eyebrow:'11 – Tvoja uloga (Voditelj/Voditeljica / HR)',title:'Kad ti se netko obrati: što učiniti.',body:['Često si prva osoba kojoj se pogođeni zaposlenik obraća.','Kako reagiraš u tom trenutku od velikog je značaja.','Tvoj zadatak nije istraživanje — već slušanje, informiranje i podrška.'],activity:{type:'steps',heading:'Kad se iznese zabrinutost',steps:['Shvati to ozbiljno. Ne umanjuj i ne odbacuj ono što čuješ.','Slušaj bez osude i bez obećavanja konkretnih ishoda.','Informiraj osobu o dostupnim postupcima: neformalnom, formalnom i vanjskom.','Jasno dokumentiraj. Preporuči Speak Up za brz digitalni trag.','Koordiniraj sljedeće korake s pogođenom osobom — uvijek poštuj njezine/njegove želje.','Održavaj strogu povjerljivost. Primijeni načelo potrebe za znanjem.']}},
    {k:'manager2',managerOnly:true,eyebrow:'12 – Formalno postupanje (Voditelj/Voditeljica / HR)',title:'Što od tebe zahtijeva formalni postupak.',body:['Nakon podnošenja formalne pritužbe, viši HR predstavnik preuzima odgovornost.','Istrage se provode nepristrano, povjerljivo i promptno.','Tvoja uloga: podupirati proces, a ne voditi ga — osim ako nisi formalno imenovan/a kao istražitelj/ica.'],activity:{type:'scenario',tag:'Scenarij Voditelj/Voditeljica / HR',text:'Zaposlenica ti govori da je doživjela ponavljana neželjena udvaranja od kolege na istoj razini. Još nije sigurna što želi učiniti i pita mora li se odlučiti odmah.',question:'Kako bi trebao/trebala reagirati?',answer:'Obavijesti je da ne mora odmah donijeti odluku. Objasni dostupne putove: neformalno rješenje, formalna pritužba i vanjske mogućnosti. Istakni Speak Up kao najbrži i najsigurniji digitalni put. Jasno stavi do znanja da će njezine/njegove želje biti poštovane u cijelom procesu i da iznošenje zabrinutosti neće dovesti do nepovoljnog položaja.'},quiz:{quiz:{type:'choice',prompt:'Tko vodi istragu kada se podnese formalna pritužba?',options:['Rukovodilac koji je prvi primio prijavu.','Stariji HR predstavnik.','Neposredni nadređeni optužene osobe.'],answer:1,ok:'Točno. Nakon podnošenja formalne pritužbe stariji HR predstavnik preuzima odgovornost — ne rukovodilac koji je primio prijavu.',bad:'Ne sasvim. Formalnim procesom rukovodi stariji HR predstavnik kako bi se osigurala nepristranost i povjerljivost.'}}},
    {k:'close',eyebrow:'Završno',title:'Sada si spreman/a.',body:['Znaš što seksualno uznemiravanje znači prema politici EOS-a.','Poznaješ kanale za prijavu i što se događa nakon prijave.','Poznaješ svoja prava i — ako si voditelj ili HR — svoje odgovornosti.','Poštovano ponašanje zajednička je odgovornost svih.'],activity:{type:'commit',text:'Razumijem ključna načela Korporativne politike EOS-a o seksualnom uznemiravanju i znam gdje pronaći podršku i mogućnosti prijave.'}}

};

    {k:'definition',eyebrow:'02 – Što je seksualno uznemiravanje?',title:'Nije bitna namjera. Bitan je učinak.',body:['Seksualno uznemiravanje je neželjeno ponašanje seksualne prirode koje osobu vrijeđa, ponižava ili zastrašuje.','Može biti jednokratni incident ili obrazac ponašanja.','Ključno pitanje: je li ponašanje bilo neželjeno od strane osobe kojoj je bilo upućeno?'],activity:{type:'choice',prompt:'Scenarij: Kolega šalje seksualno eksplicitan vic putem poslovnog chata. Primalac ne odgovara, ali se osjeća nelagodno. Je li ovo seksualno uznemiravanje prema politici EOS-a?',options:['Ne — niko ništa nije rekao, dakle nije bilo neželjeno.','Da — ponašanje je bilo seksualne prirode i izazvalo je nelagodu kod primaoca.','Samo ako se dogodi više od jednom.'],answer:1,ok:'Tačno. Politika jasno navodi da je važno je li ponašanje neželjeno za primaoca — ne je li neko protestovao niti je li se ponavljalo.',bad:'Nije sasvim tačno. Politika se fokusira na to je li ponašanje bilo neželjeno za primaoca. Šutnja ne znači da je ponašanje bilo dobrodošlo.'}},
    {k:'examples',eyebrow:'03 – Šta se ubraja?',title:'Tri oblika — svi zabranjeni.',body:['Seksualno uznemiravanje može biti fizičko, verbalno ili neverbalno.','Donji primjeri nisu iscrpni. U slučaju sumnje, pitaj se: je li ovo ponašanje željeno od strane druge osobe?'],activity:{type:'tabs',tabs:[{label:'Fizičko',items:['Neželjeni kontakt: tapšanje, štipanje, milovanje, ljubljenje, zagrljaji, pipanje ili neprimjereno dodirivanje — uključujući naizgled slučajni kontakt.','Fizičko nasilje, uključujući seksualni napad.','Korištenje poslovnih prijetnji ili nagrada za iznuđivanje seksualnih usluga.']},{label:'Verbalno',items:['Seksualno ponižavajuće ili depersonalizirajuće primjedbe o osobama ili njihovim tijelima.','Ponižavajući komentari o nečijem seksualnom životu.','Neprimjerene seksualne priče ili vicevi.','Neželjena udvaranja ili ponovljeni pozivi na izlaske ili fizičku intimnost.','Snishodljive ili paternalističke primjedbe.','Slanje seksualno eksplicitnih poruka.']},{label:'Neverbalno',items:['Izlaganje seksualno eksplicitnog ili sugestivnog materijala.','Seksualno sugestivne geste.','Promatranje s požudom.','Zviždanje.']}]},quiz:{quiz:{type:'choice',prompt:'Koji od sljedećih primjera je oblik neverbalnog seksualnog uznemiravanja?',options:['Slanje seksualno eksplicitnih poruka','Zurenje ili zviždanje','Neželjeni fizički kontakt'],answer:1,ok:'Tačno. Zurenje i zviždanje su neverbalni oblici seksualnog uznemiravanja — bez riječi ili fizičkog kontakta.',bad:'Ne sasvim. Razmisli o tri kategorije: fizičko, verbalno i neverbalno. Zurenje i zviždanje spadaju u neverbalno.'}}},
    {k:'boundaries',eyebrow:'04 – Gdje se primjenjuje?',title:'Radno mjesto je više od ureda.',body:['Zabrana se primjenjuje na prostorima EOS-a i izvan redovnog radnog mjesta.','To uključuje društvene događaje koje sponzorira kompanija, poslovna putovanja, obuke i konferencije.','Svaka osoba može biti pogođena, bez obzira na spol — uključujući između osoba istog spola.'],activity:{type:'scenario',tag:'Scenarij',text:'Tokom večere koju sponzorira EOS, član tima više puta komplimentira kolegici izgled na način koji je vidljivo čini nelagodnom. Kolegica ništa ne govori, ali izbjegava tu osobu do kraja večeri.',question:'Spada li ovo pod politiku EOS-a?',answer:'Da. Politika obuhvata događaje koje sponzorira EOS izvan redovnog radnog mjesta. Ono što se računa je nelagoda primaoca — ne je li nešto rekao/rekla.'}},
    {k:'affected',eyebrow:'05 – Ako ti se to dogodi',title:'Imaš više mogućnosti nego što misliš.',body:['Nisi dužan/a direktno se suočiti s drugom osobom — posebno u neravnopravnim odnosima.','EOS prepoznaje da direktno oglašavanje nije uvijek moguće ili sigurno.','Koji god put odabereš, tvoja će se briga rješavati povjerljivo i s poštovanjem.'],activity:{type:'steps',heading:'Tvoje mogućnosti korak po korak',steps:['Ako je sigurno i prikladno: obavijesti osobu da je njezino ponašanje neželjeno.','Ako je direktni kontakt nesiguran ili nemoguć: obrati se imenovanoj kontaktnoj osobi.','Za brz i potpuno digitalni proces: prijavi putem Speak Up — povjerljivo i, ako želiš, anonimno.','U bilo koje vrijeme možeš se obratiti i vanjskom ombudsmanu Otto Grupe.','Vanjske pravne mogućnosti (radni sudovi itd.) ostaju dostupne i nisu ograničene korištenjem internih kanala.']}},
    {k:'reporting',eyebrow:'06 – Kanali za prijavu',title:'Speak Up: brzo, digitalno, dokumentirano.',body:['Speak Up je preferirani interni kanal EOS-a: siguran, dokumentiran i povjerljiv.','Anonimna prijava je moguća gdje se to želi.','Dostupni su i drugi interni kontakti. Koristi onaj koji ti se čini najprikladnijim.'],activity:{type:'highlight',items:[{head:'Speak Up',body:'Preferirani put. Podnesi prijavu sigurno, u bilo koje vrijeme, povjerljivo i anonimno ako je potrebno. Group Compliance automatski se obavještava.'},{head:'Interne kontaktne osobe',body:'Lokalni HR, Group HR i upravljanje raznolikošću su imenovane kontaktne tačke. Osposobljeni su za rješavanje pritužbi s poštovanjem i povjerljivošću.'},{head:'Ombudsman Otto Grupe',body:'Nezavisni vanjski advokat vezan strogom povjerljivošću. Prijave se mogu podnijeti anonimno, a informacije se dijele samo uz izričitu saglasnost.'}]}},
    {k:'handling',eyebrow:'07 – Nakon prijave',title:'Evo što se tačno događa dalje.',body:['Svaka prijava se shvata ozbiljno. Od trenutka kontakta, proces je dokumentiran i strukturiran.'],activity:{type:'choice',prompt:'Tačno ili netačno: Ako koristiš neformalni postupak pritužbe, više ne možeš podnijeti formalnu pritužbu.',options:['Tačno — ko prvo koristi neformalni put, zatvara si formalni.','Netačno — neformalni postupak ne sprječava formalnu pritužbu u kasnijoj fazi.','Tačno samo ako je neformalni postupak uspješno završen.'],answer:1,ok:'Tačno. Politika izričito navodi da pokušaj neformalnog rješavanja ne sprječava pogođenu osobu da kasnije podnese formalnu pritužbu.',bad:'Nije sasvim tačno. Politika štiti tvoje pravo na eskalaciju na formalnu pritužbu čak i ako si prvo pokušao/la neformalno riješiti situaciju.'}},
    {k:'mechanisms',eyebrow:'08 – Tri puta',title:'Neformalni. Formalni. Vanjski.',body:['Ti i tvoja imenovana kontaktna osoba zajedno odlučujete koji je put pravi za tvoju situaciju.','Ne postoji pogrešan izbor. Tvoje želje bit će uvijek poštovane.'],activity:{type:'compare',cols:[{head:'Neformalni',body:'Imenovana kontaktna osoba razgovara s navodnim uznemiravateljem. Može se održati olakšani razgovor — samo uz tvoj pristanak i samo ako se osjećaš sigurno.'},{head:'Formalni',body:'Viši HR predstavnik pokreće potpunu istragu. Sve se stranke saslušavaju odvojeno. Priprema se pisano izvješće s nalazima i preporukama.'},{head:'Vanjski',body:'U bilo koje vrijeme možeš se obratiti vanjskim pravnim tijelima ili ombudsmanu Otto Grupe. To pravo nije pod utjecajem prethodnog korištenja internih kanala.'}]},quiz:{quiz:{type:'choice',prompt:'Što se dešava ako prvo pokušaš neformalni put — možeš li i dalje podnijeti formalnu pritužbu?',options:['Ne — odabir neformalnog puta zatvara formalnu opciju.','Da — neformalni put ne utiče na tvoje pravo podnošenja formalne pritužbe.','Samo ako je neformalni proces potpuno propao.'],answer:1,ok:'Tačno. Nema pogrešnog izbora — odabir neformalnog puta ti nikada ne oduzima pravo na eskalaciju do formalne pritužbe.',bad:'Ne sasvim. Politika je jasna: tvoje pravo na podnošenje formalne pritužbe uvijek je sačuvano, bez obzira koji si put odabrao/la prvi.'}}},
    {k:'protection',eyebrow:'09 – Tvoja zaštita',title:'Podnošenje prijave te neće dovesti u opasnost.',body:['EOS se obavezuje zaštititi svakoga tko u dobroj vjeri iznese zabrinutost.','Tvoja anonimnost bit će zaštićena u što je moguće većoj mjeri, osim ako pravni zahtjevi ne nalažu drugačije.','Osoba o kojoj prijaviš smatra se nevinim dok istraga ne zaključi suprotno.'],activity:{type:'flip',prompt:'Tri jamstva',cards:[{icon:'🔒',title:'Povjerljivost',text:'Sve se pritužbe rješavaju s poštovanjem i povjerljivošću tokom cijelog procesa.'},{icon:'🛡️',title:'Bez odmazde',text:'Nitko tko prijavi u dobroj vjeri neće biti doveden u nepovoljniji položaj, kažnjen ili viktimiziran.'},{icon:'⚖️',title:'Pravičan postupak',text:'Presumpcija nevinosti primjenjuje se na svakoga optuženog za uznemiravanje.'}]}},
    {k:'sanctions',eyebrow:'10 – Posljedice',title:'Potvrđeni slučajevi imaju stvarne posljedice.',body:['Svaka osoba za koju se utvrdi da je seksualno uznemiravala bit će podvrgnuta odgovarajućim disciplinskim mjerama.','Težina ovisi o učestalosti, okolnostima i primjenjivom lokalnom zakonu.','EOS ne tretira ove slučajeve kao trivijalne.'],activity:{type:'list',heading:'Moguće mjere',items:['Usmena ili pisana opomena','Negativna ocjena uspješnosti','Smanjenje varijabilne naknade (gdje je zakonski dopušteno)','Premještaj na drugu ulogu ili odjel','Degradacija','Suspenzija','Otkaz (u ozbiljnim slučajevima, trenutačni)']}},
    {k:'manager',managerOnly:true,eyebrow:'11 – Tvoja uloga (Rukovodilac / HR)',title:'Kad ti se neko obrati: što učiniti.',body:['Često si prva osoba kojoj se pogođeni zaposlenik obraća.','Kako reagiraš u tom trenutku od velikog je značaja.','Tvoj zadatak nije istraživanje — već slušanje, informiranje i podrška.'],activity:{type:'steps',heading:'Kad se iznese zabrinutost',steps:['Shvati to ozbiljno. Ne umanjuj i ne odbacuj ono što čuješ.','Slušaj bez osude i bez obećavanja konkretnih ishoda.','Informiraj osobu o dostupnim postupcima: neformalnom, formalnom i vanjskom.','Jasno dokumentiraj. Preporuči Speak Up za brz digitalni trag.','Koordiniraj sljedeće korake s pogođenom osobom — uvijek poštuj njezine/njegove želje.','Održavaj strogu povjerljivost. Primijeni načelo potrebe za znanjem.']}},
    {k:'manager2',managerOnly:true,eyebrow:'12 – Formalno postupanje (Rukovodilac / HR)',title:'Što od tebe zahtijeva formalni postupak.',body:['Nakon podnošenja formalne pritužbe, viši HR predstavnik preuzima odgovornost.','Istrage se provode nepristrano, povjerljivo i promptno.','Tvoja uloga: podupirati proces, a ne voditi ga — osim ako nisi formalno imenovan/a kao istražitelj/ica.'],activity:{type:'scenario',tag:'Scenarij Rukovodilac / HR',text:'Zaposlenica ti govori da je doživjela ponavljana neželjena udvaranja od kolege na istoj razini. Još nije sigurna što želi učiniti i pita mora li se odlučiti odmah.',question:'Kako bi trebao/trebala reagirati?',answer:'Obavijesti je da ne mora odmah donijeti odluku. Objasni dostupne putove: neformalno rješenje, formalna pritužba i vanjske mogućnosti. Istakni Speak Up kao najbrži i najsigurniji digitalni put. Jasno stavi do znanja da će njezine/njegove želje biti poštovane u cijelom procesu i da iznošenje zabrinutosti neće dovesti do nepovoljnog položaja.'},quiz:{quiz:{type:'choice',prompt:'Ko vodi istragu kada se podnese formalna pritužba?',options:['Rukovodilac koji je prvi primio prijavu.','Stariji HR predstavnik.','Neposredni nadređeni optužene osobe.'],answer:1,ok:'Tačno. Nakon podnošenja formalne pritužbe stariji HR predstavnik preuzima odgovornost — ne rukovodilac koji je primio prijavu.',bad:'Ne sasvim. Formalnim procesom rukovodi stariji HR predstavnik kako bi se osigurala nepristrasnost i povjerljivost.'}}},
    {k:'close',eyebrow:'Završno',title:'Sada si spreman/a.',body:['Znaš što seksualno uznemiravanje znači prema politici EOS-a.','Poznaješ kanale za prijavu i što se događa nakon prijave.','Poznaješ svoja prava i — ako si rukovodilac ili HR — svoje odgovornosti.','Poštovano ponašanje zajednička je odgovornost svih.'],activity:{type:'commit',text:'Razumijem ključna načela Korporativne politike EOS-a o seksualnom uznemiravanju i znam gdje pronaći podršku i mogućnosti prijave.'}}
  ]
};

  ui:{quizHint:'Молимо изаберите тачан одговор да бисте наставили.',back:'Назад',continue:'Настави',finish:'Заврши',restart:'Почни поново',selectLang:'Одабери језик',selectRole:'Ко си?',employee:'Запослени/Запослена',manager:'Руководилац / Human Resources',empDesc:'Сазнај шта значи сексуално узнемиравање, где су границе и које могућности имаш ако си погођен/а.',mgrDesc:'Сав садржај за запослене и додатни модул о томе како подржати особе које ти се обрате с проблемом.',startBtn:'Покрени обуку',complete:'Обука завршена',completeMsg:'Хвала што сте завршили ЕОС обуку о поштовању на радном месту.',tapHint:'Додирните картицу за откривање',showGuidance:'Прикажи смернице'},
  modules:[
    {k:'purpose',eyebrow:'01 – Зашто је то важно',title:'Нулта толеранција значи нула изузетака.',body:['ЕОС не толерише сексуално узнемиравање — ни на једној локацији, окружењу ни формату.','Ова политика примењује се глобално на све компаније ЕОС Групе и обавезујућа је за све запослене и руководиоце.','Ова обука помаже разумети шта је обухваћено, шта можеш предузети и како ЕОС поступа с пријавама.'],activity:{type:'flip',prompt:'Три важне чињенице',cards:[{icon:'🌍',title:'Примењује се глобално',text:'Све компаније ЕОС Групе су обухваћене, без обзира на величину или структуру.'},{icon:'⚖️',title:'Обавезујуће за све',text:'Руководиоци, менаџери и запослени — сви морају поштовати политику.'},{icon:'🎯',title:'Сврха ове обуке',text:'Повећава свест, објашњава границе и показује доступне могућности.'}]}},
    {k:'definition',eyebrow:'02 – Шта је сексуално узнемиравање?',title:'Није битна намера. Битан је учинак.',body:['Сексуално узнемиравање је нежељено понашање сексуалне природе које особу вређа, понижава или застрашује.','Може битиједнократни инцидент или образац понашања.','Кључно питање: да ли је понашање било нежељено од стране особе којој је било упућено?'],activity:{type:'choice',prompt:'Сценарио: Колега шаље сексуално експлицитну шалу путем пословног чета. Прималац не одговара, али се осећа непријатно. Да ли је ово сексуално узнемиравање према политици ЕОС-а?',options:['Не — нико ништа није рекао, дакле није било нежељено.','Да — понашање је било сексуалне природе и изазвало је непријатност код примаоца.','Само ако се догоди više од jednom.'],answer:1,ok:'Тачно. Политика јасно наводи да је важно да ли је понашање нежељено за примаоца — не да ли је неко протестовао нити да ли се понављало.',bad:'Није сасвим тачно. Политика се фокусира на то да ли је понашање било нежељено за примаоца. Ћутање не значи да је понашање било добродошло.'}},
    {k:'examples',eyebrow:'03 – Шта се убраја?',title:'Три облика — сви забрањени.',body:['Сексуално узнемиравање може бити физичко, вербално или невербално.','Доњи примери нису исцрпни. У случају сумње, питај се: да ли је ово понашање жељено од стране друге особе?'],activity:{type:'tabs',tabs:[{label:'Физичко',items:['Нежељени контакт: тапшање, штипање, миловање, љубљење, загрљаји, пипање или неприкладно додиривање — укључујући наизглед случајни контакт.','Физичко насиље, укључујући сексуални напад.','Коришћење пословних претњи или награда за изнуђивање сексуалних услуга.']},{label:'Вербално',items:['Сексуално понижавајуће или деперсонализујуће примедбе о особама или њиховим телима.','Понижавајући коментари о нечијем сексуалном животу.','Неприкладне сексуалне приче или шале.','Нежељена удварања или поновљени позиви на излазе или физичку интимност.','Снисходљиве или патерналистичке примедбе.','Слање сексуално експлицитних порука.']},{label:'Невербално',items:['Излагање сексуално експлицитног или сугестивног материјала.','Сексуално сугестивне гесте.','Посматрање с пожудом.','Звиждање.']}]},quiz:{quiz:{type:'choice',prompt:'Koji od sledećih primera je oblik neverbalnog seksualnog uznemiravanja?',options:['Slanje seksualno eksplicitnih poruka','Zurenje ili zviždanje','Neželjeni fizički kontakt'],answer:1,ok:'Tačno. Zurenje i zviždanje su neverbalni oblici seksualnog uznemiravanja — bez reči ili fizičkog kontakta.',bad:'Ne sasvim. Razmisli o tri kategorije: fizičko, verbalno i neverbalno. Zurenje i zviždanje spadaju u neverbalno.'}}},
    {k:'boundaries',eyebrow:'04 – Где се примењује?',title:'Радно место је više od kancelarije.',body:['Забрана се примењује на просторима ЕОС-а и изван редовног радног места.','То укључује друштвене догађаје које спонзорише компанија, пословна путовања, обуке и конференције.','Свака особа може бити погођена, без обзира на пол — укључујући између особа истог пола.'],activity:{type:'scenario',tag:'Сценарио',text:'Током вечере коју спонзорише ЕОС, члан тима вишеструко комплиментира колегиници изглед на начин који је видљиво чини непријатном. Колегиница ништа не говори, али избегава ту особу до краја вечери.',question:'Спада ли ово под политику ЕОС-а?',answer:'Да. Политика обухвата догађаје које спонзорише ЕОС изван редовног радног места. Оно што се рачуна је непријатност примаоца — не да ли је нешто рекао/рекла.'}},
    {k:'affected',eyebrow:'05 – Ако ти се то догоди',title:'Имаш više mogućnosti него što misliš.',body:['Нисте дужни директно се суочити с другом особом — посебно у неравноправним односима.','ЕОС препознаје да директно оглашавање није увек могуће или безбедно.','Који год пут одабереш, твоја ће се брига решавати поверљиво и с поштовањем.'],activity:{type:'steps',heading:'Твоје могућности корак по корак',steps:['Ако је безбедно и прикладно: обавести особу да је њено понашање нежељено.','Ако је директни контакт небезбедан или немогућ: обрати се именованој контактној особи.','За брз и потпуно дигитални процес: пријави путем Speak Up — поверљиво и, ако желиш, анонимно.','У било које време можеш се обратити и спољном омбудсману Ото Групе.','Спољне правне могућности (радни судови итд.) остају доступне и нису ограничене коришћењем интерних канала.']}},
    {k:'reporting',eyebrow:'06 – Канали за пријаву',title:'Speak Up: брзо, дигитално, документовано.',body:['Speak Up је префериран интерни канал ЕОС-а: сигуран, документован и поверљив.','Анонимна пријава је могућа где се то жели.','Доступни су и други интерни контакти. Користи онај који ти се чини најприкладнијим.'],activity:{type:'highlight',items:[{head:'Speak Up',body:'Преферирани пут. Поднеси пријаву сигурно, у било које време, поверљиво и анонимно ако је потребно. Group Compliance аутоматски се обавештава.'},{head:'Интерне контактне особе',body:'Локални ХР, Group HR и управљање разноликошћу су именоване контактне тачке. Оспособљени су за решавање притужби с поштовањем и поверљивошћу.'},{head:'Омбудсман Ото Групе',body:'Независни спољни адвокат везан строгом поверљивошћу. Пријаве се могу поднети анонимно, а информације се деле само уз изричиту сагласност.'}]}},
    {k:'handling',eyebrow:'07 – Након пријаве',title:'Ево шта се тачно догађа даље.',body:['Свака пријава се схвата озбиљно. Од тренутка контакта, процес је документован и структуриран.'],activity:{type:'choice',prompt:'Тачно или нетачно: Ако користиш неформални поступак притужбе, више не можеш поднети формалну притужбу.',options:['Тачно — ко прво користи неформални пут, затвара си формални.','Нетачно — неформални поступак не спречава формалну притужбу у каснијој фази.','Тачно само ако је неформални поступак успешно завршен.'],answer:1,ok:'Тачно. Политика изричито наводи да покушај неформалног решавања не спречава погођену особу да касније поднесе формалну притужбу.',bad:'Није сасвим тачно. Политика штити твоје право на ескалацију на формалну притужбу чак и ако си прво покушао/ла неформално решити ситуацију.'}},
    {k:'mechanisms',eyebrow:'08 – Три пута',title:'Неформални. Формални. Спољни.',body:['Ти и твоја именована контактна особа заједно одлучујете који је пут прави за твоју ситуацију.','Не постоји погрешан избор. Твоје жеље биће увек поштоване.'],activity:{type:'compare',cols:[{head:'Неформални',body:'Именована контактна особа разговара с наводним узнемиравачем. Може се одржати олакшани разговор — само уз твој пристанак и само ако се осећаш безбедно.'},{head:'Формални',body:'Виши ХР представник покреће потпуну истрагу. Све се странке саслушавају одвојено. Припрема се писано извештај с налазима и препорукама.'},{head:'Спољни',body:'У било које время можеш се обратити спољним правним телима или омбудсману Ото Групе. То право није под утицајем претходног коришћења интерних канала.'}]},quiz:{quiz:{type:'choice',prompt:'Šta se dešava ako prvo pokušaš neformalni put — možeš li i dalje podneti formalnu pritužbu?',options:['Ne — odabir neformalnog puta zatvara formalnu opciju.','Da — neformalni put ne utiče na tvoje pravo podnošenja formalne pritužbe.','Samo ako je neformalni proces potpuno propao.'],answer:1,ok:'Tačno. Nema pogrešnog izbora — odabir neformalnog puta ti nikada ne oduzima pravo na eskalaciju do formalne pritužbe.',bad:'Ne sasvim. Politika je jasna: tvoje pravo na podnošenje formalne pritužbe uvijek je sačuvano, bez obzira koji si put odabrao/la prvi.'}}},
    {k:'protection',eyebrow:'09 – Твоја заштита',title:'Подношење пријаве те неће довести у опасност.',body:['ЕОС се обавезује заштитити свакога ко у доброј вери изнесе забринутост.','Твоја анонимност биће заштићена у što је могуће већој мери, осим ако правни захтеви не налажу другачије.','Особа о којој пријављујеш сматра се невином dok istraga ne zaključi суprotno.'],activity:{type:'flip',prompt:'Три јемства',cards:[{icon:'🔒',title:'Поверљивост',text:'Све се притужбе решавају с поштовањем и поверљивошћу током целог процеса.'},{icon:'🛡️',title:'Без одмазде',text:'Нитко ко пријави у доброј вери неће бити доведен у неповољнији положај, кажњен или виктимизиран.'},{icon:'⚖️',title:'Правичан поступак',text:'Презумпција невиности примењује се на свакога оптуженог за узнемиравање.'}]}},
    {k:'sanctions',eyebrow:'10 – Последице',title:'Потврђени случајеви имају стварне последице.',body:['Свака особа за коју се утврди да је сексуално узнемиравала биће подвргнута одговарајућим дисциплинским мерама.','Тежина зависи од учесталости, околности и примењивог локалног закона.','ЕОС не третира ове случајеве као тривијалне.'],activity:{type:'list',heading:'Могуће мере',items:['Усмена или писана опомена','Негативна оцена успешности','Смањење варијабилне накнаде (где је законски допуштено)','Премештај на другу улогу или одел','Деградација','Суспензија','Отказ (у озбиљним случајевима, тренутачни)']}},
    {k:'manager',managerOnly:true,eyebrow:'11 – Твоја улога (Руководилац / ХР)',title:'Кад ти се неко обрати: шта учинити.',body:['Често си прва особа којој се погођени запослени обраћа.','Kako reagiraš у том тренутку од великог је значаја.','Твој задатак није истраживање — већ слушање, информисање и подршка.'],activity:{type:'steps',heading:'Кад се изнесе забринутост',steps:['Схвати то озбиљно. Не умањуј и не одбацуј оно што чујеш.','Слушај без осуде и без обећавања конкретних исхода.','Информиши особу о доступним поступцима: неформалном, формалном и спољном.','Јасно документуј. Препоручи Speak Up за брз дигитални траг.','Координирај следеће кораке с погођеном особом — увек поштуј њезине/његове жеље.','Одржавај строгу поверљивост. Примени начело потребе за знањем.']}},
    {k:'manager2',managerOnly:true,eyebrow:'12 – Формално поступање (Руководилац / ХР)',title:'Шта од тебе захтева формални поступак.',body:['Након подношења формалне притужбе, виши ХР представник преузима одговорност.','Истраге се проводе непристрасно, поверљиво и promptno.','Твоја улога: подупирати процес, а не водити га — осим ако ниси формално именован/а као истражитељ/ица.'],activity:{type:'scenario',tag:'Сценарио Руководилац / ХР',text:'Запосленица ти говори да је доживела понављана нежељена удварања од колеге на истом нивоу. Још није сигурна шта жели учинити и пита мора ли се одлучити одмах.',question:'Kako би требао/требала реаговати?',answer:'Обавести је да не мора одмах донети одлуку. Objasni доступне путеве: неформално решење, формална притужба и спољашње могућности. Истакни Speak Up као најбржи и најсигурнији дигитални пут. Јасно стави до знања да ће њезине/његове жеље бити поштоване у целом процесу и да изношење забринутости неће довести до неповољног положаја.'},quiz:{quiz:{type:'choice',prompt:'Ko vodi istragu kada se podnese formalna pritužba?',options:['Rukovodilac koji je prvi primio prijavu.','Stariji HR predstavnik.','Neposredni nadređeni optužene osobe.'],answer:1,ok:'Tačno. Nakon podnošenja formalne pritužbe stariji HR predstavnik preuzima odgovornost — ne rukovodilac koji je primio prijavu.',bad:'Ne sasvim. Formalnim procesom rukovodi stariji HR predstavnik kako bi se osigurala nepristrasnost i poverljivost.'}}},
    {k:'close',eyebrow:'Завршно',title:'Сада си спреман/а.',body:['Знаш шта сексуално узнемиравање значи према политици ЕОС-а.','Познајеш каналe за пријаву и шта се догађа након пријаве.','Познајеш своја права и — ако си руководилац или ХР — своје одговорности.','Поштовано понашање заједничка је одговорност свих.'],activity:{type:'commit',text:'Разумем кључна начела Корпоративне политике ЕОС-а о сексуалном узнемиравању и знам где пронаћи подршку и могућности пријаве.'}}
  ]
};

  modules:[
    {k:'purpose',eyebrow:'01 – Зошто е важно',title:'Нулта толеранција значи нула исклучоци.',body:['EOS нема толеранција за сексуално вознемирување — на ниедна локација, опкружување ни формат.','Оваа политика се применува глобално на сите компании на EOS Групата и е обврзувачка за сите вработени и раководители.','Оваа обука помага да се разбере што е опфатено, што можеш да преземеш и како EOS постапува со пријавите.'],activity:{type:'flip',prompt:'Три важни факти',cards:[{icon:'🌍',title:'Се применува глобално',text:'Сите компании на EOS Групата се опфатени, без разлика на големината или структурата.'},{icon:'⚖️',title:'Обврзувачко за сите',text:'Раководители, менаџери и вработени — сите мораат да ја почитуваат политиката.'},{icon:'🎯',title:'Цел на оваа обука',text:'Зголемува свесност, ги објаснува границите и ги покажува достапните можности.'}]}},
    {k:'definition',eyebrow:'02 – Што е сексуално вознемирување?',title:'Не е важна намерата. Важен е ефектот.',body:['Сексуалното вознемирување е несакано однесување од сексуална природа кое лице навредува, понижува или застрашува.','Може да биде единечен инцидент или образец на однесување.','Клучното прашање: дали однесувањето било несакано од страна на лицето кон кое е насочено?'],activity:{type:'choice',prompt:'Сценарио: Колега испраќа сексуално експлицитна шега преку деловниот чет. Примачот не одговара, но се чувствува непријатно. Дали ова е сексуално вознемирување според политиката на EOS?',options:['Не — никој ништо не рекол, значи не било несакано.','Да — однесувањето било од сексуална природа и предизвикало непријатност кај примачот.','Само ако се случи повеќе од еднаш.'],answer:1,ok:'Точно. Политиката јасно наведува дека е важно дали однесувањето е несакано за примачот — не дали некој протестирал ниту дали се повторувало.',bad:'Не е сосема точно. Политиката се фокусира на тоа дали однесувањето е несакано за примачот. Молчењето не значи дека однесувањето е добредојдено.'}},
    {k:'examples',eyebrow:'03 – Што спаѓа тука?',title:'Три форми — сите забранети.',body:['Сексуалното вознемирување може да биде физичко, вербално или невербално.','Следните примери не се исцрпни. Во случај на сомнеж, прашај се: дали ова однесување го сака другото лице?'],activity:{type:'tabs',tabs:[{label:'Физичко',items:['Несакан контакт: тапкање, штипење, милување, бакнување, прегрнување, пипање или несоодветно допирање — вклучувајќи навидум случаен контакт.','Физичко насилство, вклучувајќи сексуален напад.','Користење деловни закани или награди за изнудување сексуални услуги.']},{label:'Вербално',items:['Сексуално понижувачки или деперсонализирачки забелешки за лица или нивните тела.','Понижувачки коментари за нечијот сексуален живот.','Несоодветни сексуални приказни или шеги.','Несакани удварања или повторени покани на средби или физичка интимност.','Снисходливи или патерналистички забелешки.','Испраќање сексуално експлицитни пораки.']},{label:'Невербално',items:['Излагање сексуално експлицитен или сугестивен материјал.','Сексуално сугестивни гестови.','Набљудување со пожуда.','Свиркање.']}]},quiz:{quiz:{type:'choice',prompt:'Кој од следните примери е форма на невербално сексуално вознемирување?',options:['Испраќање сексуално експлицитни пораки','Зјапање или свиркање','Несакан физички контакт'],answer:1,ok:'Точно. Зјапањето и свиркањето се невербални форми на сексуално вознемирување — без зборови или физички контакт.',bad:'Не сосема. Размисли за трите категории: физичка, вербална и невербална. Зјапањето и свиркањето спаѓаат во невербалната.'}}},
    {k:'boundaries',eyebrow:'04 – Каде се применува?',title:'Работното место е повеќе од канцелариjа.',body:['Забраната се применува на просториите на EOS и надвор од редовното работно место.','Ова вклучува општествени настани спонзорирани од компанијата, деловни патувања, обуки и конференции.','Секое лице може да биде погодено, без разлика на полот — вклучувајќи помеѓу лица од ист пол.'],activity:{type:'scenario',tag:'Сценарио',text:'За време на вечера спонзорирана од EOS, член на тимот повеќепати и комплиментира на колешката за нејзиниот изглед на начин кој видливо ја прави непријатна. Колешката ништо не вели, но ја избегнува таа личност до крајот на вечерта.',question:'Дали ова спаѓа под политиката на EOS?',answer:'Да. Политиката ги опфаќа настаните спонзорирани од EOS надвор од редовното работно место. Она што е важно е непријатноста на примачот — не дали рекол/рекла нешто.'}},
    {k:'affected',eyebrow:'05 – Ако ти се случи',title:'Имаш повеќе можности отколку што мислиш.',body:['Не си должен/должна директно да се соочиш со другото лице — особено во нерамноправни односи.','EOS признава дека директното изјаснување не е секогаш можно или безбедно.','Кој пат и да одбереш, твојата загриженост ќе биде разгледана доверливо и со почит.'],activity:{type:'steps',heading:'Твоите можности чекор по чекор',steps:['Ако е безбедно и соодветно: извести ја личноста дека нејзиното однесување е несакано.','Ако директниот контакт е небезбеден или невозможен: обрати се на именувано контактно лице.','За брз и целосно дигитален процес: пријави преку Speak Up — доверливо и, ако сакаш, анонимно.','Во секое време можеш да се обратиш и на надворешниот омбудсман на Ото Групата.','Надворешните правни можности (работни судови итн.) остануваат достапни и не се ограничени со користење на интерните канали.']}},
    {k:'reporting',eyebrow:'06 – Канали за пријавување',title:'Speak Up: брзо, дигитално, документирано.',body:['Speak Up е преферираниот внатрешен канал на EOS: безбеден, документиран и доверлив.','Анонимното пријавување е можно каде е посакувано.','Достапни се и други внатрешни контакти. Користи го оној кој ти се чини најсоодветен.'],activity:{type:'highlight',items:[{head:'Speak Up',body:'Преферираниот пат. Поднеси пријава безбедно, во секое време, доверливо и анонимно ако е потребно. Group Compliance автоматски се известува.'},{head:'Внатрешни контактни лица',body:'Локален ЧР, Group HR и управување со разновидноста се именувани контактни точки. Обучени се за разгледување на жалби со почит и доверливост.'},{head:'Омбудсман на Ото Групата',body:'Независен надворешен адвокат врзан со строга доверливост. Пријавите можат да се поднесат анонимно, а информациите се споделуваат само со твоја изречна согласност.'}]}},
    {k:'handling',eyebrow:'07 – По пријавата',title:'Еве точно што се случува потоа.',body:['Секоја пријава се зема сериозно. Од моментот на контакт, процесот е документиран и структуриран.'],activity:{type:'choice',prompt:'Точно или неточно: Ако го користиш неформалниот постапок за жалба, повеќе не можеш да поднесеш формална жалба.',options:['Точно — кој прво го користи неформалниот пат, го затвора формалниот.','Неточно — неформалниот постапок не ја спречува формалната жалба во подоцнежна фаза.','Точно само ако неформалниот постапок успешно завршил.'],answer:1,ok:'Точно. Политиката изрично наведува дека обидот за неформално решавање не го спречува погоденото лице да поднесе формална жалба подоцна.',bad:'Не е сосема точно. Политиката го штити твоето право на ескалација на формална жалба дури и ако прво си се обидел/а неформално да ја решиш ситуацијата.'}},
    {k:'mechanisms',eyebrow:'08 – Три патишта',title:'Неформален. Формален. Надворешен.',body:['Ти и твоето именувано контактно лице заедно одлучувате кој пат е вистинскиот за твојата ситуација.','Не постои погрешен избор. Твоите желби ќе бидат секогаш почитувани.'],activity:{type:'compare',cols:[{head:'Неформален',body:'Именувано контактно лице разговара со наводниот вознемирувач. Може да се одржи олеснет разговор — само со твоја согласност и само ако се чувствуваш безбедно.'},{head:'Формален',body:'Постар ЧР претставник покренува целосна истрага. Сите страни се сослушуваат одделно. Се подготвува писмен извештај со наоди и препораки.'},{head:'Надворешен',body:'Во секое време можеш да се обратиш на надворешни правни тела или омбудсманот на Ото Групата. Ова право не е под влијание на претходното користење на внатрешните канали.'}]},quiz:{quiz:{type:'choice',prompt:'Што се случува ако прво го пробаш неформалниот пат — можеш ли сепак да поднесеш формална жалба?',options:['Не — изборот на неформален пат ја затвора формалната опција.','Да — неформалниот пат не го засега твоето право да поднесеш формална жалба.','Само ако неформалниот процес целосно пропаднал.'],answer:1,ok:'Точно. Нема погрешен избор — изборот на неформален пат никогаш не ти го одзема правото на ескалација до формална жалба.',bad:'Не сосема. Политиката е јасна: твоето право да поднесеш формална жалба секогаш е зачувано, без оглед кој пат си го избрал/а прво.'}}},
    {k:'protection',eyebrow:'09 – Твоја заштита',title:'Поднесувањето пријава нема да те изложи на ризик.',body:['EOS се обврзува да го заштити секој кој со добра намера ја изнесе загриженоста.','Твојата анонимност ќе биде заштитена во најголема можна мера, освен ако правните барања не налагаат поинаку.','Лицето за кое пријавуваш се смета за невино додека истрагата не заклучи поинаку.'],activity:{type:'flip',prompt:'Три гаранции',cards:[{icon:'🔒',title:'Доверливост',text:'Сите жалби се разгледуваат со почит и доверливост во текот на целиот процес.'},{icon:'🛡️',title:'Без одмазда',text:'Никој кој пријавува со добра намера нема да биде доведен во неповолна положба, казнет или виктимизиран.'},{icon:'⚖️',title:'Правичен постапок',text:'Презумпцијата на невиност се применува на секој обвинет за вознемирување.'}]}},
    {k:'sanctions',eyebrow:'10 – Последици',title:'Потврдените случаи имаат реални последици.',body:['Секое лице за кое се утврди дека извршило сексуално вознемирување ќе биде подложено на соодветни дисциплински мерки.','Тежината зависи од учесталоста, околностите и применливото локално законодавство.','EOS не ги третира овие случаи како тривијални.'],activity:{type:'list',heading:'Можни мерки',items:['Усна или писмена опомена','Негативна оцена на работните резултати','Намалување на варијабилната надоместок (каде е законски дозволено)','Преместување на друга улога или оддел','Деградација','Суспензија','Откaz (во сериозни случаи, веднаш)']}},
    {k:'manager',managerOnly:true,eyebrow:'11 – Твојата улога (Раководител / ЧР)',title:'Кога некој ти се обрати: што да направиш.',body:['Честопати си прво лице на кое му се обраќа погоденото вработено.','Тоа како реагираш во тој момент е од голема важност.','Твојата задача не е истражување — туку слушање, информирање и поддршка.'],activity:{type:'steps',heading:'Кога се изнесува загриженост',steps:['Сфати го сериозно. Не умалувај и не отфрлај она што го слушаш.','Слушај без осудување и без ветување конкретни резултати.','Информирај го лицето за достапните постапки: неформален, формален и надворешен.','Јасно документирај. Препорачај Speak Up за брза дигитална трага.','Координирај ги следните чекори со погоденото лице — секогаш почитувај ги неговите/нејзините желби.','Одржувај строга доверливост. Применувај го начелото на потреба за знаење.']}},
    {k:'manager2',managerOnly:true,eyebrow:'12 – Формално постапување (Раководител / ЧР)',title:'Што бара од тебе формалниот постапок.',body:['По поднесувањето на формална жалба, постар ЧР претставник ја презема одговорноста.','Истрагите се спроведуваат непристрасно, доверливо и навремено.','Твојата улога: да го поддржуваш процесот, а не да го водиш — освен ако не си формално именуван/а за истражувач/ка.'],activity:{type:'scenario',tag:'Сценарио Раководител / ЧР',text:'Вработена ти кажува дека доживеала повторени несакани удварања од колега на исто ниво. Сè уште не е сигурна што сака да направи и прашува дали мора да одлучи веднаш.',question:'Kako треба да реагираш?',answer:'Извести ја дека не мора веднаш да одлучи. Objasni ги достапните патишта: неформално решение, формална жалба и надворешни можности. Истакни го Speak Up како најбрзиот и најбезбедниот дигитален пат. Јасно стави до знаење дека нејзините/неговите желби ќе бидат почитувани во целиот процес и дека изнесувањето загриженост нема да доведе до неповолна положба.'},quiz:{quiz:{type:'choice',prompt:'Кој ја води истрагата кога ќе се поднесе формална жалба?',options:['Раководителот кој прв ја примил пријавата.','Постар HR претставник.','Непосредниот претпоставен на обвинетото лице.'],answer:1,ok:'Точно. По поднесувањето на формална жалба, постар HR претставник ја презема одговорноста — не раководителот кој ја примил пријавата.',bad:'Не сосема. Формалниот процес го води постар HR претставник за да се обезбеди непристрасност и доверливост.'}}},
    {k:'close',eyebrow:'Финално',title:'Сега си подготвен/а.',body:['Знаеш што значи сексуалното вознемирување според политиката на EOS.','Ги познаваш каналите за пријавување и што се случува по пријавата.','Ги познаваш своите права и — ако си раководител или ЧР — своите одговорности.','Почитливото однесување е заедничка одговорност на сите.'],activity:{type:'commit',text:'Ги разбирам клучните принципи на Корпоративната политика на EOS за сексуално вознемирување и знам каде да најдам поддршка и можности за пријавување.'}}
  ]
};
