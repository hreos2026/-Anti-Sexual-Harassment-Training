<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>EOS – Respectful Workplace Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--red:#e30613;--ink:#0d0d0d;--mid:#555;--soft:#f4f4f2;--border:#e2e2e2;--white:#fff}
body{font-family:'Inter',sans-serif;background:var(--soft);color:var(--ink);min-height:100vh;overflow-x:hidden}

/* ── Topbar ── */
#topbar{position:sticky;top:0;z-index:100;height:60px;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;gap:1rem}
.role-badge{font-size:.65rem;font-weight:900;text-transform:uppercase;letter-spacing:.08em;background:var(--ink);color:var(--white);border-radius:99px;padding:.22rem .7rem;white-space:nowrap}
.prog-wrap{display:flex;align-items:center;gap:.75rem;flex:1;max-width:400px;margin-left:auto}
.prog-bar{flex:1;height:5px;background:#e0e0e0;border-radius:99px;overflow:hidden}
.prog-fill{height:100%;background:var(--red);border-radius:99px;transition:.4s ease}
.prog-label{font-size:.72rem;font-weight:700;color:var(--mid);white-space:nowrap}

/* ── Pages ── */
#content{min-height:calc(100vh - 60px)}
.page{display:none}
.page.active{display:block;animation:fadeUp .28s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ── Hero layout ── */
.hero-wrap{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 60px)}
.hero-left{background:var(--ink);padding:3.5rem;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden}
.hero-left::before{content:"";position:absolute;width:560px;height:560px;border-radius:50%;border:110px solid rgba(227,6,19,.13);right:-180px;top:-180px;pointer-events:none}
.hero-left::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;border:55px solid rgba(227,6,19,.07);right:40px;bottom:-60px;pointer-events:none}
.hero-left .tag{font-size:.65rem;font-weight:900;text-transform:uppercase;letter-spacing:.1em;color:var(--red);margin-bottom:1.25rem}
.hero-left h1{font-size:clamp(2rem,3.5vw,3.2rem);font-weight:900;line-height:1.06;color:var(--white)}
.hero-left h1 em{color:var(--red);font-style:normal}
.hero-left p{color:rgba(255,255,255,.5);font-size:.95rem;margin-top:1rem;line-height:1.7;max-width:380px}
.hero-right{background:var(--soft);padding:3rem;display:flex;flex-direction:column;justify-content:center;overflow-y:auto}
.hero-right h2{font-size:1.2rem;font-weight:900;margin-bottom:1.5rem}
@media(max-width:680px){.hero-wrap{grid-template-columns:1fr}.hero-left{min-height:28vh;padding:2rem}.hero-right{padding:1.75rem}}

/* ── Language grid ── */
.lang-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.55rem}
.lang-btn{background:var(--white);border:1.5px solid var(--border);border-radius:12px;padding:.65rem .9rem;font-weight:700;font-size:.82rem;cursor:pointer;text-align:left;transition:.15s ease;display:flex;justify-content:space-between;align-items:center;line-height:1.3}
.lang-btn:hover{border-color:var(--ink);background:var(--ink);color:var(--white)}

/* ── Role cards ── */
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:.85rem}
.role-card{border:1.5px solid var(--border);border-radius:18px;padding:1.5rem;background:var(--white);cursor:pointer;transition:.18s ease;text-align:left}
.role-card:hover{border-color:var(--red);transform:translateY(-2px);box-shadow:0 10px 24px rgba(227,6,19,.09)}
.role-card h3{font-size:1.15rem;font-weight:900;margin-bottom:.4rem;line-height:1.2}
.role-card p{font-size:.82rem;color:var(--mid);line-height:1.6}
.role-card .arrow{margin-top:1rem;color:var(--red);font-weight:900;font-size:.82rem}
@media(max-width:480px){.role-grid{grid-template-columns:1fr}}

/* ── Module page ── */
.module-page-inner{max-width:1040px;margin:0 auto;padding:2rem 1.5rem 4rem}
.module-wrap{display:grid;grid-template-columns:1fr 1.6fr;gap:2rem;align-items:start}
@media(max-width:720px){.module-wrap{grid-template-columns:1fr}}
.mod-eyebrow{font-size:.65rem;font-weight:900;text-transform:uppercase;letter-spacing:.1em;color:var(--red);margin-bottom:.65rem}
.mod-title{font-size:clamp(1.4rem,2.5vw,2.1rem);font-weight:900;line-height:1.1;margin-bottom:1.25rem}
.body-points{display:flex;flex-direction:column;gap:.65rem}
.body-point{display:flex;gap:.7rem;align-items:flex-start;font-size:.88rem;line-height:1.65;color:#333;background:var(--white);border:1px solid var(--border);border-radius:12px;padding:.75rem .9rem}
.body-point .dot{width:7px;height:7px;border-radius:50%;background:var(--red);margin-top:.42rem;flex-shrink:0}

/* ── Activity box ── */
.activity-box{background:var(--white);border:1px solid var(--border);border-radius:20px;padding:1.5rem}

/* flip cards */
.flip-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.65rem}
@media(max-width:500px){.flip-grid{grid-template-columns:1fr}}
.flip-card{border-radius:16px;min-height:140px;cursor:pointer;perspective:600px;position:relative}
.flip-card-inner{width:100%;height:100%;min-height:140px;transition:.4s ease;transform-style:preserve-3d;position:relative}
.flip-card.flipped .flip-card-inner{transform:rotateY(180deg)}
.flip-front,.flip-back{position:absolute;top:0;left:0;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:1rem;border-radius:16px;display:flex;flex-direction:column;justify-content:center;border:1px solid var(--border)}
.flip-front{background:var(--soft)}
.flip-back{background:var(--ink);color:var(--white);transform:rotateY(180deg);border-color:transparent}
.flip-front .ficon{font-size:1.75rem;margin-bottom:.5rem}
.flip-front .ftitle{font-weight:900;font-size:.88rem;line-height:1.3}
.flip-back p{font-size:.8rem;line-height:1.55}
.flip-hint{font-size:.68rem;color:var(--mid);text-align:center;margin-top:.55rem}
.act-prompt{font-weight:800;font-size:.88rem;margin-bottom:.85rem;line-height:1.5}

/* choice */
.choice-opts{display:flex;flex-direction:column;gap:.55rem}
.choice-opt{border:1.5px solid var(--border);border-radius:12px;padding:.8rem .95rem;font-weight:600;font-size:.85rem;cursor:pointer;transition:.15s ease;background:var(--white);line-height:1.5}
.choice-opt:hover:not(.correct):not(.wrong){border-color:#aaa}
.choice-opt.correct{border-color:#16a34a;background:#f0fdf4;color:#15803d}
.choice-opt.wrong{border-color:#dc2626;background:#fff1f2;color:#b91c1c}
.choice-fb{margin-top:.85rem;border-radius:12px;padding:.8rem .95rem;font-size:.83rem;font-weight:700;display:none;line-height:1.5}
.choice-fb.show{display:block}
.choice-fb.ok{background:#f0fdf4;color:#15803d}
.choice-fb.bad{background:#fff1f2;color:#b91c1c}

/* tabs */
.tab-heads{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:.85rem}
.tab-head{border-radius:99px;padding:.35rem .8rem;font-size:.75rem;font-weight:800;cursor:pointer;border:1.5px solid var(--border);background:var(--white);transition:.15s}
.tab-head.active{background:var(--ink);color:var(--white);border-color:var(--ink)}
.tab-pane{display:none}.tab-pane.active{display:block}
.tab-pane ul{display:flex;flex-direction:column;gap:.45rem}
.tab-pane li{font-size:.84rem;line-height:1.6;padding:.6rem .8rem;border-radius:10px;background:var(--soft);border:1px solid var(--border);list-style:none}

/* scenario */
.scenario-shell{border-radius:16px;overflow:hidden;border:1.5px solid var(--border)}
.scenario-top{background:var(--ink);color:var(--white);padding:1.35rem}
.scenario-tag{font-size:.62rem;font-weight:900;text-transform:uppercase;letter-spacing:.1em;color:var(--red);margin-bottom:.65rem}
.scenario-text{font-size:.88rem;line-height:1.65}
.scenario-q{padding:.9rem 1.35rem;font-weight:800;font-size:.86rem;border-bottom:1px solid var(--border);background:var(--white);line-height:1.5}
.scenario-ans{padding:.9rem 1.35rem;background:var(--white);display:none}
.scenario-ans.open{display:block}
.scenario-ans p{font-size:.84rem;line-height:1.65;color:#333}
.scenario-reveal{width:100%;padding:.7rem;background:var(--soft);font-weight:800;font-size:.78rem;border:none;cursor:pointer;text-align:center;transition:.15s;color:var(--ink)}
.scenario-reveal:hover{background:#e8e8e6}

/* steps */
.steps-heading{font-weight:800;font-size:.88rem;margin-bottom:.75rem}
.steps-list{display:flex;flex-direction:column;gap:.5rem}
.step-item{display:flex;gap:.9rem;align-items:flex-start;padding:.8rem .9rem;background:var(--soft);border-radius:14px;border:1px solid var(--border)}
.step-num{width:28px;height:28px;border-radius:50%;background:var(--red);color:var(--white);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.75rem;flex-shrink:0;margin-top:1px}
.step-text{font-size:.84rem;font-weight:600;line-height:1.55}

/* highlight */
.hl-grid{display:flex;flex-direction:column;gap:.65rem}
.hl-card{border-radius:14px;overflow:hidden;border:1px solid var(--border)}
.hl-head{padding:.6rem .9rem;background:var(--ink);color:var(--white);font-weight:900;font-size:.82rem;display:flex;align-items:center;gap:.45rem}
.hl-dot{width:7px;height:7px;border-radius:50%;background:var(--red);flex-shrink:0}
.hl-body{padding:.8rem .9rem;background:var(--white);font-size:.83rem;line-height:1.6;color:#333}

/* compare */
.compare-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.55rem}
@media(max-width:580px){.compare-grid{grid-template-columns:1fr}}
.compare-card{border-radius:14px;overflow:hidden;border:1px solid var(--border)}
.compare-head{padding:.6rem .8rem;background:var(--ink);color:var(--white);font-weight:900;font-size:.78rem;text-align:center}
.compare-body{padding:.8rem .8rem;background:var(--white);font-size:.79rem;line-height:1.6;color:#333}

/* list */
.list-heading{font-weight:800;font-size:.88rem;margin-bottom:.75rem}
.list-grid{display:grid;grid-template-columns:1fr 1fr;gap:.45rem}
@media(max-width:480px){.list-grid{grid-template-columns:1fr}}
.list-item{border-radius:11px;background:var(--soft);border:1px solid var(--border);padding:.6rem .8rem;font-size:.82rem;font-weight:600;display:flex;align-items:flex-start;gap:.5rem;line-height:1.4}
.list-item::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--red);flex-shrink:0;margin-top:.38rem}

/* commit */
.commit-box{background:var(--ink);color:var(--white);border-radius:18px;padding:2rem;text-align:center}
.commit-check{width:56px;height:56px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem;font-size:1.5rem;color:white;font-weight:900}
.commit-text{font-size:1rem;font-weight:700;line-height:1.65;color:rgba(255,255,255,.85)}

/* nav */
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:2rem;padding-top:1.25rem;border-top:1px solid var(--border)}
.btn{border:none;border-radius:99px;padding:.7rem 1.35rem;font-weight:800;font-size:.82rem;cursor:pointer;transition:.15s ease;display:inline-flex;align-items:center;gap:.35rem;line-height:1}
.btn-ghost{background:transparent;color:var(--mid);border:1.5px solid var(--border)}.btn-ghost:hover{background:var(--white)}
.btn-primary{background:var(--ink);color:var(--white)}.btn-primary:hover{background:#222}
.btn-red{background:var(--red);color:var(--white)}.btn-red:hover{filter:brightness(.93)}

/* done */
.done-wrap{min-height:calc(100vh - 60px);display:flex;align-items:center;justify-content:center;padding:2rem}
.done-box{background:var(--white);border:1px solid var(--border);border-radius:26px;max-width:520px;width:100%;padding:3rem;text-align:center}
.btn-primary.locked{background:#ccc;color:#888;cursor:not-allowed;pointer-events:none}
.btn-red.locked{background:#ccc;color:#888;cursor:not-allowed;pointer-events:none}
.quiz-lock-hint{font-size:.75rem;color:var(--mid);text-align:center;margin-top:.65rem;display:none}
.quiz-lock-hint.show{display:block}

.done-circle{width:72px;height:72px;background:var(--red);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1.75rem;font-size:2rem;color:white;font-weight:900}
.done-title{font-size:1.75rem;font-weight:900;margin-bottom:.65rem}
.done-sub{color:var(--mid);line-height:1.7;font-size:.9rem}
</style>
</head>
<body>
<div id="topbar">
  <div id="role-badge-wrap"></div>
  <div class="prog-wrap" id="prog-wrap" style="display:none">
    <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
    <div class="prog-label" id="prog-label"></div>
  </div>
</div>
<div id="content">
  <div id="page-language" class="page"></div>
  <div id="page-role" class="page"></div>
  <div id="page-module" class="page"></div>
  <div id="page-done" class="page"></div>
</div>
<script>
// ── SCORM ──────────────────────────────────────────────────────────────
function findAPI(w){let t=0;while(w&&t++<10){if(w.API_1484_11)return w.API_1484_11;if(w.API)return w.API;if(w.parent&&w.parent!==w)w=w.parent;else break;}return null}
const SCORM={api:null,init(){this.api=findAPI(window);if(this.api){try{let fn=this.api.Initialize||this.api.LMSInitialize;if(fn)fn.call(this.api,'');}catch(e){}}},set(k,v){if(!this.api)return;try{let fn=this.api.SetValue||this.api.LMSSetValue;let cf=this.api.Commit||this.api.LMSCommit;if(fn)fn.call(this.api,k,v);if(cf)cf.call(this.api,'');}catch(e){}},complete(){this.set('cmi.completion_status','completed');this.set('cmi.success_status','passed');this.set('cmi.core.lesson_status','completed');}};
SCORM.init();

// ── DATA ──────────────────────────────────────────────────────────────
const LANGS=[['en','English'],['de','Deutsch'],['bg','Български'],['da','Dansk'],['el','Ελληνικά'],['pl','Polski'],['sl','Slovenščina'],['fr','Français'],['nl','Nederlands'],['hr','Hrvatski'],['hu','Magyar'],['mk','Македонски'],['pt','Português'],['sr','Српски'],['es','Español'],['bs','Bosanski'],['cs','Čeština'],['ro','Română'],['sk','Slovenčina']];
const CONTENT={};
CONTENT['en'] = {
  ui:{quizHint:'Please select the correct answer to continue.',back:'Back',continue:'Continue',finish:'Finish',restart:'Restart',selectLang:'Choose your language',selectRole:'Who are you?',employee:'Employee',manager:'Manager / Human Resources',empDesc:'Learn what sexual harassment means, where the boundaries are and what options you have if you are affected.',mgrDesc:'All employee content, plus a dedicated module on how to support people who come to you with a concern.',startBtn:'Start training',complete:'Training completed',completeMsg:'Thank you for completing the EOS Respectful Workplace Training.',tapHint:'Tap a card to reveal',showGuidance:'Show solution'},
  modules:[
    {k:'purpose',eyebrow:'01 – Why this matters',title:'Zero tolerance means zero exceptions.',body:['EOS tolerates no form of sexual harassment — in any place, any context, any format.','This policy applies globally to all EOS Group companies and is binding for all employees and managers.','This training explains what is covered, what you can do, and how EOS handles reports.'],activity:{type:'flip',prompt:'Three key facts',cards:[{icon:'🌍',title:'Global reach',text:'All EOS Group companies are covered, regardless of size or structure.'},{icon:'⚖️',title:'Binding for everyone',text:'Managers, leaders and employees — everyone must follow this policy.'},{icon:'🎯',title:'What this training does',text:'Raises awareness, clarifies boundaries and shows you your options.'}]}},
    {k:'definition',eyebrow:'02 – What is sexual harassment?',title:"It's not about intent. It's about impact.",body:['Sexual harassment is unwanted behaviour of a sexual nature that offends, humiliates or intimidates a person.','It can be a single incident or a pattern of behaviour.','The key question: was the behaviour unwanted by the person affected?'],activity:{type:'choice',prompt:"Scenario: A colleague sends a sexually explicit joke via the company chat. The recipient does not respond but feels uncomfortable. Is this sexual harassment under the EOS policy?",options:["No — nobody said anything, so it wasn't unwanted.",'Yes — the behaviour was sexual in nature and made the recipient feel uncomfortable.','Only if it happens more than once.'],answer:1,ok:"Correct. The policy makes clear that what matters is whether the behaviour was unwanted by the recipient — not whether anyone spoke up or whether it was repeated.",bad:"Not quite. The policy focuses on whether the behaviour was unwanted by the recipient. Silence does not mean the behaviour was welcome."}},
    {k:'examples',eyebrow:'03 – What counts?',title:'Three forms — all prohibited.',body:['Sexual harassment can be physical, verbal or non-verbal.','The examples below are not exhaustive. If in doubt, ask yourself: is this behaviour wanted by the other person?'],activity:{type:'tabs',tabs:[{label:'Physical',items:['Unwanted physical contact: patting, pinching, stroking, kissing, hugging, groping or inappropriate touching — including seemingly accidental contact.','Physical violence, including sexual assault.','Using professional threats or rewards to obtain sexual favours.']},{label:'Verbal',items:["Sexually degrading or depersonalising remarks about people or their bodies.","Demeaning comments about someone's sex life.",'Inappropriate sexual stories or jokes.','Unwanted advances or repeated invitations to dates or physical intimacy.','Condescending or paternalistic remarks.','Sending sexually explicit messages.']},{label:'Non-verbal',items:['Displaying sexually explicit or suggestive material.','Sexually suggestive gestures.','Staring.','Whistling.']}]},quiz:{type:'choice',prompt:'Which of the following is an example of non-verbal sexual harassment?',options:['Sending sexually explicit messages','Staring or whistling','Unwanted physical touching'],answer:1,ok:'Correct. Staring and whistling are non-verbal forms of sexual harassment — no words or physical contact required.',bad:'Not quite. Think about the three categories: physical, verbal, and non-verbal. Staring and whistling fall under non-verbal.'}},
    {k:'boundaries',eyebrow:'04 – Where does it apply?',title:'The workplace is more than the office.',body:['The prohibition applies on EOS premises and outside the regular workplace.','This includes company-sponsored events, business trips, training sessions and conferences.','Any person can be affected, regardless of gender — including between people of the same gender.'],activity:{type:'scenario',tag:'Scenario',text:'At an EOS-sponsored dinner, a team member repeatedly compliments a colleague on their appearance, visibly making them uncomfortable. The colleague says nothing but avoids the person for the rest of the evening.',question:'Does this fall under the EOS policy?',answer:'Yes. The policy covers EOS-sponsored events outside the regular workplace. What matters is the discomfort of the person affected — not whether they said anything.'}},
    {k:'affected',eyebrow:'05 – If it happens to you',title:'You have various options for getting in touch.',body:['You are not required to confront the other person directly — especially in unequal relationships.','EOS recognises that speaking up directly is not always possible or safe.','Whatever path you choose, your concern will be handled with confidentiality and respect.','Concrete contact details can be found later in this training and on SharePoint.'],activity:{type:'steps',heading:'Your options step by step',steps:['If safe and appropriate: let the person know their behaviour is unwanted. Depending on the situation, we believe many things can be resolved through direct communication.','If direct contact seems unsafe or impossible: contact a designated contact person.','For a well-documented and formal process: report via Speak Up — confidentially and anonymously if you wish.','If none of the above feels right for you: you can also turn to your manager as a trusted contact person.','You can also contact the external Otto Group ombudsman at any time.','External legal options remain available and are not affected by using internal channels.']}},
    {k:'reporting',eyebrow:'06 – Reporting channels',title:'SpeakUp is the preferred way to submit a complaint.',body:['Speak Up is the preferred internal channel: secure, documented and confidential.','Anonymous reporting is possible if desired.','Other internal contacts are also available. Use whichever feels right for you.'],activity:{type:'highlight',items:[{head:'Speak Up',body:'The preferred route. Submit a report securely, at any time, confidentially and anonymously if needed. Group Compliance is automatically notified.'},{head:'Internal contact persons',body:'Local managers (FK), Group HR and Diversity Management are designated contact points. They are trained to handle complaints with respect and confidentiality.'},{head:'Otto Group Ombudsman',body:"An independent external lawyer, bound by strict confidentiality. Reports can be submitted anonymously and information is only shared with your explicit consent. This channel is especially intended for cases where Speak Up or internal contact routes feel impossible for you."}]}},
    {k:'mechanisms',eyebrow:'07 – The three paths',title:'Informal. Formal. External.',body:['Together with your contact person you decide which path suits your situation.','There is no wrong choice. Your wishes will be respected at all times.'],activity:{type:'compare',cols:[{head:'Informal',body:'A manager speaks with the accused person. A facilitated conversation can take place — only with your consent and only if you feel safe.'},{head:'Formal',body:'A senior HR person launches a full investigation. All parties are interviewed separately. A written report with findings and recommendations is prepared.'},{head:'External',body:'You can contact external bodies or the Otto Group ombudsman at any time. This right is not affected by prior use of internal channels.'}]},quiz:{type:'choice',prompt:'What happens if you first try the informal path — can you still file a formal complaint later?',options:['No — choosing informal first closes the formal option.','Yes — using the informal path does not affect your right to file a formal complaint.','Only if the informal process failed completely.'],answer:1,ok:'Correct. There is no wrong choice — using the informal path first never takes away your right to escalate to a formal complaint.',bad:'Not quite. The policy is clear: your right to file a formal complaint is always preserved, regardless of which path you tried first.'}},
    {k:'handling',eyebrow:'08 – After a report',title:'What happens next.',body:['Every report is taken seriously. From the moment you make contact, the process is documented and structured.'],activity:{type:'choice',prompt:'True or false: If you use the informal complaints procedure, you can no longer file a formal complaint afterwards.',options:['True — using the informal route first closes the formal route.','False — the informal procedure does not prevent you from filing a formal complaint later.','Only true if the informal procedure was completed successfully.'],answer:1,ok:'Correct. The policy explicitly states that attempting an informal resolution does not prevent the affected person from filing a formal complaint later.',bad:'Not quite. The policy protects your right to move to a formal complaint even after first trying to resolve the matter informally.'}},
    {k:'protection',eyebrow:'09 – Your protection',title:'Making a report does not put you at risk.',body:['EOS is committed to protecting all persons who file a complaint in good faith.','Your anonymity will be maintained as far as possible, unless legal requirements demand otherwise.','The person you report about is presumed innocent until an investigation is concluded.'],activity:{type:'flip',prompt:'Three guarantees',cards:[{icon:'🔒',title:'Confidentiality',text:'All complaints are handled with respect and confidentiality throughout the entire process.'},{icon:'🛡️',title:'No disadvantage',text:'Nobody who reports in good faith will be disadvantaged, punished or victimised.'},{icon:'⚖️',title:'Fair process',text:'The presumption of innocence applies to every person accused of harassment.'}]}},
    {k:'sanctions',eyebrow:'10 – Consequences',title:'Confirmed cases have real consequences.',body:['Any person found to have committed sexual harassment will face appropriate disciplinary measures.','The severity depends on frequency, circumstances and applicable local law.','EOS does not treat these cases as minor matters.'],activity:{type:'list',heading:'Possible measures',items:['Verbal or written warning','Negative performance review','Transfer to a different role or department','Demotion','Suspension','Termination (in serious cases without notice)']}},
    {k:'manager',managerOnly:true,eyebrow:'11 – Your role (Manager / Human Resources)',title:'When someone comes to you: what to do?',body:['You are often the first person affected employees turn to.','How you respond in that moment is decisive.','Your role is not to investigate — but to listen, inform and support.'],activity:{type:'steps',heading:'When a concern is raised',steps:['Take it seriously. Downplaying or dismissing is not an option.','Listen without judging and without promising specific outcomes.','Inform the person about available procedures: informal, formal and external.','Document carefully, especially if Speak Up is not used as the reporting channel.','Agree next steps with the affected person — respect their wishes at all times.','Maintain strict confidentiality. Apply the need-to-know principle.']}},
    {k:'manager2',managerOnly:true,eyebrow:'12 – Formal procedure (Manager / Human Resources)',title:'What the formal procedure requires of you.',body:['Once a formal complaint is submitted, a senior HR person takes responsibility.','Investigations are conducted impartially, confidentially and promptly.','Your role: support the process, not lead it — unless you are formally appointed as investigator.'],activity:{type:'scenario',tag:'Manager / Human Resources scenario',text:'An employee tells you she has repeatedly experienced unwanted advances. She is not yet sure what she wants to do and asks whether she has to decide right now.',question:'How should you respond?',answer:'Tell her she does not have to decide immediately. Explain the available paths: informal resolution, formal complaint and external options. Make clear that her wishes will be respected at all times and that making a report will not have any negative consequences for her.'},quiz:{type:'choice',prompt:'When a formal complaint is filed, who takes the lead on the investigation?',options:['The manager who first received the report.','A senior HR representative.','The accused person\'s direct supervisor.'],answer:1,ok:'Correct. Once a formal complaint is filed, a senior HR representative takes ownership — not the receiving manager.',bad:'Not quite. The formal process is led by a senior HR representative to ensure it is impartial and confidential.'}},
    {k:'close',eyebrow:'Closing',title:'You are now prepared.',body:['You know what sexual harassment means under the EOS policy.','You know the reporting channels and what happens after a report.','You know your rights — and as a manager or Human Resources, your responsibilities.','Respectful behaviour is the shared responsibility of everyone.'],activity:{type:'commit',text:'I understand the key principles of the EOS corporate policy on sexual harassment and know where to find support and reporting options.'}}
  ]
};
CONTENT['de'] = {
  ui:{quizHint:'Bitte wähle die richtige Antwort, um fortzufahren.',back:'Zurück',continue:'Weiter',finish:'Abschließen',restart:'Neu starten',selectLang:'Sprache wählen',selectRole:'Wer bist du?',employee:'Mitarbeiter:in',manager:'Führungskraft / Human Resources',empDesc:'Lerne, was sexuelle Belästigung bedeutet, wo die Grenzen liegen und welche Möglichkeiten du hast, wenn du betroffen bist.',mgrDesc:'Alle Mitarbeiterinhalte plus ein eigenes Modul dazu, wie du Personen unterstützt, die sich an dich wenden.',startBtn:'Training starten',complete:'Training abgeschlossen',completeMsg:'Vielen Dank für die Teilnahme am EOS-Training für ein respektvolles Arbeitsumfeld.',tapHint:'Karte antippen zum Aufdecken',showGuidance:'Hinweis anzeigen'},
  modules:[
    {k:'purpose',eyebrow:'01 – Warum das wichtig ist',title:'Null Toleranz bedeutet null Ausnahmen.',body:['EOS duldet sexuelle Belästigung in keiner Form — an keinem Ort, in keinem Umfeld, in keinem Format.','Diese Richtlinie gilt weltweit für alle Unternehmen der EOS Group und ist für alle Mitarbeitenden und Führungskräfte verbindlich.','Dieses Training erklärt, was abgedeckt ist, was du tun kannst und wie EOS mit Meldungen umgeht.'],activity:{type:'flip',prompt:'Drei wichtige Fakten',cards:[{icon:'🌍',title:'Weltweite Geltung',text:'Alle Unternehmen der EOS Group sind erfasst, unabhängig von Größe oder Struktur.'},{icon:'⚖️',title:'Verbindlich für alle',text:'Führungskräfte, Manager und Mitarbeitende — alle müssen die Richtlinie einhalten.'},{icon:'🎯',title:'Was dieses Training bewirkt',text:'Schärft das Bewusstsein, erklärt Grenzen und zeigt dir deine Optionen.'}]}},
    {k:'definition',eyebrow:'02 – Was ist sexuelle Belästigung?',title:'Es geht nicht um Absicht. Es geht um Wirkung.',body:['Sexuelle Belästigung ist unerwünschtes Verhalten sexueller Natur, das eine Person beleidigt, demütigt oder einschüchtert.','Es kann sich um einen einzelnen Vorfall oder ein Verhaltensmuster handeln.','Die entscheidende Frage: War das Verhalten von der betroffenen Person unerwünscht?'],activity:{type:'choice',prompt:'Szenario: Ein Kollege schickt über den Firmenchat einen sexuell expliziten Witz. Die empfangende Person antwortet nicht, fühlt sich aber unwohl. Ist das nach der EOS-Richtlinie sexuelle Belästigung?',options:['Nein — niemand hat etwas gesagt, also war es nicht unerwünscht.','Ja — das Verhalten war sexueller Natur und hat die empfangende Person unwohl fühlen lassen.','Nur wenn es mehr als einmal passiert.'],answer:1,ok:'Richtig. Die Richtlinie stellt klar, dass entscheidend ist, ob das Verhalten von der empfangenden Person unerwünscht war — nicht ob jemand gesprochen hat oder ob es sich wiederholt hat.',bad:'Nicht ganz. Die Richtlinie stellt auf das subjektive Empfinden der betroffenen Person ab. Schweigen bedeutet nicht, dass das Verhalten willkommen war.'}},
    {k:'examples',eyebrow:'03 – Was zählt dazu?',title:'Drei Formen — alle verboten.',body:['Sexuelle Belästigung kann körperlicher, verbaler oder nonverbaler Natur sein.','Die folgenden Beispiele sind nicht abschließend. Im Zweifelsfall frage dich: Ist dieses Verhalten von der anderen Person gewünscht?'],activity:{type:'tabs',tabs:[{label:'Körperlich',items:['Unerwünschter Körperkontakt: Tätscheln, Kneifen, Streicheln, Küssen, Umarmen, Betasten oder unangemessenes Berühren — auch scheinbar zufälliger Kontakt.','Körperliche Gewalt, einschließlich sexueller Übergriffe.','Nutzung beruflicher Drohungen oder Belohnungen zur Erlangung sexueller Gefälligkeiten.']},{label:'Verbal',items:['Sexuell entwürdigende oder entpersönlichende Bemerkungen über Personen oder ihren Körper.','Herabsetzende Kommentare über das Sexualleben einer Person.','Unangemessene sexuelle Geschichten oder Witze.','Unerwünschte Annäherungsversuche oder wiederholte Einladungen zu Dates oder körperlicher Intimität.','Herablassende oder bevormundende Bemerkungen.','Versenden sexuell expliziter Nachrichten.']},{label:'Nonverbal',items:['Ausstellen sexuell expliziten oder anzüglichen Materials.','Sexuell anzügliche Gesten.','Anstarren.','Pfeifen.']}]}},
    {k:'boundaries',eyebrow:'04 – Wo gilt das?',title:'Der Arbeitsplatz ist mehr als das Büro.',body:['Das Verbot gilt auf dem EOS-Gelände und außerhalb des regulären Arbeitsplatzes.','Dies schließt vom Unternehmen gesponserte Veranstaltungen, Dienstreisen, Schulungen und Konferenzen ein.','Jede Person kann betroffen sein, unabhängig vom Geschlecht — auch zwischen Personen desselben Geschlechts.'],activity:{type:'scenario',tag:'Szenario',text:'Beim einem von EOS gesponserten Abendessen macht ein Teammitglied einer Kollegin wiederholt Komplimente zu ihrem Aussehen, die die Kollegin sichtlich unwohl fühlen lassen. Die Kollegin sagt nichts, meidet die Person aber für den Rest des Abends.',question:'Fällt das unter die EOS-Richtlinie?',answer:'Ja. Die Richtlinie deckt von EOS gesponserte Veranstaltungen außerhalb des regulären Arbeitsplatzes ab. Entscheidend ist das Unbehagen der betroffenen Person — nicht ob sie etwas gesagt hat.'}},
    {k:'affected',eyebrow:'05 – Wenn es dir passiert',title:'Du hast mehr Optionen als du denkst.',body:['Du bist nicht verpflichtet, die andere Person direkt zu konfrontieren — besonders in ungleichen Beziehungen.','EOS erkennt an, dass direkte Ansprache nicht immer möglich oder sicher ist.','Welchen Weg du auch wählst — dein Anliegen wird vertraulich und respektvoll behandelt.'],activity:{type:'steps',heading:'Deine Optionen Schritt für Schritt',steps:['Wenn sicher und angemessen: Teile der Person mit, dass ihr Verhalten unerwünscht ist.','Wenn direkter Kontakt nicht sicher oder möglich ist: Wende dich an eine benannte Kontaktperson.','Für einen schnellen und vollständig digitalen Prozess: Melde dich über Speak Up — vertraulich und auf Wunsch anonym.','Du kannst dich auch jederzeit an den externen Ombudsmann der Otto Group wenden.','Externe rechtliche Optionen (Arbeitsgerichte etc.) bleiben verfügbar und werden durch die Nutzung interner Kanäle nicht berührt.']}},
    {k:'reporting',eyebrow:'06 – Meldekanäle',title:'Speak Up: schnell, digital, dokumentiert.',body:['Speak Up ist der bevorzugte interne Kanal von EOS: sicher, dokumentiert und vertraulich.','Anonyme Meldungen sind möglich.','Weitere interne Kontakte stehen ebenfalls zur Verfügung. Nutze den Weg, der sich für dich richtig anfühlt.'],activity:{type:'highlight',items:[{head:'Speak Up',body:'Der bevorzugte Weg. Meldung sicher, jederzeit, vertraulich und bei Bedarf anonym einreichen. Group Compliance wird automatisch benachrichtigt.'},{head:'Interne Kontaktpersonen',body:'Lokale HR, Group HR und Diversity Management sind benannte Anlaufstellen. Sie sind darin geschult, Beschwerden respektvoll und vertraulich zu behandeln.'},{head:'Otto Group Ombudsmann',body:'Ein unabhängiger externer Anwalt mit strenger Schweigepflicht. Meldungen können anonym eingereicht werden; Informationen werden nur mit ausdrücklicher Zustimmung weitergegeben.'}]}},
    {k:'handling',eyebrow:'07 – Nach einer Meldung',title:'Was als Nächstes passiert.',body:['Jede Meldung wird ernst genommen. Ab dem Moment der Kontaktaufnahme ist der Prozess dokumentiert und strukturiert.'],activity:{type:'choice',prompt:'Richtig oder falsch: Wenn du das informelle Beschwerdeverfahren nutzt, kannst du danach keine formelle Beschwerde mehr einreichen.',options:['Richtig — wer zuerst informell vorgeht, verliert den formellen Weg.','Falsch — das informelle Verfahren schließt eine spätere formelle Beschwerde nicht aus.','Nur richtig, wenn das informelle Verfahren erfolgreich abgeschlossen wurde.'],answer:1,ok:'Richtig. Die Richtlinie stellt ausdrücklich klar, dass ein informeller Lösungsversuch die betroffene Person nicht daran hindert, später eine formelle Beschwerde einzureichen.',bad:'Nicht ganz. Die Richtlinie schützt dein Recht, auch nach einem informellen Verfahren eine formelle Beschwerde einzureichen.'}},
    {k:'mechanisms',eyebrow:'08 – Die drei Wege',title:'Informell. Formell. Extern.',body:['Du und deine Kontaktperson entscheiden gemeinsam, welcher Weg für deine Situation der richtige ist.','Es gibt keine falsche Wahl. Deine Wünsche werden jederzeit respektiert.'],activity:{type:'compare',cols:[{head:'Informell',body:'Eine Kontaktperson spricht mit der beschuldigten Person. Ein moderiertes Gespräch kann stattfinden — nur mit deiner Zustimmung und nur wenn du dich sicher fühlst.'},{head:'Formell',body:'Eine leitende HR-Person leitet eine vollständige Untersuchung ein. Alle Beteiligten werden getrennt befragt. Ein schriftlicher Bericht mit Ergebnissen und Empfehlungen wird erstellt.'},{head:'Extern',body:'Du kannst jederzeit externe Stellen oder den Ombudsmann der Otto Group kontaktieren. Dieses Recht wird durch die vorherige Nutzung interner Kanäle nicht beeinträchtigt.'}]}},
    {k:'protection',eyebrow:'09 – Dein Schutz',title:'Eine Meldung bringt dich nicht in Gefahr.',body:['EOS verpflichtet sich, alle Personen zu schützen, die in gutem Glauben eine Beschwerde einreichen.','Deine Anonymität wird so weit wie möglich gewahrt, sofern keine gesetzlichen Anforderungen etwas anderes verlangen.','Die Person, über die du berichtest, gilt bis zum Abschluss einer Untersuchung als unschuldig.'],activity:{type:'flip',prompt:'Drei Garantien',cards:[{icon:'🔒',title:'Vertraulichkeit',text:'Alle Beschwerden werden während des gesamten Prozesses respektvoll und vertraulich behandelt.'},{icon:'🛡️',title:'Kein Nachteil',text:'Niemand, der in gutem Glauben eine Meldung erstattet, wird benachteiligt, bestraft oder schikaniert.'},{icon:'⚖️',title:'Faires Verfahren',text:'Die Unschuldsvermutung gilt für jede Person, die der Belästigung beschuldigt wird.'}]}},
    {k:'sanctions',eyebrow:'10 – Konsequenzen',title:'Bestätigte Fälle haben reale Folgen.',body:['Jede Person, bei der sexuelle Belästigung nachgewiesen wurde, muss mit angemessenen Disziplinarmaßnahmen rechnen.','Die Schwere hängt von Häufigkeit, Umständen und geltendem lokalem Recht ab.','EOS behandelt diese Fälle nicht als Bagatelle.'],activity:{type:'list',heading:'Mögliche Maßnahmen',items:['Mündliche oder schriftliche Abmahnung','Negative Leistungsbeurteilung','Kürzung variabler Vergütung (soweit rechtlich zulässig)','Versetzung in eine andere Rolle oder Abteilung','Degradierung','Suspendierung','Kündigung (in schwerwiegenden Fällen fristlos)']}},
    {k:'manager',managerOnly:true,eyebrow:'11 – Deine Rolle (Führungskraft / HR)',title:'Wenn jemand zu dir kommt: Was tun?',body:['Du bist oft die erste Person, an die sich betroffene Mitarbeitende wenden.','Wie du in diesem Moment reagierst, ist entscheidend.','Deine Aufgabe ist nicht, zu ermitteln — sondern zuzuhören, zu informieren und zu unterstützen.'],activity:{type:'steps',heading:'Wenn ein Anliegen vorgebracht wird',steps:['Nimm es ernst. Verharmlosen oder abtun ist keine Option.','Höre zu ohne zu urteilen und ohne konkrete Ergebnisse zu versprechen.','Informiere die Person über verfügbare Verfahren: informell, formell und extern.','Dokumentiere sorgfältig. Empfehle Speak Up für einen schnellen digitalen Nachweis.','Stimme die nächsten Schritte mit der betroffenen Person ab — respektiere jederzeit ihre Wünsche.','Wahre strikte Vertraulichkeit. Wende das Need-to-know-Prinzip an.']}},
    {k:'manager2',managerOnly:true,eyebrow:'12 – Formelles Verfahren (Führungskraft / HR)',title:'Was das formelle Verfahren von dir verlangt.',body:['Sobald eine formelle Beschwerde eingereicht wird, übernimmt eine leitende HR-Person die Verantwortung.','Untersuchungen werden unparteiisch, vertraulich und zügig durchgeführt.','Deine Rolle: den Prozess unterstützen, nicht leiten — es sei denn, du wirst formell als Ermittler:in ernannt.'],activity:{type:'scenario',tag:'Führungskraft / HR Szenario',text:'Eine Mitarbeiterin berichtet dir, dass sie wiederholt unerwünschte Annäherungsversuche von einer gleichrangigen Person erlebt hat. Sie ist sich noch nicht sicher, was sie tun möchte, und fragt, ob sie jetzt entscheiden muss.',question:'Wie solltest du reagieren?',answer:'Teile ihr mit, dass sie nicht sofort entscheiden muss. Erkläre die verfügbaren Wege: informelle Lösung, formelle Beschwerde und externe Optionen. Hebe Speak Up als den schnellsten und sichersten digitalen Weg hervor. Mache deutlich, dass ihre Wünsche jederzeit respektiert werden und dass eine Meldung keine Nachteile für sie hat.'}},
    {k:'close',eyebrow:'Abschluss',title:'Du bist jetzt vorbereitet.',body:['Du weißt, was sexuelle Belästigung gemäß der EOS-Richtlinie bedeutet.','Du kennst die Meldekanäle und was nach einer Meldung passiert.','Du kennst deine Rechte und — als Führungskraft oder HR — deine Verantwortlichkeiten.','Respektvolles Verhalten ist die gemeinsame Verantwortung aller.'],activity:{type:'commit',text:'Ich verstehe die wesentlichen Grundsätze der EOS-Unternehmensrichtlinie zu sexueller Belästigung und weiß, wo ich Unterstützung und Meldemöglichkeiten finde.'}}
  ]
};

CONTENT['fr'] = {
  ui:{quizHint:'Veuillez sélectionner la bonne réponse pour continuer.',back:'Retour',continue:'Continuer',finish:'Terminer',restart:'Recommencer',selectLang:'Choisir la langue',selectRole:'Qui êtes-vous?',employee:'Employé(e)',manager:'Responsable / Ressources Humaines',empDesc:'Découvrez ce que signifie le harcèlement sexuel, où se situent les limites et quelles options s\'offrent à vous si vous êtes concerné(e).',mgrDesc:'Tout le contenu employé, plus un module dédié à l\'accompagnement des personnes qui vous font part d\'une préoccupation.',startBtn:'Démarrer la formation',complete:'Formation terminée',completeMsg:'Merci d\'avoir suivi la formation EOS sur le respect au travail.',tapHint:'Touchez une carte pour révéler',showGuidance:'Afficher les conseils'},
  modules:[
    {k:'purpose',eyebrow:'01 – Pourquoi c\'est important',title:'Tolérance zéro signifie zéro exception.',body:['EOS a une tolérance zéro pour le harcèlement sexuel — en tout lieu, tout contexte et tout format.','Cette politique s\'applique mondialement à toutes les sociétés du Groupe EOS et est contraignante pour tous les employés et dirigeants.','Cette formation vous aide à comprendre ce qui est couvert, ce que vous pouvez faire et comment EOS traite les signalements.'],activity:{type:'flip',prompt:'Trois points essentiels',cards:[{icon:'🌍',title:'Application mondiale',text:'Toutes les sociétés du Groupe EOS sont concernées, quelle que soit leur taille ou structure.'},{icon:'⚖️',title:'Obligatoire pour tous',text:'Dirigeants, managers et employés — tous doivent respecter cette politique.'},{icon:'🎯',title:'Objectif de la formation',text:'Sensibiliser, expliquer les limites et vous montrer vos options.'}]}},
    {k:'definition',eyebrow:'02 – Qu\'est-ce que le harcèlement sexuel?',title:'Ce n\'est pas une question d\'intention. C\'est une question d\'impact.',body:['Le harcèlement sexuel est un comportement non désiré à caractère sexuel qui offense, humilie ou intimide une personne.','Il peut s\'agir d\'un incident isolé ou d\'un comportement répété.','La question clé: ce comportement était-il non désiré par la personne visée?'],activity:{type:'choice',prompt:'Scénario: Un collègue envoie une blague à caractère sexuellement explicite via la messagerie d\'entreprise. Le destinataire ne répond pas mais se sent mal à l\'aise. S\'agit-il de harcèlement sexuel selon la politique EOS?',options:['Non — personne n\'a rien dit, donc ce n\'était pas non désiré.','Oui — le comportement était à caractère sexuel et a mis le destinataire mal à l\'aise.','Seulement si cela se produit plus d\'une fois.'],answer:1,ok:'Correct. La politique précise que ce qui compte, c\'est si le comportement est non désiré par le destinataire — pas si quelqu\'un a protesté, ni si cela s\'est répété.',bad:'Pas tout à fait. La politique se concentre sur le caractère non désiré du comportement pour le destinataire. Le silence ne signifie pas que le comportement était bienvenu.'}},
    {k:'examples',eyebrow:'03 – Qu\'est-ce qui est concerné?',title:'Trois formes — toutes interdites.',body:['Le harcèlement sexuel peut être physique, verbal ou non verbal.','Les exemples ci-dessous ne sont pas exhaustifs. En cas de doute, demandez-vous: ce comportement est-il désiré par l\'autre personne?'],activity:{type:'tabs',tabs:[{label:'Physique',items:['Contact non désiré: tapoter, pincer, caresser, embrasser, enlacer, peloter ou toucher de manière inappropriée — y compris les contacts apparemment accidentels.','Violence physique, y compris les agressions sexuelles.','Utilisation de menaces ou de récompenses professionnelles pour obtenir des faveurs sexuelles.']},{label:'Verbal',items:['Remarques sexuellement dégradantes ou dépersonnalisantes sur des personnes ou leur corps.','Commentaires dégradants sur la vie sexuelle d\'une personne.','Histoires ou blagues sexuelles inappropriées.','Avances non désirées ou invitations répétées à des rendez-vous ou à l\'intimité physique.','Remarques condescendantes ou paternalistes.','Envoi de messages à caractère sexuellement explicite.']},{label:'Non verbal',items:['Affichage de matériel sexuellement explicite ou suggestif.','Gestes à connotation sexuelle.','Regards insistants.','Sifflements.']}]}},
    {k:'boundaries',eyebrow:'04 – Où s\'applique-t-il?',title:'Le lieu de travail est plus grand que le bureau.',body:['L\'interdiction s\'applique sur les locaux EOS et en dehors du lieu de travail habituel.','Cela inclut les événements sociaux organisés par l\'entreprise, les voyages d\'affaires, les sessions de formation et les conférences.','Toute personne peut être concernée, quel que soit son sexe — y compris entre personnes du même sexe.'],activity:{type:'scenario',tag:'Scénario',text:'Lors d\'un dîner organisé par EOS, un membre de l\'équipe fait à plusieurs reprises des compliments à un(e) collègue sur son apparence, ce qui le/la met visiblement mal à l\'aise. Le/la collègue ne dit rien mais évite la personne pour le reste de la soirée.',question:'Cela relève-t-il de la politique EOS?',answer:'Oui. La politique couvre les événements organisés par EOS en dehors du lieu de travail habituel. Ce qui compte, c\'est le malaise ressenti par le/la destinataire — pas s\'il/elle a dit quelque chose.'}},
    {k:'affected',eyebrow:'05 – Si cela vous arrive',title:'Vous avez plus d\'options que vous ne le pensez.',body:['Vous n\'êtes pas tenu(e) de confronter directement l\'autre personne — surtout dans des relations inégales.','EOS reconnaît que s\'exprimer directement n\'est pas toujours possible ou sûr.','Quelle que soit la voie que vous choisissez, vos préoccupations seront traitées avec confidentialité et respect.'],activity:{type:'steps',heading:'Vos options, étape par étape',steps:['Si cela est sûr et approprié: faites savoir à la personne que son comportement est non désiré.','Si le contact direct semble dangereux ou impossible: contactez une personne de contact désignée.','Pour un processus rapide et entièrement numérique: signalez via Speak Up — de manière confidentielle et, si vous le souhaitez, anonyme.','Vous pouvez également contacter à tout moment l\'ombudsman externe du Groupe Otto.','Les options juridiques externes (tribunaux du travail, etc.) restent disponibles et ne sont pas affectées par l\'utilisation des canaux internes.']}},
    {k:'reporting',eyebrow:'06 – Canaux de signalement',title:'Speak Up: rapide, numérique, documenté.',body:['Speak Up est le canal interne privilégié d\'EOS: sécurisé, documenté et confidentiel.','Le signalement anonyme est possible si souhaité.','D\'autres contacts internes sont également disponibles. Utilisez celui qui vous convient le mieux.'],activity:{type:'highlight',items:[{head:'Speak Up',body:'La voie privilégiée. Soumettez un rapport en toute sécurité, à tout moment, de manière confidentielle et anonyme si nécessaire. Le Groupe Compliance est automatiquement notifié.'},{head:'Personnes de contact internes',body:'Les RH locales, les RH du Groupe et la Gestion de la diversité sont des points de contact désignés. Ils sont formés pour traiter les plaintes avec respect et confidentialité.'},{head:'Ombudsman du Groupe Otto',body:'Un avocat externe indépendant, soumis à une stricte confidentialité. Les rapports peuvent être soumis anonymement et les informations ne sont partagées qu\'avec votre consentement explicite.'}]}},
    {k:'handling',eyebrow:'07 – Après un signalement',title:'Voici exactement ce qui se passe ensuite.',body:['Chaque signalement est pris au sérieux. Dès le moment où vous prenez contact, le processus est documenté et structuré.'],activity:{type:'choice',prompt:'Vrai ou faux: Si vous utilisez la procédure de plainte informelle, vous ne pouvez plus déposer de plainte formelle par la suite.',options:['Vrai — utiliser la voie informelle en premier ferme la voie formelle.','Faux — la procédure informelle n\'empêche pas de déposer une plainte formelle ultérieurement.','Seulement vrai si la procédure informelle a été menée à bien.'],answer:1,ok:'Correct. La politique stipule explicitement que la tentative d\'une résolution informelle n\'empêche pas la personne concernée de déposer une plainte formelle ultérieurement.',bad:'Pas tout à fait. La politique protège votre droit de passer à une plainte formelle même si vous avez d\'abord essayé de résoudre le problème de manière informelle.'}},
    {k:'mechanisms',eyebrow:'08 – Les trois voies',title:'Informelle. Formelle. Externe.',body:['Vous et votre personne de contact désignée décidez ensemble quelle voie convient à votre situation.','Il n\'y a pas de mauvais choix. Vos souhaits seront respectés à tout moment.'],activity:{type:'compare',cols:[{head:'Informelle',body:'Une personne de contact désignée parle avec l\'auteur présumé. Une discussion facilitée peut avoir lieu — uniquement avec votre consentement et seulement si vous vous sentez en sécurité.'},{head:'Formelle',body:'Un(e) représentant(e) RH senior lance une enquête complète. Toutes les parties sont interrogées séparément. Un rapport écrit avec les conclusions et recommandations est préparé.'},{head:'Externe',body:'Vous pouvez contacter à tout moment les instances juridiques externes ou l\'ombudsman du Groupe Otto. Ce droit n\'est pas affecté par l\'utilisation préalable des canaux internes.'}]}},
    {k:'protection',eyebrow:'09 – Votre protection',title:'Faire un signalement ne vous mettra pas en danger.',body:['EOS s\'engage à protéger toute personne qui soulève une préoccupation de bonne foi.','Votre anonymat sera protégé dans toute la mesure du possible, sauf si des exigences légales l\'imposent autrement.','La personne que vous signalez est présumée innocente jusqu\'à ce qu\'une enquête conclue autrement.'],activity:{type:'flip',prompt:'Trois garanties',cards:[{icon:'🔒',title:'Confidentialité',text:'Toutes les plaintes sont traitées avec respect et confidentialité tout au long du processus.'},{icon:'🛡️',title:'Pas de représailles',text:'Personne qui signale de bonne foi ne sera désavantagé(e), sanctionné(e) ou victimisé(e).'},{icon:'⚖️',title:'Procédure équitable',text:'La présomption d\'innocence s\'applique à toute personne accusée de harcèlement.'}]}},
    {k:'sanctions',eyebrow:'10 – Conséquences',title:'Les cas confirmés entraînent de vraies conséquences.',body:['Toute personne reconnue coupable de harcèlement sexuel fera l\'objet de mesures disciplinaires appropriées.','La gravité dépend de la fréquence, des circonstances et du droit local applicable.','EOS ne traite pas ces cas comme anodins.'],activity:{type:'list',heading:'Mesures possibles',items:['Avertissement verbal ou écrit','Évaluation de performance négative','Réduction de la rémunération variable (dans la mesure où la loi le permet)','Mutation vers un autre poste ou département','Rétrogradation','Suspension','Licenciement (dans les cas graves, avec effet immédiat)']}},
    {k:'manager',managerOnly:true,eyebrow:'11 – Votre rôle (Responsable / RH)',title:'Quand quelqu\'un vient vous voir: que faire?',body:['Vous êtes souvent la première personne vers laquelle se tourne un(e) employé(e) concerné(e).','Votre réaction à ce moment-là est déterminante.','Votre rôle n\'est pas d\'enquêter — c\'est d\'écouter, d\'informer et de soutenir.'],activity:{type:'steps',heading:'Quand une préoccupation est soulevée',steps:['Prenez-la au sérieux. Ne minimisez pas et ne rejetez pas ce que vous entendez.','Écoutez sans juger et sans promettre de résultats spécifiques.','Informez la personne des procédures disponibles: informelle, formelle et externe.','Documentez clairement. Recommandez Speak Up pour une trace numérique rapide.','Coordonnez les prochaines étapes avec la personne concernée — respectez ses souhaits à tout moment.','Maintenez une stricte confidentialité. Appliquez le principe du besoin d\'en connaître.']}},
    {k:'manager2',managerOnly:true,eyebrow:'12 – Traitement formel (Responsable / RH)',title:'Ce que la procédure formelle exige de vous.',body:['Une fois une plainte formelle déposée, un(e) représentant(e) RH senior prend en charge le dossier.','Les enquêtes sont menées de manière impartiale, confidentielle et rapide.','Votre rôle: soutenir le processus, pas le diriger — sauf si vous êtes formellement désigné(e) comme enquêteur/enquêtrice.'],activity:{type:'scenario',tag:'Scénario Responsable / RH',text:'Une employée vous dit avoir subi des avances non désirées répétées de la part d\'un(e) collègue de même niveau. Elle n\'est pas sûre de ce qu\'elle veut faire et vous demande si elle doit décider maintenant.',question:'Comment devriez-vous répondre?',answer:'Faites-lui savoir qu\'elle n\'a pas à décider immédiatement. Expliquez les voies disponibles: résolution informelle, plainte formelle et options externes. Mettez en avant Speak Up comme la voie numérique la plus rapide et la plus sécurisée. Précisez que ses souhaits seront respectés tout au long et que signaler un problème ne la désavantagera pas.'}},
    {k:'close',eyebrow:'Final',title:'Vous êtes maintenant prêt(e).',body:['Vous savez ce que signifie le harcèlement sexuel selon la politique EOS.','Vous connaissez les canaux de signalement et ce qui se passe après un signalement.','Vous connaissez vos droits et — si vous êtes responsable ou RH — vos responsabilités.','Un comportement respectueux est la responsabilité partagée de tous.'],activity:{type:'commit',text:'Je comprends les principes clés de la politique d\'entreprise EOS sur le harcèlement sexuel et je sais où trouver soutien et options de signalement.'}}
  ]
};

CONTENT['nl'] = {
  ui:{quizHint:'Selecteer het juiste antwoord om verder te gaan.',back:'Terug',continue:'Doorgaan',finish:'Afronden',restart:'Opnieuw starten',selectLang:'Selecteer uw taal',selectRole:'Wie bent u?',employee:'Medewerker',manager:'Leidinggevende / Human Resources',empDesc:'Leer wat seksuele intimidatie betekent, waar de grenzen liggen en welke opties u heeft als u ermee te maken krijgt.',mgrDesc:'Alle medewerkerscontent, plus een apart module over hoe u mensen kunt ondersteunen die met een klacht naar u toe komen.',startBtn:'Training starten',complete:'Training afgerond',completeMsg:'Bedankt voor het voltooien van de EOS Respectful Workplace Training.',tapHint:'Tik op een kaart om te onthullen',showGuidance:'Advies tonen'},
  modules:[
    {k:'purpose',eyebrow:'01 – Waarom dit belangrijk is',title:'Nultolerantie betekent nul uitzonderingen.',body:['EOS tolereert seksuele intimidatie niet — op geen enkele locatie, in geen enkele omgeving, in geen enkel format.','Dit beleid geldt wereldwijd voor alle bedrijven van de EOS Groep en is bindend voor alle medewerkers en leidinggevenden.','Deze training helpt u te begrijpen wat er onder valt, wat u kunt doen en hoe EOS meldingen afhandelt.'],activity:{type:'flip',prompt:'Drie dingen om te weten',cards:[{icon:'🌍',title:'Wereldwijd van toepassing',text:'Alle bedrijven van de EOS Groep vallen hieronder, ongeacht omvang of structuur.'},{icon:'⚖️',title:'Bindend voor iedereen',text:'Leidinggevenden, managers en medewerkers — allen moeten zich hieraan houden.'},{icon:'🎯',title:'Wat deze training doet',text:'Bewustzijn vergroten, grenzen verduidelijken en uw opties laten zien.'}]}},
    {k:'definition',eyebrow:'02 – Wat is seksuele intimidatie?',title:'Het gaat niet om bedoeling. Het gaat om impact.',body:['Seksuele intimidatie is ongewenst gedrag van seksuele aard dat iemand beledigt, vernedert of intimideert.','Het kan een eenmalig incident zijn of een patroon van gedrag.','De kernvraag: was het gedrag ongewenst door degene op wie het gericht was?'],activity:{type:'choice',prompt:'Scenario: Een collega stuurt een seksueel expliciete grap via de bedrijfschat. De ontvanger reageert niet maar voelt zich ongemakkelijk. Is dit seksuele intimidatie volgens het EOS-beleid?',options:['Nee — niemand heeft iets gezegd, dus het was niet ongewenst.','Ja — het gedrag was van seksuele aard en maakte de ontvanger ongemakkelijk.','Alleen als het meer dan één keer gebeurt.'],answer:1,ok:'Correct. Het beleid maakt duidelijk dat het erom gaat of het gedrag ongewenst was voor de ontvanger — niet of iemand protesteerde, en niet of het zich herhaalde.',bad:'Niet helemaal. Het beleid richt zich op de vraag of het gedrag ongewenst was voor de ontvanger. Stilzwijgen betekent niet dat het gedrag welkom was.'}},
    {k:'examples',eyebrow:'03 – Wat telt mee?',title:'Drie vormen — alle verboden.',body:['Seksuele intimidatie kan fysiek, verbaal of non-verbaal zijn.','De onderstaande voorbeelden zijn niet uitputtend. Vraag uzelf bij twijfel af: is dit gedrag gewenst door de andere persoon?'],activity:{type:'tabs',tabs:[{label:'Fysiek',items:['Ongewenst contact: kloppen, knijpen, strelen, kussen, omhelzen, betasten of ongepast aanraken — inclusief schijnbaar toevallig contact.','Fysiek geweld, inclusief seksueel misbruik.','Gebruik van werkgerelateerde dreigingen of beloningen om seksuele gunsten te vragen.']},{label:'Verbaal',items:['Seksueel degraderende of depersonaliserende opmerkingen over personen of hun lichaam.','Degraderende opmerkingen over iemands seksleven.','Ongepaste seksuele verhalen of grappen.','Ongewenste avances of herhaalde uitnodigingen voor afspraken of fysieke intimiteit.','Neerbuigende of paternalistische opmerkingen.','Versturen van seksueel expliciete berichten.']},{label:'Non-verbaal',items:['Weergeven van seksueel expliciet of suggestief materiaal.','Seksueel suggestieve gebaren.','Loeren.','Fluiten.']}]}},
    {k:'boundaries',eyebrow:'04 – Waar geldt het?',title:'De werkplek is groter dan het kantoor.',body:['Het verbod geldt op EOS-locaties en buiten de reguliere werkplek.','Dit omvat door het bedrijf gesponsorde sociale evenementen, zakenreizen, trainingssessies en conferenties.','Iedereen kan getroffen worden, ongeacht geslacht — ook tussen personen van hetzelfde geslacht.'],activity:{type:'scenario',tag:'Scenario',text:'Tijdens een door EOS gesponsord diner maakt een teamlid herhaaldelijk complimenten aan een collega over zijn/haar uiterlijk op een manier die de collega zichtbaar ongemakkelijk maakt. De collega zegt niets maar vermijdt de persoon voor de rest van de avond.',question:'Valt dit onder het EOS-beleid?',answer:'Ja. Het beleid dekt door EOS gesponsorde evenementen buiten de reguliere werkplek. Het ongemak van de ontvanger is bepalend — niet of hij/zij iets heeft gezegd.'}},
    {k:'affected',eyebrow:'05 – Als het u overkomt',title:'U heeft meer opties dan u denkt.',body:['U bent niet verplicht de andere persoon direct te confronteren — zeker niet in ongelijke verhoudingen.','EOS erkent dat direct spreken niet altijd mogelijk of veilig is.','Welke weg u ook kiest, uw melding wordt vertrouwelijk en respectvol behandeld.'],activity:{type:'steps',heading:'Uw opties, stap voor stap',steps:['Waar veilig en passend: laat de persoon weten dat het gedrag ongewenst is.','Als direct contact onveilig of onmogelijk voelt: neem contact op met een aangewezen contactpersoon.','Voor een snel en volledig digitaal proces: meld via Speak Up — vertrouwelijk en, indien gewenst, anoniem.','U kunt ook te allen tijde contact opnemen met de externe ombudsman van de Otto Groep.','Externe juridische opties (arbeidsrechtbanken, etc.) blijven beschikbaar en worden niet beïnvloed door gebruik van interne kanalen.']}},
    {k:'reporting',eyebrow:'06 – Meldingskanalen',title:'Speak Up: snel, digitaal, gedocumenteerd.',body:['Speak Up is het voorkeurskanaal van EOS: veilig, gedocumenteerd en vertrouwelijk.','Anonieme meldingen zijn mogelijk waar gewenst.','Andere interne contacten zijn ook beschikbaar. Gebruik wat voor u het meest geschikt voelt.'],activity:{type:'highlight',items:[{head:'Speak Up',body:'De voorkeursroute. Dien veilig, te allen tijde, vertrouwelijk en anoniem een melding in indien nodig. Group Compliance wordt automatisch op de hoogte gesteld.'},{head:'Interne contactpersonen',body:'Lokale HR, Group HR en Diversity Management zijn aangewezen contactpunten. Zij zijn getraind om klachten respectvol en vertrouwelijk te behandelen.'},{head:'Otto Groep Ombudsman',body:'Een onafhankelijke externe advocaat met strikte geheimhouding. Meldingen kunnen anoniem worden ingediend en informatie wordt alleen gedeeld met uw uitdrukkelijke toestemming.'}]}},
    {k:'handling',eyebrow:'07 – Na een melding',title:'Dit is precies wat er daarna gebeurt.',body:['Elke melding wordt serieus genomen. Vanaf het moment dat u contact opneemt, is het proces gedocumenteerd en gestructureerd.'],activity:{type:'choice',prompt:'Waar of niet waar: Als u de informele klachtenprocedure gebruikt, kunt u daarna geen formele klacht meer indienen.',options:['Waar — wie informeel begint, sluit de formele weg af.','Niet waar — de informele procedure verhindert een latere formele klacht niet.','Alleen waar als de informele procedure succesvol werd afgerond.'],answer:1,ok:'Correct. Het beleid stelt uitdrukkelijk dat een poging tot informele oplossing de betrokken persoon niet belet later een formele klacht in te dienen.',bad:'Niet helemaal. Het beleid beschermt uw recht om ook na een informele procedure een formele klacht in te dienen.'}},
    {k:'mechanisms',eyebrow:'08 – De drie routes',title:'Informeel. Formeel. Extern.',body:['U en uw aangewezen contactpersoon beslissen samen welke route geschikt is voor uw situatie.','Er is geen verkeerde keuze. Uw wensen worden te allen tijde gerespecteerd.'],activity:{type:'compare',cols:[{head:'Informeel',body:'Een aangewezen contactpersoon spreekt met de vermeende dader. Een begeleide bespreking kan plaatsvinden — alleen met uw toestemming en alleen als u zich veilig voelt.'},{head:'Formeel',body:'Een senior HR-vertegenwoordiger start een volledig onderzoek. Alle partijen worden apart gehoord. Een schriftelijk rapport met bevindingen en aanbevelingen wordt opgesteld.'},{head:'Extern',body:'U kunt te allen tijde contact opnemen met externe juridische instanties of de ombudsman van de Otto Groep. Dit recht wordt niet beïnvloed door eerst gebruik te maken van interne kanalen.'}]}},
    {k:'protection',eyebrow:'09 – Uw bescherming',title:'Een melding doen brengt u niet in gevaar.',body:['EOS verbindt zich ertoe iedereen te beschermen die te goeder trouw een melding doet.','Uw anonimiteit wordt zo veel mogelijk beschermd, tenzij wettelijke vereisten anders vereisen.','De persoon over wie u een melding doet, wordt als onschuldig beschouwd totdat een onderzoek anders concludeert.'],activity:{type:'flip',prompt:'Drie garanties',cards:[{icon:'🔒',title:'Vertrouwelijkheid',text:'Alle klachten worden gedurende het gehele proces respectvol en vertrouwelijk behandeld.'},{icon:'🛡️',title:'Geen vergelding',text:'Niemand die te goeder trouw een melding doet, wordt benadeeld, bestraft of slachtoffer gemaakt.'},{icon:'⚖️',title:'Eerlijk proces',text:'Het vermoeden van onschuld geldt voor iedereen die beschuldigd wordt van intimidatie.'}]}},
    {k:'sanctions',eyebrow:'10 – Gevolgen',title:'Bevestigde gevallen leiden tot echte consequenties.',body:['Iedereen die seksuele intimidatie pleegt, krijgt passende disciplinaire maatregelen opgelegd.','De ernst hangt af van frequentie, omstandigheden en toepasselijk lokaal recht.','EOS behandelt deze gevallen niet als onbelangrijk.'],activity:{type:'list',heading:'Mogelijke maatregelen',items:['Mondelinge of schriftelijke waarschuwing','Negatieve prestatiebeoordeling','Verlaging van variabele beloning (waar wettelijk toegestaan)','Overplaatsing naar een andere rol of afdeling','Degradatie','Schorsing','Ontslag (in ernstige gevallen, met onmiddellijke ingang)']}},
    {k:'manager',managerOnly:true,eyebrow:'11 – Uw rol (Leidinggevende / HR)',title:'Als iemand naar u toe komt: wat te doen.',body:['U bent vaak de eerste persoon naar wie een getroffen medewerker zich wendt.','Hoe u op dat moment reageert, is van groot belang.','Uw taak is niet om te onderzoeken — maar om te luisteren, te informeren en te ondersteunen.'],activity:{type:'steps',heading:'Wanneer een klacht wordt geuit',steps:['Neem het serieus. Minimaliseer of verwerp niet wat u hoort.','Luister zonder te oordelen en zonder specifieke uitkomsten te beloven.','Informeer de persoon over beschikbare procedures: informeel, formeel en extern.','Documenteer duidelijk. Adviseer Speak Up voor een snel digitaal dossier.','Coördineer de vervolgstappen met de betrokken persoon — respecteer hun wensen te allen tijde.','Handhaaf strikte vertrouwelijkheid. Pas het need-to-know-principe toe.']}},
    {k:'manager2',managerOnly:true,eyebrow:'12 – Formele afhandeling (Leidinggevende / HR)',title:'Wat de formele procedure van u vraagt.',body:['Zodra een formele klacht wordt ingediend, neemt een senior HR-vertegenwoordiger de leiding.','Onderzoeken worden onpartijdig, vertrouwelijk en snel uitgevoerd.','Uw rol: het proces ondersteunen, niet leiden — tenzij u formeel als onderzoeker bent aangewezen.'],activity:{type:'scenario',tag:'Leidinggevende / HR scenario',text:'Een medewerker vertelt u dat zij herhaaldelijk ongewenste avances heeft ervaren van een gelijke collega. Ze weet nog niet wat ze wil doen en vraagt of ze nu moet beslissen.',question:'Hoe moet u reageren?',answer:'Laat haar weten dat ze niet onmiddellijk hoeft te beslissen. Leg de beschikbare routes uit: informele oplossing, formele klacht en externe opties. Wijs op Speak Up als de snelste en veiligste digitale route. Maak duidelijk dat haar wensen gedurende het hele traject worden gerespecteerd en dat een melding haar niet in een nadelige positie brengt.'}},
    {k:'close',eyebrow:'Afsluitend',title:'U bent nu klaar.',body:['U weet wat seksuele intimidatie betekent volgens het EOS-beleid.','U kent de meldingskanalen en wat er na een melding gebeurt.','U kent uw rechten en — als leidinggevende of HR — uw verantwoordelijkheden.','Respectvol gedrag is ieders gedeelde verantwoordelijkheid.'],activity:{type:'commit',text:'Ik begrijp de kernprincipes van het EOS Corporate Beleid inzake Seksuele Intimidatie en weet waar ik ondersteuning en meldingsopties kan vinden.'}}
  ]
};

CONTENT['es'] = {
  ui:{quizHint:'Por favor, selecciona la respuesta correcta para continuar.',back:'Atrás',continue:'Continuar',finish:'Finalizar',restart:'Empezar de nuevo',selectLang:'Seleccionar idioma',selectRole:'¿Quién eres?',employee:'Empleado/a',manager:'Responsable / Recursos Humanos',empDesc:'Aprende qué significa el acoso sexual, cuáles son los límites y qué opciones tienes si te ves afectado/a.',mgrDesc:'Todo el contenido para empleados, más un módulo dedicado sobre cómo apoyar a las personas que acuden a ti con una preocupación.',startBtn:'Iniciar formación',complete:'Formación completada',completeMsg:'Gracias por completar la formación de EOS sobre el respeto en el lugar de trabajo.',tapHint:'Toca una tarjeta para revelar',showGuidance:'Mostrar orientación'},
  modules:[
    {k:'purpose',eyebrow:'01 – Por qué importa',title:'Tolerancia cero significa cero excepciones.',body:['EOS tiene tolerancia cero con el acoso sexual — en cualquier lugar, entorno o formato.','Esta política se aplica en todo el mundo a todas las empresas del Grupo EOS y es vinculante para todos los empleados y directivos.','Esta formación te ayuda a entender qué está cubierto, qué puedes hacer y cómo EOS gestiona las denuncias.'],activity:{type:'flip',prompt:'Tres cosas que saber',cards:[{icon:'🌍',title:'Aplicación mundial',text:'Todas las empresas del Grupo EOS están cubiertas, independientemente de su tamaño o estructura.'},{icon:'⚖️',title:'Vinculante para todos',text:'Directivos, managers y empleados — todos deben cumplirla.'},{icon:'🎯',title:'Para qué sirve esta formación',text:'Aumentar la concienciación, explicar los límites y mostrarte tus opciones.'}]}},
    {k:'definition',eyebrow:'02 – ¿Qué es el acoso sexual?',title:'No se trata de la intención. Se trata del impacto.',body:['El acoso sexual es una conducta no deseada de naturaleza sexual que ofende, humilla o intimida a una persona.','Puede ser un incidente aislado o un patrón de comportamiento.','La pregunta clave: ¿era esta conducta no deseada por la persona a quien iba dirigida?'],activity:{type:'choice',prompt:'Escenario: Un compañero envía un chiste sexualmente explícito por el chat de empresa. El receptor no responde pero se siente incómodo. ¿Es esto acoso sexual según la política de EOS?',options:['No — nadie dijo nada, así que no era no deseado.','Sí — la conducta era de naturaleza sexual e hizo sentir incómodo al receptor.','Solo si ocurre más de una vez.'],answer:1,ok:'Correcto. La política deja claro que lo que importa es si la conducta es no deseada por el receptor — no si alguien protestó ni si ocurrió repetidamente.',bad:'No del todo. La política se centra en si la conducta era no deseada por el receptor. El silencio no significa que la conducta fuera bienvenida.'}},
    {k:'examples',eyebrow:'03 – ¿Qué cuenta?',title:'Tres formas — todas prohibidas.',body:['El acoso sexual puede ser físico, verbal o no verbal.','Los ejemplos siguientes no son exhaustivos. En caso de duda, pregúntate: ¿es esta conducta deseada por la otra persona?'],activity:{type:'tabs',tabs:[{label:'Físico',items:['Contacto no deseado: palmadas, pellizcos, caricias, besos, abrazos, manoseos o tocamientos inapropiados — incluido el contacto aparentemente accidental.','Violencia física, incluida la agresión sexual.','Uso de amenazas o recompensas laborales para solicitar favores sexuales.']},{label:'Verbal',items:['Comentarios sexualmente degradantes o despersonalizadores sobre personas o su cuerpo.','Comentarios degradantes sobre la vida sexual de alguien.','Historias o chistes sexuales inapropiados.','Insinuaciones no deseadas o invitaciones repetidas a citas o intimidad física.','Comentarios condescendientes o paternalistas.','Envío de mensajes sexualmente explícitos.']},{label:'No verbal',items:['Exhibición de material sexualmente explícito o sugestivo.','Gestos sexualmente sugestivos.','Miradas lascivas.','Silbidos.']}]}},
    {k:'boundaries',eyebrow:'04 – ¿Dónde se aplica?',title:'El lugar de trabajo es más que la oficina.',body:['La prohibición se aplica en las instalaciones de EOS y fuera del lugar de trabajo habitual.','Esto incluye eventos sociales patrocinados por la empresa, viajes de negocios, sesiones de formación y conferencias.','Cualquier persona puede verse afectada, independientemente de su sexo — también entre personas del mismo sexo.'],activity:{type:'scenario',tag:'Escenario',text:'Durante una cena patrocinada por EOS, un miembro del equipo hace repetidamente cumplidos a un/a compañero/a sobre su aspecto de una manera que le hace sentir visiblemente incómodo/a. El/la compañero/a no dice nada pero evita a la persona el resto de la noche.',question:'¿Esto entra dentro de la política de EOS?',answer:'Sí. La política cubre los eventos patrocinados por EOS fuera del lugar de trabajo habitual. Lo que cuenta es el malestar experimentado por el/la receptor/a — no si dijo algo.'}},
    {k:'affected',eyebrow:'05 – Si te ocurre',title:'Tienes más opciones de las que crees.',body:['No estás obligado/a a confrontar directamente a la otra persona — especialmente en relaciones desiguales.','EOS reconoce que hablar directamente puede no ser siempre posible o seguro.','Cualquiera que sea el camino que elijas, tu preocupación será tratada con confidencialidad y respeto.'],activity:{type:'steps',heading:'Tus opciones, paso a paso',steps:['Cuando sea seguro y apropiado: hazle saber a la persona que su conducta no es deseada.','Si el contacto directo parece inseguro o imposible: contacta con una persona de contacto designada.','Para un proceso rápido y totalmente digital: denuncia a través de Speak Up — de forma confidencial y, si lo prefieres, anónima.','También puedes contactar en cualquier momento con el defensor externo del Grupo Otto.','Las opciones legales externas (juzgados laborales, etc.) siguen disponibles y no se ven afectadas por el uso de los canales internos.']}},
